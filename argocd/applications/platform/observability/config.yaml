# 모니터링 설정 리소스 — 대시보드 + Prometheus/Loki 알림 규칙 + NetworkPolicy
# 원본은 observability/, 변환은 scripts/gen-configmaps.py
# wave 1: Ingress가 포함될 수 있는 Grafana 등 wave 2 workload보다 정책·설정을 먼저 준비한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://github.com/UMC-PRODUCT/umc-product-infra.git
    targetRevision: main
    path: manifests/observability
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
