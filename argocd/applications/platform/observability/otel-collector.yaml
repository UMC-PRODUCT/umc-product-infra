# OTel Collector — UMC 애플리케이션용 중앙 OTLP 게이트웨이
# 앱은 OTEL_URL=http://otel-collector.monitoring.svc.cluster.local:4318 만 보면 됨
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    # upgrade는 이 version과 CI render contract을 같은 PR에서 바꾼다.
    targetRevision: 0.156.2
    helm:
      valuesObject:
        fullnameOverride: otel-collector
        mode: deployment
        replicaCount: 1
        serviceAccount:
          automountServiceAccountToken: false
        image:
          # compose와 같은 contrib 배포판. k3s에서는 Preview 로그에만 sampler를 둔다.
          repository: otel/opentelemetry-collector-contrib
          tag: 0.152.0 # compose와 동일
          digest: sha256:f41d7995565df3733b7568702073a9c490792f9c6ac60684fe6a4da21a313f8d
        resources:
          # Cafe24 8코어 기준의 초기 예약량이었다. 실측(kubectl top, 2026-10) cpu 2m, memory 87Mi
          # 기준으로 request를 내렸다. memory_limiter가 limit 기준 퍼센트로 동작하므로 limit은 유지한다.
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 1Gi }
        # 사용하지 않는 receiver port는 Service에서도 닫고, Collector 자체 metrics만
        # Prometheus가 scrape할 수 있게 연다.
        ports:
          jaeger-compact: { enabled: false }
          jaeger-thrift: { enabled: false }
          jaeger-grpc: { enabled: false }
          zipkin: { enabled: false }
          metrics: { enabled: true }
        config:
          receivers:
            # 로컬 스택의 bearer token 인증은 제거 — 클러스터 내부 ClusterIP 통신만 존재
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            # 차트 기본 config에 포함된 미사용 리시버 비활성화
            jaeger: null
            zipkin: null
            prometheus: null
          processors:
            # chart 권장 percentage 설정으로 1Gi container limit의 80%(약 819Mi)를
            # hard limit, 25%(256Mi)를 spike 여유로 둔다. 각 pipeline의 첫
            # processor여야 backpressure가 먼저 걸린다.
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            batch:
              send_batch_size: 1024
              timeout: 5s
            # Preview는 WARN 이상만 남기고 trace 단위 약 10%만 보낸다. 운영·dev와 함께 쓰는 Loki tenant
            # 수집 예산을 덜 쓰고, Loki가 Preview push를 일부 거부할 때 재시도 양도 줄인다.
            # 요청 단위 원인은 Tempo에 전부 남는다.
            filter/preview:
              log_conditions:
                - log.severity_number < SEVERITY_NUMBER_WARN
            probabilistic_sampler/preview:
              sampling_percentage: 10
              # 기동 실패처럼 trace가 없는 로그는 버리지 않고 통과시킨다.
              fail_closed: false
          connectors:
            # Preview push에 운영·dev 로그가 섞이지 않도록 resource 단위로 갈라 보낸다.
            routing/logs:
              default_pipelines: [logs/default]
              table:
                - context: resource
                  condition: IsMatch(attributes["service.name"], "^preview-umc-product-pr[0-9]+$")
                  pipelines: [logs/preview]
          exporters:
            # chart 기본 debug exporter는 어느 pipeline에서도 쓰지 않으며 제거한다.
            debug: null
            otlphttp/prometheus:
              endpoint: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
              tls: { insecure: true }
            otlphttp/tempo:
              endpoint: http://tempo.monitoring.svc.cluster.local:4318
              tls: { insecure: true }
            otlphttp/loki:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
              tls: { insecure: true }
            # 같은 Loki로 보내되 queue를 따로 둔다. Loki가 Preview를 거부해 재시도가 쌓여도
            # 32MiB에서 버려 공유 memory_limiter가 운영 수신까지 막지 않게 한다.
            otlphttp/loki-preview:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
              tls: { insecure: true }
              sending_queue:
                sizer: bytes
                queue_size: 33554432
          # metrics·traces는 메모리 제한 후 묶어서 Prometheus·Tempo로 보낸다. logs는 메모리 제한 후
          # routing/logs로 운영·dev와 Preview를 나누고, 각 경로가 따로 묶어 Loki로 보낸다.
          service:
            pipelines:
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlphttp/prometheus]
              traces:
                receivers: [otlp]
                # 앱도 TRACE_SAMPLING_PROBABILITY=1.0으로 고정한다. 여기서 다시 버리지 않는다.
                processors: [memory_limiter, batch]
                exporters: [otlphttp/tempo]
              logs:
                receivers: [otlp]
                processors: [memory_limiter]
                exporters: [routing/logs]
              # 운영·dev. processor는 pipeline마다 따로 생성되므로 batch도 Preview와 분리된다.
              logs/default:
                receivers: [routing/logs]
                processors: [memory_limiter, batch]
                exporters: [otlphttp/loki]
              logs/preview:
                receivers: [routing/logs]
                processors: [memory_limiter, filter/preview, probabilistic_sampler/preview, batch]
                exporters: [otlphttp/loki-preview]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
