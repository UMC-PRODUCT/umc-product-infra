# kube-prometheus-stack — 현재 단일 SQLite k3s 관측성 스택
# 앱 metrics의 OTel OTLP push와 플랫폼 ServiceMonitor 수집을 함께 유지한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Chart·Operator·CRD·image digest와 render contract을 함께 검증한다.
    # upstream tgz SHA256: 05eae98df0ff6c21877a26a4400780e4bbff248bc3b88694ef8d08b273ed6815
    targetRevision: 87.21.0
    helm:
      releaseName: prometheus
      valuesObject:
        fullnameOverride: prometheus-kube-prometheus
        # upstream Operator ClusterRole의 wildcard/전역 Secret 권한은 아래
        # extraManifests의 monitoring Role과 읽기 전용 ClusterRole로 대체한다.
        global:
          rbac:
            create: false
        crds:
          enabled: true
          upgradeJob:
            enabled: false
        grafana:
          enabled: false
          forceDeployDashboards: true
          forceDeployDatasources: false
          sidecar:
            dashboards:
              label: grafana_dashboard
              labelValue: "1"
              annotations:
                grafana_folder: /tmp/dashboards/Kubernetes
            datasources:
              uid: prometheus
        defaultRules:
          rules:
            # 현재 k3s는 SQLite이며 아래 control-plane endpoints는 노출하지 않는다.
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        coreDns:
          service:
            enabled: false
          serviceMonitor:
            port: metrics
            selector:
              matchLabels:
                k8s-app: kube-dns
        kubelet:
          # Operator가 만드는 node-address Service도 monitoring 안에서 관리한다.
          namespace: monitoring
          serviceMonitor:
            insecureSkipVerify: false
            cAdvisor: true
            cAdvisorInterval: 30s
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          namespaces:
            releaseNamespace: true
          prometheusInstanceNamespaces: [monitoring]
          alertmanagerInstanceNamespaces: [monitoring]
          alertmanagerConfigNamespaces: [monitoring]
          thanosRulerInstanceNamespaces: [monitoring]
          kubeletService:
            namespace: monitoring
          kubeletEndpointsEnabled: false
          kubeletEndpointSliceEnabled: true
          image:
            tag: v0.92.1
            sha: 7d9247d2351480fc74587e24681578f815f387bafb2ee7b86a852a94c4cd3774
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          prometheusConfigReloader:
            image:
              tag: v0.92.1
              sha: 74550ba3e8bf93f47bc574231090d340ae9c01d25cd11ff74799e65f9fdb9a48
            enableProbe: true
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 64Mi }
        prometheus:
          prometheusSpec:
            image:
              tag: v3.11.3 # 기존 compose/runtime와 동일
              sha: c0b857aead0d5793aa566adb8f49a9983d6f6031652098759d521a330cfa050f
            enableOTLPReceiver: true
            serviceDiscoveryRole: EndpointSlice
            scrapeInterval: 30s
            evaluationInterval: 30s
            retention: 14d
            # local-path는 볼륨 quota를 강제하지 않으므로 초기 보유량 상한을 유지한다.
            retentionSize: 4GB
            resources:
              # Cafe24 8코어 기준으로 임시 축소 전 CPU 예약량을 복원한 초기값이다.
              # 실제 scrape 부하와 query latency로 다시 조정한다.
              requests: { cpu: 250m, memory: 1Gi }
              limits: { memory: 2Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi
            serviceMonitorSelector:
              matchLabels:
                release: prometheus
            serviceMonitorNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podMonitorSelector:
              matchLabels:
                release: prometheus
            podMonitorNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            ruleSelector:
              matchLabels:
                release: prometheus
            ruleNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            probeSelector:
              matchLabels:
                release: prometheus
            probeNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            scrapeConfigSelector:
              matchLabels:
                release: prometheus
            scrapeConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
        alertmanager:
          serviceAccount:
            automountServiceAccountToken: false
          alertmanagerSpec:
            image:
              tag: v0.32.1 # 기존 compose/runtime와 동일
              sha: 51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
            automountServiceAccountToken: false
            # 아래 native 전역 AlertmanagerConfig에서 Operator가 설정 Secret을 생성한다.
            useExistingSecret: true
            alertmanagerConfiguration:
              name: prometheus-discord
              global:
                resolveTimeout: 5m
            alertmanagerConfigSelector:
              matchLabels:
                release: prometheus
            alertmanagerConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { memory: 128Mi }
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi
        nodeExporter:
          operatingSystems:
            aix:
              enabled: false
            darwin:
              enabled: false
        prometheus-node-exporter:
          # 기존 DaemonSet 이름/selector를 유지해 host port 9100 중복 배치를 피한다.
          fullnameOverride: node-exporter
          image:
            tag: v1.11.1
            distroless: false
            digest: sha256:0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          prometheus:
            monitor:
              relabelings:
                - action: replace # CRD 기본값도 명시해 Argo CD의 반복 OutOfSync를 막는다.
                  targetLabel: os
                  replacement: linux
        kube-state-metrics:
          image:
            tag: v2.19.1
            sha: sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
          rbac:
            create: true
            useClusterRole: true
          # 모든 namespace의 workload/node/storage 상태를 읽되 Secret/ConfigMap은 읽지 않는다.
          namespaces: ""
          collectors:
            - cronjobs
            - daemonsets
            - deployments
            - endpointslices
            - horizontalpodautoscalers
            - ingresses
            - jobs
            - namespaces
            - networkpolicies
            - nodes
            - persistentvolumeclaims
            - persistentvolumes
            - poddisruptionbudgets
            - pods
            - replicasets
            - replicationcontrollers
            - resourcequotas
            - services
            - statefulsets
            - storageclasses
            - volumeattachments
          resources:
            requests: { cpu: 30m, memory: 96Mi }
            limits: { memory: 192Mi }
        extraManifests:
          # 전역 설정으로 참조하므로 namespace=monitoring matcher가 주입되지 않는다.
          # webhook은 ESO SecretKeySelector로만 참조하며 Operator가 비공개 설정에 넣는다.
          - apiVersion: monitoring.coreos.com/v1alpha1
            kind: AlertmanagerConfig
            metadata:
              name: prometheus-discord
              namespace: monitoring
              labels:
                release: prometheus
            spec:
              route:
                receiver: discord
                groupBy: [alertname, severity, service_name, application, job, instance]
                groupWait: 30s
                groupInterval: 5m
                repeatInterval: 4h
                routes:
                  - receiver: drop-local
                    matchers:
                      - name: environment
                        matchType: "="
                        value: local
                    continue: false
                  - receiver: "null"
                    matchers:
                      - name: alertname
                        matchType: "=~"
                        value: Watchdog|InfoInhibitor
              receivers:
                - name: drop-local
                - name: "null"
                - name: discord
                  discordConfigs:
                    - sendResolved: true
                      apiURL:
                        name: alertmanager-discord
                        key: discord-webhook
                      # Helm tpl을 한 번 통과한 뒤 Alertmanager가 실행할 템플릿이다.
                      title: '{{`{{ $scope := or (index .CommonLabels "environment") (index .CommonLabels "deployment_environment") (index .CommonLabels "service_name") (index .CommonLabels "application") (index .CommonLabels "job") (index .CommonLabels "instance") "unknown" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}][{{ $scope }}] {{ .CommonLabels.alertname }}`}}'
                      message: |
                        {{`{{ range .Alerts }}
                        {{ $scope := or (index .Labels "environment") (index .Labels "deployment_environment") (index .Labels "service_name") (index .Labels "application") (index .Labels "job") "unknown" }}
                        {{ $target := or (index .Labels "instance") (index .Labels "pod") (index .Labels "name") "-" }}
                        • {{ .Annotations.summary }}
                          환경: {{ $scope }}
                          severity: {{ .Labels.severity }}
                          대상: {{ $target }}{{ if index .Labels "pool" }}
                          pool: {{ index .Labels "pool" }}{{ end }}{{ if index .Labels "uri" }}
                          route: {{ index .Labels "method" }} {{ index .Labels "uri" }}{{ end }}{{ if .Annotations.description }}
                          설명: {{ .Annotations.description }}{{ end }}
                        {{ end }}`}}
              inhibitRules:
                - sourceMatch:
                    - { name: severity, matchType: "=", value: critical }
                  targetMatch:
                    - { name: severity, matchType: "=", value: warning }
                  equal: [alertname, service_name, application, job, instance]
                - sourceMatch:
                    - { name: alertname, matchType: "=~", value: "PostgreSQLDown|OTelCollectorDown|LokiDown|TempoDown|GrafanaDown" }
                  targetMatch:
                    - { name: alertname, matchType: "=", value: TargetDown }
                  equal: [job, namespace, service]
                - sourceMatch:
                    - { name: alertname, matchType: "=", value: PostgresBackupFailed }
                  targetMatch:
                    - { name: alertname, matchType: "=", value: KubeJobFailed }
                  equal: [namespace, job_name]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: prometheus-kube-prometheus-operator
              namespace: monitoring
            rules:
              - apiGroups: [monitoring.coreos.com]
                resources:
                  - alertmanagers
                  - alertmanagers/finalizers
                  - alertmanagers/status
                  - alertmanagerconfigs
                  - prometheuses
                  - prometheuses/finalizers
                  - prometheuses/status
                  - prometheusagents
                  - prometheusagents/finalizers
                  - prometheusagents/status
                  - thanosrulers
                  - thanosrulers/finalizers
                  - thanosrulers/status
                  - scrapeconfigs
                  - scrapeconfigs/status
                  - servicemonitors
                  - servicemonitors/status
                  - podmonitors
                  - podmonitors/status
                  - probes
                  - probes/status
                  - prometheusrules
                  - prometheusrules/status
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [apps]
                resources: [statefulsets]
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [""]
                resources: [configmaps, secrets]
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [""]
                resources: [pods]
                verbs: [list, delete]
              - apiGroups: [""]
                resources: [services, services/finalizers, endpoints]
                verbs: [get, create, update, delete]
              - apiGroups: [discovery.k8s.io]
                resources: [endpointslices]
                verbs: [get, list, watch, create, update, delete]
              - apiGroups: ["", events.k8s.io]
                resources: [events]
                verbs: [patch, create]
              - apiGroups: [networking.k8s.io]
                resources: [ingresses]
                verbs: [get, list, watch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: prometheus-kube-prometheus-operator
              namespace: monitoring
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: prometheus-kube-prometheus-operator
            subjects:
              - kind: ServiceAccount
                name: prometheus-kube-prometheus-operator
                namespace: monitoring
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: prometheus-kube-prometheus-operator
            rules:
              - apiGroups: [""]
                resources: [nodes]
                verbs: [list, watch]
              - apiGroups: [""]
                resources: [namespaces]
                verbs: [get, list, watch]
              - apiGroups: [storage.k8s.io]
                resources: [storageclasses]
                verbs: [get]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: prometheus-kube-prometheus-operator
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: prometheus-kube-prometheus-operator
            subjects:
              - kind: ServiceAccount
                name: prometheus-kube-prometheus-operator
                namespace: monitoring
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: prometheus-kube-prometheus-prometheus
            rules:
              - apiGroups: [""]
                resources: [nodes, nodes/metrics, services, endpoints, pods]
                verbs: [get, list, watch]
              - apiGroups: [discovery.k8s.io]
                resources: [endpointslices]
                verbs: [get, list, watch]
              - nonResourceURLs: [/metrics, /metrics/cadvisor, /metrics/probes, /metrics/resource]
                verbs: [get]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: prometheus-kube-prometheus-prometheus
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: prometheus-kube-prometheus-prometheus
            subjects:
              - kind: ServiceAccount
                name: prometheus-kube-prometheus-prometheus
                namespace: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
