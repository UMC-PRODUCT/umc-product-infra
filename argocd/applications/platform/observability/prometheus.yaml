# kube-prometheus-stack — 현재 단일 SQLite k3s 관측성 스택
# 앱 metrics의 OTel OTLP push와 플랫폼 ServiceMonitor 수집을 함께 유지한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Chart·Operator·CRD·image digest와 render contract을 함께 검증한다.
    # upstream tgz SHA256: 05eae98df0ff6c21877a26a4400780e4bbff248bc3b88694ef8d08b273ed6815
    targetRevision: 87.21.0
    helm:
      releaseName: prometheus
      valuesObject:
        fullnameOverride: prometheus-kube-prometheus
        # upstream Operator ClusterRole의 wildcard/전역 Secret 권한은 아래
        # extraManifests의 monitoring Role과 읽기 전용 ClusterRole로 대체한다.
        global:
          rbac:
            create: false
        crds:
          enabled: true
          upgradeJob:
            enabled: false
        grafana:
          enabled: false
          forceDeployDashboards: true
          # chart dashboard의 timezone 기본값은 utc다. UMC 폴더와 같은 KST로 맞춘다.
          defaultDashboardsTimezone: Asia/Seoul
          forceDeployDatasources: false
          sidecar:
            dashboards:
              label: grafana_dashboard
              labelValue: "1"
              annotations:
                grafana_folder: /tmp/dashboards/Kubernetes
            datasources:
              uid: prometheus
        defaultRules:
          rules:
            # 현재 k3s는 SQLite이며 아래 control-plane endpoints는 노출하지 않는다.
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        coreDns:
          service:
            enabled: false
          serviceMonitor:
            port: metrics
            selector:
              matchLabels:
                k8s-app: kube-dns
        kubelet:
          # Operator가 만드는 node-address Service도 monitoring 안에서 관리한다.
          namespace: monitoring
          serviceMonitor:
            insecureSkipVerify: false
            cAdvisor: true
            cAdvisorInterval: 30s
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          namespaces:
            releaseNamespace: true
          prometheusInstanceNamespaces: [monitoring]
          alertmanagerInstanceNamespaces: [monitoring]
          alertmanagerConfigNamespaces: [monitoring]
          thanosRulerInstanceNamespaces: [monitoring]
          kubeletService:
            namespace: monitoring
          kubeletEndpointsEnabled: false
          kubeletEndpointSliceEnabled: true
          image:
            tag: v0.92.1
            sha: 7d9247d2351480fc74587e24681578f815f387bafb2ee7b86a852a94c4cd3774
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          prometheusConfigReloader:
            image:
              tag: v0.92.1
              sha: 74550ba3e8bf93f47bc574231090d340ae9c01d25cd11ff74799e65f9fdb9a48
            enableProbe: true
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 64Mi }
        prometheus:
          prometheusSpec:
            image:
              tag: v3.11.3 # 기존 compose/runtime와 동일
              sha: c0b857aead0d5793aa566adb8f49a9983d6f6031652098759d521a330cfa050f
            enableOTLPReceiver: true
            # 같은 namespace의 Grafana를 거친 요청이 HTTP 종료·reload 경로에 닿지 않게 한다.
            # config-reloader는 HTTP 대신 SIGHUP으로 설정과 rule을 다시 읽게 한다.
            reloadStrategy: ProcessSignal
            # k6 결과용이고 관리자 port-forward로만 보낸다. Grafana는 쓰기 경로를 막는 조회 proxy로만 닿는다.
            enableRemoteWriteReceiver: true
            serviceDiscoveryRole: EndpointSlice
            scrapeInterval: 30s
            evaluationInterval: 30s
            retention: 14d
            # 14일치(하루 약 0.6GiB)와 WAL, 늘어날 k6·DB exporter 지표를 담는 상한이다. 4GB에서는 약 5일만 남았다.
            # local-path는 볼륨 요청량을 강제하지 않으므로 아래 10Gi보다 크게 둔다. 실제 한도는 노드 루트 디스크다.
            # 요청량을 바꾸면 StatefulSet을 다시 만들어야 하므로 그대로 둔다.
            retentionSize: 12GB
            resources:
              # Cafe24 8코어 기준으로 임시 축소 전 CPU 예약량을 복원한 초기값이다.
              # 실제 scrape 부하와 query latency로 다시 조정한다.
              requests: { cpu: 250m, memory: 1Gi }
              limits: { memory: 2Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi
            # 수집 정의와 rule은 monitoring namespace의 release=prometheus 리소스만 선택한다.
            # ServiceMonitor가 실제로 읽는 대상 Service의 namespace는 각 monitor가 별도로 지정한다.
            serviceMonitorSelector:
              matchLabels:
                release: prometheus
            serviceMonitorNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podMonitorSelector:
              matchLabels:
                release: prometheus
            podMonitorNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            ruleSelector:
              matchLabels:
                release: prometheus
            ruleNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            probeSelector:
              matchLabels:
                release: prometheus
            probeNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            scrapeConfigSelector:
              matchLabels:
                release: prometheus
            scrapeConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
        alertmanager:
          serviceAccount:
            automountServiceAccountToken: false
          alertmanagerSpec:
            image:
              tag: v0.32.1 # 기존 compose/runtime와 동일
              sha: 51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
            automountServiceAccountToken: false
            # 아래 native 전역 AlertmanagerConfig에서 Operator가 설정 Secret을 생성한다.
            useExistingSecret: true
            alertmanagerConfiguration:
              name: prometheus-discord
              global:
                resolveTimeout: 5m
            alertmanagerConfigSelector:
              matchLabels:
                release: prometheus
            alertmanagerConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { memory: 128Mi }
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi
        nodeExporter:
          operatingSystems:
            aix:
              enabled: false
            darwin:
              enabled: false
        prometheus-node-exporter:
          # 기존 DaemonSet 이름/selector를 유지해 host port 9100 중복 배치를 피한다.
          fullnameOverride: node-exporter
          image:
            tag: v1.11.1
            distroless: false
            digest: sha256:0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          prometheus:
            monitor:
              relabelings:
                - action: replace # CRD 기본값도 명시해 Argo CD의 반복 OutOfSync를 막는다.
                  targetLabel: os
                  replacement: linux
        kube-state-metrics:
          image:
            tag: v2.19.1
            sha: sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
          rbac:
            create: true
            useClusterRole: true
          # 모든 namespace의 workload/node/storage 상태를 읽되 Secret/ConfigMap은 읽지 않는다.
          namespaces: ""
          collectors:
            - cronjobs
            - daemonsets
            - deployments
            - endpointslices
            - horizontalpodautoscalers
            - ingresses
            - jobs
            - namespaces
            - networkpolicies
            - nodes
            - persistentvolumeclaims
            - persistentvolumes
            - poddisruptionbudgets
            - pods
            - replicasets
            - replicationcontrollers
            - resourcequotas
            - services
            - statefulsets
            - storageclasses
            - volumeattachments
          resources:
            requests: { cpu: 30m, memory: 96Mi }
            limits: { memory: 192Mi }
        extraManifests:
          # 전역 설정으로 참조하므로 namespace=monitoring matcher가 주입되지 않는다.
          # webhook은 ESO SecretKeySelector로만 참조하며 Operator가 비공개 설정에 넣는다.
          - apiVersion: monitoring.coreos.com/v1alpha1
            kind: AlertmanagerConfig
            metadata:
              name: prometheus-discord
              namespace: monitoring
              labels:
                release: prometheus
            spec:
              route:
                receiver: discord
                groupBy: [alertname, severity, service_name, application, job, instance]
                groupWait: 30s
                groupInterval: 5m
                repeatInterval: 4h
                routes:
                  # Preview PR 앱은 SPRING_PROFILES_ACTIVE=dev라 앱 지표의 environment가 dev와 같다.
                  # PR별 application 이름으로 앱 알림만 버리고 preview namespace의 플랫폼 알림은 그대로 보낸다.
                  - receiver: "null"
                    matchers:
                      - name: application
                        matchType: "=~"
                        value: preview-umc-product-pr[0-9]+
                  # Preview PR Application의 Argo CD 알림은 PR 작성자가 Argo CD UI로 확인하므로 버린다.
                  # 공용 preview DB 같은 다른 preview project 앱과 ArgoCDMetricsMissing은 그대로 보낸다.
                  - receiver: "null"
                    matchers:
                      - name: job
                        matchType: "="
                        value: argocd-application-controller-metrics
                      - name: name
                        matchType: "=~"
                        value: umc-product-preview-[0-9]+
                  # preview의 다음 세 쿼터는 hard limit을 상시 사용량에 맞춰 고정해 설계상 항상 100%라 이 알림은 상시 거짓양성이다.
                  # count/certificates.cert-manager.io 2/2는 공유 wildcard와 Mailpit loopback Certificate,
                  # count/persistentvolumeclaims 1/1과 requests.storage 5Gi/5Gi는 공용 PostgreSQL data PVC다.
                  # 그 이상의 생성 요청은 쿼터가 거부하고 Argo CD sync 오류나 namespace 이벤트로 드러나므로 Discord로 따로 감시하지 않는다.
                  # CPU·메모리·Service 등 다른 resource의 KubeQuotaFullyUsed와 KubeQuotaExceeded는 그대로 보낸다.
                  - receiver: "null"
                    matchers:
                      - name: alertname
                        matchType: "="
                        value: KubeQuotaFullyUsed
                      - name: namespace
                        matchType: "="
                        value: preview
                      - name: resource
                        matchType: "=~"
                        value: 'count/certificates\.cert-manager\.io|count/persistentvolumeclaims|requests\.storage'
                  - receiver: "null"
                    matchers:
                      - name: alertname
                        matchType: "=~"
                        value: Watchdog|InfoInhibitor
              receivers:
                - name: "null"
                - name: discord
                  discordConfigs:
                    - sendResolved: true
                      apiURL:
                        name: alertmanager-discord
                        key: discord-webhook
                      # Helm tpl을 한 번 통과한 뒤 Alertmanager가 실행할 템플릿이다.
                      title: '{{`{{ $scope := or (index .CommonLabels "environment") (index .CommonLabels "deployment_environment") (index .CommonLabels "service_name") (index .CommonLabels "application") (index .CommonLabels "job") (index .CommonLabels "instance") "unknown" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}][{{ $scope }}] {{ .CommonLabels.alertname }}`}}'
                      # 대상은 Certificate name, KSM이 붙인 pod, scrape instance 순으로 고른다.
                      # instance는 수집기 주소이고 cert-manager 지표의 pod는 cert-manager 자신이다.
                      message: |
                        {{`{{ range .Alerts }}
                        {{ $scope := or (index .Labels "environment") (index .Labels "deployment_environment") (index .Labels "service_name") (index .Labels "application") (index .Labels "job") "unknown" }}
                        {{ $target := or (index .Labels "name") (index .Labels "pod") (index .Labels "instance") "-" }}
                        • {{ .Annotations.summary }}
                          환경: {{ $scope }}
                          severity: {{ .Labels.severity }}
                          대상: {{ $target }}{{ if index .Labels "pool" }}
                          pool: {{ index .Labels "pool" }}{{ end }}{{ if index .Labels "uri" }}
                          route: {{ index .Labels "method" }} {{ index .Labels "uri" }}{{ end }}{{ if .Annotations.description }}
                          설명: {{ .Annotations.description }}{{ end }}
                        {{ end }}`}}
              # 같은 대상의 상위 장애가 이미 알림을 내면 겹치는 warning·일반 장애 알림을 억제한다.
              inhibitRules:
                # KSM 알림은 job·instance가 KSM 자신이라 namespace가 없으면 app critical이 preview warning을 덮는다.
                # service_name은 Loki 로그 알림이 쓰는 대상 label이다. Argo CD 앱 알림은 namespace·job이
                # 모두 같아 name으로 Application을 구분한다. name이 없는 알림은 양쪽이 빈 값이라 영향이 없다.
                - sourceMatch:
                    - { name: severity, matchType: "=", value: critical }
                  targetMatch:
                    - { name: severity, matchType: "=", value: warning }
                  equal: [alertname, service_name, application, namespace, job, instance, name]
                # 같은 앱의 5xx 비율 critical이 이미 나가면 건수 기반 5xx warning은 따로 보내지 않는다.
                - sourceMatch:
                    - { name: alertname, matchType: "=", value: ApiHigh5xxErrorRatio }
                  targetMatch:
                    - { name: alertname, matchType: "=~", value: "ApiHigh5xxErrorCount|ApiRouteHigh5xxErrorCount" }
                  equal: [application]
                - sourceMatch:
                    - { name: alertname, matchType: "=~", value: "PostgreSQLDown|OTelCollectorDown|LokiDown|TempoDown|GrafanaDown" }
                  targetMatch:
                    - { name: alertname, matchType: "=", value: TargetDown }
                  equal: [job, namespace, service]
                - sourceMatch:
                    - { name: alertname, matchType: "=", value: PostgresBackupFailed }
                  targetMatch:
                    - { name: alertname, matchType: "=", value: KubeJobFailed }
                  equal: [namespace, job_name]
          # Operator의 쓰기 권한은 monitoring Role에 두고 아래 ClusterRole은 발견용 읽기만 허용한다.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: prometheus-kube-prometheus-operator
              namespace: monitoring
            rules:
              - apiGroups: [monitoring.coreos.com]
                resources:
                  - alertmanagers
                  - alertmanagers/finalizers
                  - alertmanagers/status
                  - alertmanagerconfigs
                  - prometheuses
                  - prometheuses/finalizers
                  - prometheuses/status
                  - prometheusagents
                  - prometheusagents/finalizers
                  - prometheusagents/status
                  - thanosrulers
                  - thanosrulers/finalizers
                  - thanosrulers/status
                  - scrapeconfigs
                  - scrapeconfigs/status
                  - servicemonitors
                  - servicemonitors/status
                  - podmonitors
                  - podmonitors/status
                  - probes
                  - probes/status
                  - prometheusrules
                  - prometheusrules/status
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [apps]
                resources: [statefulsets]
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [""]
                resources: [configmaps, secrets]
                verbs: [get, list, watch, create, update, patch, delete]
              - apiGroups: [""]
                resources: [pods]
                verbs: [list, delete]
              - apiGroups: [""]
                resources: [services, services/finalizers, endpoints]
                verbs: [get, create, update, delete]
              - apiGroups: [discovery.k8s.io]
                resources: [endpointslices]
                verbs: [get, list, watch, create, update, delete]
              - apiGroups: ["", events.k8s.io]
                resources: [events]
                verbs: [patch, create]
              - apiGroups: [networking.k8s.io]
                resources: [ingresses]
                verbs: [get, list, watch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: prometheus-kube-prometheus-operator
              namespace: monitoring
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: prometheus-kube-prometheus-operator
            subjects:
              - kind: ServiceAccount
                name: prometheus-kube-prometheus-operator
                namespace: monitoring
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: prometheus-kube-prometheus-operator
            rules:
              - apiGroups: [""]
                resources: [nodes]
                verbs: [list, watch]
              - apiGroups: [""]
                resources: [namespaces]
                verbs: [get, list, watch]
              - apiGroups: [storage.k8s.io]
                resources: [storageclasses]
                verbs: [get]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: prometheus-kube-prometheus-operator
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: prometheus-kube-prometheus-operator
            subjects:
              - kind: ServiceAccount
                name: prometheus-kube-prometheus-operator
                namespace: monitoring
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: prometheus-kube-prometheus-prometheus
            # Prometheus 본체는 수집 대상 발견과 metrics 조회에만 API를 사용하며 Secret을 읽지 않는다.
            rules:
              - apiGroups: [""]
                resources: [nodes, nodes/metrics, services, endpoints, pods]
                verbs: [get, list, watch]
              - apiGroups: [discovery.k8s.io]
                resources: [endpointslices]
                verbs: [get, list, watch]
              - nonResourceURLs: [/metrics, /metrics/cadvisor, /metrics/probes, /metrics/resource]
                verbs: [get]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: prometheus-kube-prometheus-prometheus
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: prometheus-kube-prometheus-prometheus
            subjects:
              - kind: ServiceAccount
                name: prometheus-kube-prometheus-prometheus
                namespace: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
