# Secrets Manager 경로·IAM 역할·ExternalSecret 계약 sync — wave -1: ESO 다음, DB·앱 이전
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/UMC-PRODUCT/umc-product-infra.git
    targetRevision: main
    path: charts/umc-secrets
  destination:
    server: https://kubernetes.default.svc
    # 차트가 여러 namespace에 namespaced SecretStore와 ExternalSecret을 명시한다.
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    # ESO CRD 등록이 늦어도 재시도로 수렴
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
