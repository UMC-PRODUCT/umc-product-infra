# 클러스터 기반 리소스 — 네임스페이스 + PriorityClass + Argo CD health customization
# wave -3: Project 준비 뒤, controller와 Secret 배포보다 먼저 namespace·기본 정책을 만든다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/UMC-PRODUCT/umc-product-infra.git
    targetRevision: main
    path: manifests/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      # Git에서 빠진 namespace를 자동 삭제하지 않는다. Application finalizer에 의한 삭제와는 별개다.
      # namespace 삭제는 내부 리소스 전체에 영향을 주므로 복구 계획을 확인한 운영 절차로 수행한다.
      prune: false
