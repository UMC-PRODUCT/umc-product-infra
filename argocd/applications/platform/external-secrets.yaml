# External Secrets Operator — AWS Secrets Manager의 값을 Kubernetes Secret으로 동기화
# wave -2: namespaced SecretStore·ExternalSecret(-1)보다 CRD와 컨트롤러가 먼저 준비돼야 한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: external-secrets
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      valuesObject:
        image:
          tag: "v2.10.0@sha256:814117b0fd6d121b03e8ba3b6db1cecbe7449a354fc0fc9c4faf73a37aa221b1"
        installCRDs: true

        # 이 클러스터는 ExternalSecret + namespaced SecretStore만 쓴다.
        # PushSecret·Generator·cluster-scoped Store를 끄면 불필요한 CRD와 권한이 줄어든다.
        crds:
          createClusterExternalSecret: false
          createClusterSecretStore: false
          createSecretStore: true
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false
        processClusterExternalSecret: false
        processClusterStore: false
        processSecretStore: true
        processClusterGenerator: false
        processClusterPushSecret: false
        processPushSecret: false
        openshiftFinalizers: false

        rbac:
          # static AWS credential만 쓰므로 SA 토큰 생성·impersonation 권한이 필요 없다.
          serviceAccountTokenCreate: false
          servicebindings:
            create: false
          aggregateToView: false
          aggregateToEdit: false
          aggregateToAdmin: false

        # k3s는 AWS 밖에 있어 IRSA가 없다. 이 Secret만 Git 밖에서 먼저 주입하며,
        # bootstrap IAM 사용자는 Secret 직접 읽기 없이 환경별 역할 AssumeRole만 할 수 있다.
        extraEnv:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: aws-bootstrap
                key: access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws-bootstrap
                key: secret-access-key

        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 128Mi }
        webhook:
          image:
            tag: "v2.10.0@sha256:814117b0fd6d121b03e8ba3b6db1cecbe7449a354fc0fc9c4faf73a37aa221b1"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
        certController:
          image:
            tag: "v2.10.0@sha256:814117b0fd6d121b03e8ba3b6db1cecbe7449a354fc0fc9c4faf73a37aa221b1"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      # ESO CRD는 client-side apply annotation 한도를 넘을 수 있다.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
