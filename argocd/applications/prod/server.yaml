# 앱 — 자작 Helm 차트 sync
# root의 health gate가 DB Application(wave 0)을 기다린 뒤 생성하는 wave 1 앱이다.
# 실제 Deployment·Ingress 생성 여부는 chart의 환경별 활성화 조건에 따른다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umc-product-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://github.com/UMC-PRODUCT/umc-product-infra.git
    targetRevision: main
    path: charts/umc-product-server
    helm:
      # 공통값 뒤에 prod 값을 명시적으로 덮어쓴다.
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # Reloader가 재시작 시 쓰는 runtime annotation만 Git diff에서 제외한다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: umc-product-server
      namespace: app
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - RespectIgnoreDifferences=true
