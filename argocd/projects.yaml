# Ansible이 root보다 먼저 적용하고, 이후 root가 같은 AppProject 정의를 Git에서 관리한다.
# 각 Project는 사용할 저장소·대상 namespace·리소스 종류를 제한한다. 제거 전 Application 배정을 바꾼다.
# bootstrap은 다른 Project와 Application을 만드는 root 전용 권한이다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Root app-of-apps and project definitions
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
---
# Argo CD core를 바꾸지 않고 공개 Certificate·Ingress·NetworkPolicy만 관리할 권한이다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Argo CD public HTTPS certificate, ingress, and server network boundary
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: cert-manager.io
      kind: Certificate
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
---
# namespace·우선순위와 Secret 계약을 관리하며, cluster 범위 리소스는 아래 두 종류만 허용한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster namespaces, policy, and secret contracts from trusted Git
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: app
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: db
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: dev-app
    - server: https://kubernetes.default.svc
      namespace: dev-db
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: preview
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: scheduling.k8s.io
      kind: PriorityClass
---
# 인증서 controller·CRD·Issuer와 공용 Preview 인증서를 설치할 수 있는 범위를 선언한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: cert-manager controller, CRDs, webhooks, and ACME issuers
  sourceRepos:
    - https://charts.jetstack.io
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    # 공용 Preview 와일드카드 Certificate만 이 namespace에 둔다.
    - server: https://kubernetes.default.svc
      namespace: preview
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: cert-manager.io
      kind: Certificate
---
# DNS controller 배포 권한이다. 실제 Route 53 레코드 변경 범위는 chart 설정과 AWS IAM이 함께 제한한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Exact Route 53 DNS records derived from opted-in Ingress resources
  sourceRepos:
    - https://kubernetes-sigs.github.io/external-dns/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-dns
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
---
# ESO controller와 필요한 CRD·RBAC만 배포한다. 환경별 Secret 계약은 platform Project가 맡는다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: External Secrets Operator only
  sourceRepos:
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
# 승인한 앱 namespace에서만 Secret 변경 감시와 재시작에 필요한 namespaced 리소스를 관리한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Named-Secret application restarts with namespace-scoped RBAC
  sourceRepos:
    - https://stakater.github.io/stakater-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: reloader
    - server: https://kubernetes.default.svc
      namespace: app
    - server: https://kubernetes.default.svc
      namespace: dev-app
    - server: https://kubernetes.default.svc
      namespace: preview
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
---
# 관측 workload는 monitoring에 두고 CRD·클러스터 조회용 RBAC만 cluster 범위로 허용한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Observability workloads in monitoring, monitoring CRDs and explicit read-only cluster discovery
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
# 운영 앱과 DB는 app·db에만 배포하고 cluster 범위 리소스 생성을 금지한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Production application and database
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: app
    - server: https://kubernetes.default.svc
      namespace: db
  clusterResourceWhitelist: []
---
# 개발 앱과 DB의 배포 목적지를 dev-app·dev-db로 제한해 운영 환경과 분리한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Development application and database
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dev-app
    - server: https://kubernetes.default.svc
      namespace: dev-db
  clusterResourceWhitelist: []
---
# PR별 앱과 공유 DB는 preview namespace 안에서만 관리한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Pull-request previews and their shared database
  sourceRepos:
    - https://github.com/UMC-PRODUCT/umc-product-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: preview
  clusterResourceWhitelist: []
---
# 전용 Project(-100)를 먼저 만든 뒤 기본 Project(-99)의 저장소·배포 목적지·리소스 권한을 닫는다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-99"
spec:
  sourceRepos: []
  sourceNamespaces: []
  destinations: []
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
