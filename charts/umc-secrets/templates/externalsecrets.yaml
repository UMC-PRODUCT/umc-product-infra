{{- range .Values.externalSecrets }}
{{- $remoteKey := required (printf "externalSecrets[%s/%s].remoteKey가 필요하다" .namespace .name) .remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: external-secrets
    infra.university.neordinary.com/secret-source: aws-secrets-manager
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .store }}
  target:
    name: {{ .targetName }}
    # key 제거도 Git 계약대로 수렴하도록 ExternalSecret이 Secret의 owner가 된다.
    # remote secret이 일시 삭제되어도 마지막 정상 Secret은 유지한다.
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: {{ default "Opaque" .type }}
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          infra.university.neordinary.com/secret-source: aws-secrets-manager
  data:
    {{- range $secretKey, $remoteProperty := .data }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $remoteProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
