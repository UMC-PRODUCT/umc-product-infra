{{- $accountID := required "aws.accountId가 필요하다 (12자리 AWS 계정 ID, 비밀값 아님)" .Values.aws.accountId -}}
{{- if not (regexMatch "^[0-9]{12}$" $accountID) -}}
{{- fail "aws.accountId는 12자리 숫자여야 한다" -}}
{{- end -}}
{{- $root := . -}}
{{- range .Values.stores }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retrySettings:
    maxRetries: 5
    retryInterval: 10s
  provider:
    aws:
      service: SecretsManager
      region: {{ $root.Values.aws.region }}
      role: arn:{{ $root.Values.aws.partition }}:iam::{{ $accountID }}:role/{{ .role }}
      # 구분자를 자동으로 넣지 않으므로 trailing slash가 values에 반드시 있어야 한다.
      prefix: {{ .prefix | quote }}
      # CloudTrail의 AssumeRole 이벤트에 namespace/store 정보를 남긴다.
      sessionTagsPolicy: Simple
{{- end }}
