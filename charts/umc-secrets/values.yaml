# AWS 계정 ID는 비밀이 아니며 UMC 운영 계정으로 고정한다.
aws:
  accountId: "351284652562"
  partition: aws
  region: ap-northeast-2

# AWS 값 변경을 주기적으로 가져오는 간격이다. 이미 실행 중인 앱의 환경변수 갱신은 별도 재시작이 필요하다.
refreshInterval: 1h

# 환경별 SecretStore는 읽을 수 있는 prefix와 IAM role을 분리한다.
stores:
  - name: aws-secretsmanager
    namespace: app
    role: umc-secrets-prod
    prefix: /umc-product/prod/
  - name: aws-secretsmanager
    namespace: db
    role: umc-secrets-prod
    prefix: /umc-product/prod/
  - name: aws-secretsmanager
    namespace: dev-app
    role: umc-secrets-dev
    prefix: /umc-product/dev/
  - name: aws-secretsmanager
    namespace: dev-db
    role: umc-secrets-dev
    prefix: /umc-product/dev/
  - name: aws-secretsmanager
    namespace: preview
    role: umc-secrets-preview
    prefix: /umc-product/preview/
  - name: aws-secretsmanager
    namespace: monitoring
    role: umc-secrets-monitoring
    prefix: /umc-product/platform/monitoring/
  - name: aws-secretsmanager
    namespace: argocd
    role: umc-secrets-argocd
    prefix: /umc-product/platform/argocd/
  - name: aws-secretsmanager
    namespace: cert-manager
    role: umc-secrets-cert-manager
    prefix: /umc-product/platform/cert-manager/
  - name: aws-secretsmanager
    namespace: external-dns
    role: umc-secrets-external-dns
    prefix: /umc-product/platform/external-dns/

# AWS Secrets Manager에는 아래 remoteKey별 JSON object를 만든다.
# data는 Kubernetes Secret key와 JSON property를 1:1로 제한한다.
externalSecrets:
  # 운영 앱에 필요한 key 목록이다. 아래 anchor는 key 구조만 공유하며 값은 환경별 AWS source에서 읽는다.
  - name: app-db
    namespace: app
    store: aws-secretsmanager
    targetName: app-db
    remoteKey: app-db
    data: &appDbData
      DATABASE_PASSWORD: DATABASE_PASSWORD

  - name: app-jwt
    namespace: app
    store: aws-secretsmanager
    targetName: app-jwt
    remoteKey: app-jwt
    data: &appJwtData
      JWT_ACCESS_TOKEN_SECRET: JWT_ACCESS_TOKEN_SECRET
      JWT_REFRESH_TOKEN_SECRET: JWT_REFRESH_TOKEN_SECRET
      JWT_OAUTH_VERIFICATION_TOKEN_SECRET: JWT_OAUTH_VERIFICATION_TOKEN_SECRET
      JWT_EMAIL_VERIFICATION_TOKEN_SECRET: JWT_EMAIL_VERIFICATION_TOKEN_SECRET
      JWT_SSO_LOGIN_TOKEN_SECRET: JWT_SSO_LOGIN_TOKEN_SECRET
      DEMODAY_STAMP_CREDENTIAL_ENCRYPTION_KEY: DEMODAY_STAMP_CREDENTIAL_ENCRYPTION_KEY
      DEMODAY_VOTE_QR_SIGNING_KEY: DEMODAY_VOTE_QR_SIGNING_KEY
      DEMODAY_VOTE_AUTHORIZATION_SIGNING_KEY: DEMODAY_VOTE_AUTHORIZATION_SIGNING_KEY
      DEMODAY_PARTICIPANT_TOKEN_SECRET: DEMODAY_PARTICIPANT_TOKEN_SECRET

  - name: app-oauth
    namespace: app
    store: aws-secretsmanager
    targetName: app-oauth
    remoteKey: app-oauth
    data: &appOauthData
      APPLE_IOS_CLIENT_ID: APPLE_IOS_CLIENT_ID
      APPLE_WEB_CLIENT_ID: APPLE_WEB_CLIENT_ID
      APPLE_TEAM_ID: APPLE_TEAM_ID
      APPLE_KEY_ID: APPLE_KEY_ID
      APPLE_PRIVATE_KEY: APPLE_PRIVATE_KEY
      KAKAO_CLIENT_ID: KAKAO_CLIENT_ID
      KAKAO_CLIENT_SECRET: KAKAO_CLIENT_SECRET

  - name: app-storage
    namespace: app
    store: aws-secretsmanager
    targetName: app-storage
    remoteKey: app-storage
    data: &appStorageData
      S3_ACCESS_KEY_ID: S3_ACCESS_KEY_ID
      S3_SECRET_ACCESS_KEY: S3_SECRET_ACCESS_KEY

  - name: app-email
    namespace: app
    store: aws-secretsmanager
    targetName: app-email
    remoteKey: app-email
    data: &appEmailData
      SES_ACCESS_KEY_ID: SES_ACCESS_KEY_ID
      SES_SECRET_ACCESS_KEY: SES_SECRET_ACCESS_KEY
      SMTP_PASSWORD: SMTP_PASSWORD

  - name: app-fcm
    namespace: app
    store: aws-secretsmanager
    targetName: app-fcm
    remoteKey: app-fcm
    data:
      FIREBASE_CONFIGURATION: FIREBASE_CONFIGURATION

  # Traefik이 Scalar/OpenAPI 문서 경로에 적용하는 htpasswd 사용자 목록이다.
  - name: docs-basic-auth
    namespace: app
    store: aws-secretsmanager
    targetName: docs-basic-auth
    remoteKey: docs-basic-auth
    data: &docsBasicAuthData
      users: users

  # DB role 생성 Job도 앱과 같은 password를 읽도록 db namespace에 복제한다.
  # Job은 별도 관리자 Secret으로 role을 변경하지만 앱 Pod에는 관리자 Secret을 주입하지 않는다.
  - name: app-db
    namespace: db
    store: aws-secretsmanager
    targetName: app-db
    remoteKey: app-db
    data: *appDbData

  # 개발 앱과 개발 DB role 생성 Job은 /dev/ source를 사용해 운영 자격증명과 분리한다.
  - name: app-db
    namespace: dev-app
    store: aws-secretsmanager
    targetName: app-db
    remoteKey: app-db
    data: *appDbData
  - name: app-jwt
    namespace: dev-app
    store: aws-secretsmanager
    targetName: app-jwt
    remoteKey: app-jwt
    data: *appJwtData
  - name: app-oauth
    namespace: dev-app
    store: aws-secretsmanager
    targetName: app-oauth
    remoteKey: app-oauth
    data: *appOauthData
  - name: app-storage
    namespace: dev-app
    store: aws-secretsmanager
    targetName: app-storage
    remoteKey: app-storage
    data: *appStorageData
  - name: app-email
    namespace: dev-app
    store: aws-secretsmanager
    targetName: app-email
    remoteKey: app-email
    data: *appEmailData
  - name: docs-basic-auth
    namespace: dev-app
    store: aws-secretsmanager
    targetName: docs-basic-auth
    remoteKey: docs-basic-auth
    data: *docsBasicAuthData
  - name: app-db
    namespace: dev-db
    store: aws-secretsmanager
    targetName: app-db
    remoteKey: app-db
    data: *appDbData

  # Preview 앱과 PR DB가 공유하는 자격증명이다. PR별 DB 분리가 자격증명 격리를 뜻하지는 않는다.
  - name: app-db
    namespace: preview
    store: aws-secretsmanager
    targetName: app-db
    remoteKey: app-db
    data: *appDbData
  - name: app-jwt
    namespace: preview
    store: aws-secretsmanager
    targetName: app-jwt
    remoteKey: app-jwt
    data: *appJwtData
  - name: app-oauth
    namespace: preview
    store: aws-secretsmanager
    targetName: app-oauth
    remoteKey: app-oauth
    data: *appOauthData
  - name: app-storage
    namespace: preview
    store: aws-secretsmanager
    targetName: app-storage
    remoteKey: app-storage
    data: *appStorageData
  - name: app-email
    namespace: preview
    store: aws-secretsmanager
    targetName: app-email
    remoteKey: app-email
    # preview는 SES만 사용하며 Gmail 자격증명을 공유하지 않는다.
    data:
      SES_ACCESS_KEY_ID: SES_ACCESS_KEY_ID
      SES_SECRET_ACCESS_KEY: SES_SECRET_ACCESS_KEY

  # DB 관리자·읽기 전용·exporter·백업 자격증명은 소비 목적과 권한에 따라 나눈다.
  - name: postgres-secrets
    namespace: db
    store: aws-secretsmanager
    targetName: postgres-secrets
    remoteKey: postgres-secrets
    data:
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_USER: POSTGRES_USER
  - name: postgres-readonly
    namespace: db
    store: aws-secretsmanager
    targetName: postgres-readonly
    remoteKey: postgres-readonly
    data:
      RO_PASSWORD: RO_PASSWORD
  - name: postgres-exporter
    namespace: db
    store: aws-secretsmanager
    targetName: postgres-exporter
    remoteKey: postgres-exporter
    data:
      POSTGRES_EXPORTER_PASSWORD: POSTGRES_EXPORTER_PASSWORD
  - name: backup-s3
    namespace: db
    store: aws-secretsmanager
    targetName: backup-s3
    remoteKey: backup-s3
    data:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_REGION: AWS_REGION
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      S3_BUCKET: S3_BUCKET
      S3_EXPECTED_BUCKET_OWNER: S3_EXPECTED_BUCKET_OWNER
  - name: postgres-secrets
    namespace: dev-db
    store: aws-secretsmanager
    targetName: postgres-secrets
    remoteKey: postgres-secrets
    data:
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_USER: POSTGRES_USER
  - name: postgres-preview-secrets
    namespace: preview
    store: aws-secretsmanager
    targetName: postgres-preview-secrets
    remoteKey: postgres-preview-secrets
    data:
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_USER: POSTGRES_USER

  # 관측·PR 조회 등 platform 전용 자격증명이다. 애플리케이션 envFrom 목록에 포함하지 않는다.
  - name: grafana-admin
    namespace: monitoring
    store: aws-secretsmanager
    targetName: grafana-admin
    remoteKey: grafana-admin
    data:
      admin-password: admin-password
      admin-user: admin-user
  - name: alertmanager-discord
    namespace: monitoring
    store: aws-secretsmanager
    targetName: alertmanager-discord
    remoteKey: alertmanager-discord
    data:
      discord-webhook: discord-webhook
  - name: preview-github-token
    namespace: argocd
    store: aws-secretsmanager
    targetName: preview-github-token
    remoteKey: preview-github-token
    data:
      token: token
  # 인증서 발급과 DNS 동기화는 서로 다른 최소 권한 Route 53 자격증명으로 격리한다.
  - name: route53-credentials
    namespace: cert-manager
    store: aws-secretsmanager
    targetName: route53-credentials
    remoteKey: route53-credentials
    data:
      access-key-id: access-key-id
      secret-access-key: secret-access-key
  - name: route53-credentials
    namespace: external-dns
    store: aws-secretsmanager
    targetName: route53-credentials
    remoteKey: route53-credentials
    data:
      access-key-id: access-key-id
      secret-access-key: secret-access-key
