# PR preview override. ApplicationSet이 PR 번호·성공한 이미지 digest·DB 이름과 활성화 값을 주입한다.
# 이 파일만으로는 PR 정보가 없으므로 deployment/ingress 기본값을 false로 유지한다.

environment: preview

# PR image 발행·신뢰 경계 검증 전까지 앱과 DB 생성·삭제 Job을 함께 잠근다.
deployment:
  enabled: false

# ApplicationSet이 CI의 마지막 발행 성공 기록에서 image tag와 digest를 함께 주입한다.
image:
  tag: bootstrap-required
  digest: ""

# 여러 PR release가 같은 namespace baseline을 서로 소유하지 않는다.
networkPolicy:
  enabled: false

priorityClassName: preview-lowest

# dev와 같은 자원이다. 같은 JVM 옵션(MaxRAMPercentage=75)에서 힙 상한도 dev와 같아진다.
resources:
  requests:
    cpu: 250m
    memory: 2Gi
  limits:
    cpu: 1500m
    memory: 3Gi

# PR 번호별 DB를 분리하되 app role은 모든 Preview가 공유하므로 외부·fork 코드를 실행하지 않는다.
createDatabase:
  enabled: true
  owner: umc_product_preview_app
  # 처음 만들 때 dev DB를 복원한다. 덤프·복원 시간을 고려해 기한을 늘리고, 재시도는 완료 표시로 보호된다.
  activeDeadlineSeconds: 1800
  backoffLimit: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  copyFromDev:
    enabled: true

# 활성화 후 PR 종료 시 해당 DB와 기존 연결을 정리한다. 공용 PostgreSQL·인증서는 유지한다.
deleteDatabase:
  enabled: true

probes:
  startup:
    failureThreshold: 60

env:
  SPRING_PROFILES_ACTIVE: dev
  # 문서 경로는 Preview 공용 Basic Auth를 적용한 별도 Ingress에서 제공한다.
  OPENAPI_ENABLE: "true"
  SPRING_APPLICATION_NAME: preview-umc-product-bootstrap-required
  APP_ENVIRONMENT: preview-bootstrap-required
  S3_BUCKET_NAME: umc-product-preview-app-storage-351284652562-ap-northeast-2
  S3_REGION: ap-northeast-2
  SES_REGION: ap-northeast-2
  # 실제 발송 대신 Pod 안 Mailpit으로 보낸다. 값은 mailCapture와 같아야 하며 비밀번호는 app-email Secret에 있다.
  EMAIL_PROVIDER: smtp
  SMTP_HOST: smtp-capture.university.neordinary.com
  SMTP_PORT: "1025"
  SMTP_USERNAME: umc-preview
  EMAIL_NO_REPLY_ADDRESS: no-reply-nonprod@university.neordinary.com
  # seed API는 끈다. app-seed Secret이 없어 시딩하면 공개 기본 비밀번호로 계정이 생긴다.
  # QA 계정은 copyFromDev로 복원한 dev 데이터에 있다.
  APP_SEED_ENABLED: "false"
  # /test 경로는 아래 testApi Ingress의 Basic Auth로 보호한다.
  APP_TEST_API_ENABLED: "true"
  DATABASE_URL: ""
  DATABASE_USERNAME: umc_product_preview_app
  MEDIA_STORAGE_PURGE_ENABLED: "false"
  PRIVACY_RETENTION_ENABLED: "false"

documentation:
  enabled: true
  basicAuth:
    existingSecret: docs-basic-auth

# Swagger에서 `/test/token/access`로 토큰을 받아 테스트한다. 문서와 같은 Preview 공용 자격증명이다.
testApi:
  enabled: true
  basicAuth:
    existingSecret: docs-basic-auth

# PR별 메일 수집함. uiHost는 ApplicationSet이 mail-pr-<번호>로 주입한다.
mailCapture:
  enabled: true

# 앱 gate와 별도로 API 공개도 잠근다. 활성화 시 PR host와 공용 wildcard TLS Secret을 사용한다.
ingress:
  enabled: false
  className: traefik
  host: preview.example.invalid
  tls:
    - hosts: [preview.example.invalid]
      # preview namespace에 한 번만 발급하는 *.university.neordinary.com 인증서다.
      secretName: preview-wildcard-tls

# PR마다 Certificate를 만들지 않는다. 모든 Preview Ingress가 위 공용 Secret을 참조한다.
certificate:
  enabled: false

reloader:
  secretNames:
    - app-oauth
    - app-storage
    - app-email
