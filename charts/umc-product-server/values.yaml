# UMC Product Server 공통값.
# 환경별 필수값은 values-prod.yaml / values-dev.yaml / values-preview.yaml에서 정의한다.
# bootstrap 시점에는 Deployment와 DB 생성·삭제 Job을 실행하지 않는다.

environment: bootstrap
fullnameOverride: ""

deployment:
  # image tag/digest와 환경별 시크릿을 준비한 뒤 명시적으로 true로 전환한다.
  enabled: false

# WebSocket broker, 로컬 Caffeine cache, scheduler가 프로세스 로컬 상태를 사용하므로 1개로 고정한다.
replicaCount: 1
priorityClassName: ""

image:
  repository: ghcr.io/umc-product/umc-product-server
  # 의도적 placeholder. prod/dev는 12자리 SHA와 digest, Preview는 12자리 PR head SHA를 요구한다.
  tag: bootstrap-required
  digest: ""
  pullPolicy: IfNotPresent

# 앱 요청과 상태 확인 포트를 분리한다. management는 Service·Ingress에 노출하지 않는다.
ports:
  http: 8080
  management: 9090

# 외부 접속은 Traefik Ingress로만 받고 앱 Service는 클러스터 내부에 둔다.
service:
  type: ClusterIP
  port: 80

# namespace default-deny와 앱의 최소 허용 경로를 함께 적용한다.
# preview는 공유 namespace 정책을 플랫폼 manifest가 한 번만 소유하므로 비활성화한다.
networkPolicy:
  enabled: false
  database:
    namespace: ""
    podName: postgres

# Deployment·TLS와 함께 검증한 뒤 공개 API를 연다. host·TLS·DNS target을 한 묶음으로 맞춘다.
ingress:
  enabled: false
  className: traefik
  host: api.example.invalid
  tls: []

# 공격성 트래픽을 앱에 닿기 전에 Traefik이 클라이언트 IP별로 끊는 거친 바깥 울타리다.
# 사용자별 제한은 앱 limiter가 맡는다(인증 사용자는 member별, 익명만 IP별).
# 행사(데모데이)에서는 동시 사용자 약 100명이 캠퍼스 Wi-Fi NAT의 공인 IP 하나를 나눠 쓴다. 100명이 함께
# 화면을 열면 화면마다 API를 여러 개 부르므로 1초도 안 되는 사이에 약 1000건이 몰린다.
# 동시 요청 수는 도착률 × 응답 시간이다. 1000건이 응답(100~300ms, 부하가 걸리면 더 느림)보다 빨리
# 들어오면 거의 모두가 동시에 열려 있으므로 inFlight는 1000, burst는 그 2배로 둔다.
# inFlight 1000은 예상 최대치와 같아 여유가 없지만, 행사 규모를 아는 팀 판단(2026-11-03)으로 유지한다.
# inFlight는 Tomcat 스레드 200개를 지키는 장치가 아니다. 행사 사용자를 막지 않는 쪽을 택했다.
# 1000건 몰림이 약 3.3초(1000 ÷ 300)보다 자주 오면 bucket이 결국 비므로 average도 올려야 한다.
# 추정치이므로 첫 행사 뒤 Traefik accessLog의 IP별 요청 수와 429를 보고 다시 정한다.
# 한도는 Traefik 라우터(Ingress 경로)마다 따로 센다. 항상 켜져 있고, 환경별로는 values-<env>.yaml에
# 바꿀 키만 덮어쓴다. 검증기는 1 이상의 정수와 IP 기준(ipStrategy.depth: 0)만 본다.
edgeProtection:
  rateLimit:
    average: 300
    period: 1s
    burst: 2000
  inFlight:
    amount: 1000
  # WebSocket(/ws)은 연결이 열려 있는 동안 계속 동시 요청으로 세므로 별도 Ingress에서 넉넉한 한도를 둔다.
  # IP 하나가 소켓을 무한정 열어 메모리 상한이 있는 Traefik(Argo CD·Grafana도 거친다)을 압박하는 것을 막는다.
  webSocketInFlight:
    amount: 1000

# Scalar/OpenAPI 문서는 일반 API와 분리된 Ingress에서 Basic Auth로 보호한다.
# existingSecret은 htpasswd 형식의 users key를 가진 Kubernetes Secret이다.
documentation:
  enabled: false
  basicAuth:
    existingSecret: docs-basic-auth

# 개발용 test API는 일반 API와 분리된 Ingress에서 Basic Auth로 보호한다.
# 문서용 htpasswd Secret을 재사용하며 별도 자격증명을 만들지 않는다.
testApi:
  enabled: false
  basicAuth:
    existingSecret: docs-basic-auth

# Preview 메일 수집(Mailpit sidecar). 앱은 Pod 안 loopback으로 STARTTLS·인증 SMTP를 보내고,
# Mailpit은 릴레이 없이 보관만 한다. 인증서는 preview 공용 wildcard Secret, 비밀번호는 app-email Secret을 쓴다.
mailCapture:
  enabled: false
  image: axllent/mailpit:v1.27.0@sha256:fb84cfb1c3a33007cfdee8ba5a77b8c6c894de5b1a368372ddc5c965cf5c0b6d
  # hostAliases로 127.0.0.1에 묶는 이름. 공개 DNS 레코드는 만들지 않는다.
  smtpHost: smtp-capture.university.neordinary.com
  smtpPort: 1025
  smtpUsername: umc-preview
  uiPort: 8025
  uiHost: ""
  # 위 이름만 담은 자체 서명 인증서(manifests/cert-manager). Pod에 공개 wildcard 키를 마운트하지 않는다.
  smtpTlsSecret: preview-mail-capture-loopback-tls
  maxMessages: 500
  ui:
    basicAuth:
      existingSecret: docs-basic-auth
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  # init container는 앱·Mailpit 합계보다 작아 Pod 예산을 늘리지 않는다.
  truststoreResources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

# prod/dev cert-manager Certificate는 Deployment와 독립적으로 먼저 발급한다. Preview는
# namespace 공용 와일드카드 Secret을 사용하므로 환경 overlay에서 비활성화한다.
certificate:
  enabled: false
  issuerRef:
    # 운영 도메인은 DNS-01로 검증한 Let's Encrypt production 인증서를 사용한다.
    name: letsencrypt-production
    kind: ClusterIssuer

# 모든 환경이 사용하는 고정 Cafe24 IDC public IPv4.
# ExternalDNS의 --target-net-filter 값과 반드시 같은 IP여야 한다.
externalDNS:
  target: "1.255.226.166"

# 환경 overlay가 모두 덮어쓴다. base만 렌더링해도 과도한 자원을 예약하지 않는 안전한 값이다.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# 모든 환경에 공통인 비밀이 아닌 런타임 설정.
env:
  APP_SEED_ENABLED: "false"
  APP_TEST_API_ENABLED: "false"
  FCM_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_SERVER_PORT: "9090"
  OTEL_URL: http://otel-collector.monitoring.svc.cluster.local:4318
  OTEL_AUTH_HEADER: ""
  TRACE_SAMPLING_PROBABILITY: "1.0"
  # 비밀값이 아니지만 실제 UMC 값이 아직 정해지지 않았다. gate를 열기 전에 덮어쓴다.
  SSO_ISSUER: https://bootstrap-required.example.invalid
  CERTIFICATE_VERIFICATION_URL_TEMPLATE: https://bootstrap-required.example.invalid/api/v1/certificates/verify/{serialNumber}
  DEMODAY_QR_BASE_URL: https://bootstrap-required.example.invalid
  S3_BUCKET_NAME: bootstrap-required
  EMAIL_PROVIDER: ses
  EMAIL_NO_REPLY_ADDRESS: bootstrap-required@example.invalid
  MEDIA_STORAGE_PURGE_ENABLED: "false"
  PRIVACY_RETENTION_ENABLED: "false"

# External Secrets가 각 namespace에 생성하는 필수 Secret.
# Deployment는 배열 순서대로 envFrom을 구성하며 app-db가 DATABASE_PASSWORD를 제공한다.
requiredSecrets:
  - app-db
  - app-jwt
  - app-oauth
  - app-storage
  - app-email

# 변경 즉시 Pod를 재시작해도 안전한 Secret만 환경별 overlay가 명시한다.
# app-db는 DB role 적용 순서, app-jwt는 token cutover가 필요해 자동 대상에서 제외한다.
reloader:
  secretNames: []

# PR preview는 PostgreSQL 인스턴스 하나에서 PR별 database를 사용한다.
# deployment.enabled=false이면 생성·삭제 Job도 렌더링하지 않는다.
createDatabase:
  enabled: false
  name: ""
  owner: ""
  host: postgres-preview.preview.svc.cluster.local
  bootstrapDatabase: preview_bootstrap
  existingSecret: postgres-preview-secrets
  activeDeadlineSeconds: 300
  backoffLimit: 5
  connectTimeoutSeconds: "5"
  statementTimeout: 30s
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
  # preview 전용. dev DB를 읽기 전용 role로 덤프해 PR database를 채운다.
  copyFromDev:
    enabled: false
    host: postgres.dev-db.svc.cluster.local
    database: umc_product_dev
    user: umc_product_dev_preview_dump
    existingSecret: dev-db-dump

# PR Application 삭제 후 해당 DB를 정리한다. FORCE 삭제는 그 DB의 기존 연결도 종료한다.
# 삭제 hook이 실패하면 Argo CD가 Job을 지우고 다시 만들어 재시도한다. DB 백업·보존을 대신하지 않는다.
deleteDatabase:
  enabled: false
  # 공용 DB 연결 대기(600초)와 삭제가 deadline 안에 끝나야 한다. 템플릿이 900 미만을 거부한다.
  activeDeadlineSeconds: 900
  backoffLimit: 1
  connectTimeoutSeconds: "10"
  statementTimeout: 30s
  lockTimeout: 5s
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

# StatefulSet과 같은 PG18/PostGIS 3.6 OCI index digest를 고정한다.
postgresClient:
  image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677

# startup은 느린 초기 기동을 허용하고, liveness는 재시작·readiness는 요청 수신 가능 여부를 판단한다.
probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  liveness:
    path: /actuator/health/liveness
    failureThreshold: 3
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    path: /actuator/health/readiness
    failureThreshold: 2
    periodSeconds: 5
    timeoutSeconds: 3

# Backend Docker image의 spring 사용자(uid 100 / gid 101)에 맞춘 restricted 기본값.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# root filesystem 쓰기·권한 상승을 막고, 필요한 임시파일과 로그만 Deployment의 emptyDir에 쓴다.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# 애플리케이션은 OTLP push를 사용하므로 Prometheus scrape annotation을 두지 않는다.
podAnnotations: {}
