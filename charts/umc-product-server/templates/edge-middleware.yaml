{{/*
앱 host로 들어온 요청을 앱에 닿기 전에 클라이언트 IP별로 제한한다. 앱 limiter보다 훨씬 느슨한 바깥 울타리다.
Traefik Service가 externalTrafficPolicy: Local이라 remote address가 실제 클라이언트 IP다.
앞단 proxy가 없으므로 위조 가능한 X-Forwarded-For는 읽지 않는다(ipStrategy.depth: 0).
*/}}
{{- if and .Values.deployment.enabled .Values.ingress.enabled }}
{{- $edge := .Values.edgeProtection }}
{{- range $label, $value := dict "rateLimit.average" $edge.rateLimit.average "rateLimit.burst" $edge.rateLimit.burst "inFlight.amount" $edge.inFlight.amount "webSocketInFlight.amount" $edge.webSocketInFlight.amount }}
{{- if le (int $value) 0 }}
{{- fail (printf "edgeProtection.%s는 1 이상이어야 함 (0은 Traefik에서 무제한)" $label) }}
{{- end }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "umc-product-server.fullname" . }}-rate-limit
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  rateLimit:
    average: {{ int $edge.rateLimit.average }}
    period: {{ $edge.rateLimit.period | quote }}
    burst: {{ int $edge.rateLimit.burst }}
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "umc-product-server.fullname" . }}-in-flight
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  inFlightReq:
    amount: {{ int $edge.inFlight.amount }}
    # 기준을 지정하지 않으면 요청 host 하나로 묶여 모든 사용자가 한 한도를 나눠 쓴다.
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "umc-product-server.fullname" . }}-ws-in-flight
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  inFlightReq:
    amount: {{ int $edge.webSocketInFlight.amount }}
    sourceCriterion:
      ipStrategy:
        depth: 0
{{- end }}
