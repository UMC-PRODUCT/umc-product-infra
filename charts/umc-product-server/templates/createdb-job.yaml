{{- if and .Values.deployment.enabled .Values.createDatabase.enabled }}
{{- $databaseOwner := required "createDatabase.owner 이 필요하다" .Values.createDatabase.owner -}}
{{- $postgresClientImage := required "postgresClient.image가 필요하다" .Values.postgresClient.image -}}
{{- if ne $postgresClientImage "postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677" -}}
{{- fail "postgresClient.image는 StatefulSet과 같은 검증된 PG18/PostGIS 3.6 digest여야 한다" -}}
{{- end -}}
{{- if ne $databaseOwner "umc_product_preview_app" -}}
{{- fail "createDatabase.owner는 umc_product_preview_app 이어야 한다" -}}
{{- end -}}
{{- $copyFromDev := .Values.createDatabase.copyFromDev.enabled -}}
{{- if lt (int .Values.createDatabase.activeDeadlineSeconds) 900 -}}
{{- fail "createDatabase.activeDeadlineSeconds는 공용 DB 대기 600초와 준비 시간을 담도록 900 이상이어야 한다" -}}
{{- end -}}
{{- if and $copyFromDev (ne .Values.environment "preview") -}}
{{- fail "createDatabase.copyFromDev는 preview 환경에서만 사용할 수 있다" -}}
{{- end -}}
{{- /*
  PR 프리뷰용 database 준비. prod·dev의 초기 DB는 별도 PostgreSQL manifest가 준비한다.
  Deployment gate가 닫히면 이 Job도 만들지 않으며, PR Service quota 검사를 먼저 통과해야 한다.

  왜 필요한가: 프리뷰는 postgres 한 대를 공유하고 PR 마다 database 를 나눈다.
  나누지 않으면 여러 PR 의 Flyway 가 같은 스키마를 동시에 고쳐 서로를 깬다.
  postgres 는 접속 시 database 를 자동으로 만들지 않으므로 앱보다 먼저 이 Job 이 만든다.

  copyFromDev가 켜져 있으면 dev DB를 읽기 전용 role로 덤프해 복원하고, 외부 실행 상태를 지운 뒤
  database 주석에 완료 표시를 남긴다. 완료 표시가 있으면 다시 실행돼도 데이터를 건드리지 않는다.
  실제 순서와 거부 조건은 files/preview-database-bootstrap.sh 한 곳에 둔다.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "umc-product-server.fullname" . }}-createdb
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
    {{- if $copyFromDev }}
    infra.university.neordinary.com/dev-db-reader: "true"
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # 앱(기본 0)보다 먼저
    # Job spec은 불변이고 selector는 controller가 생성하므로 delete/create로 교체한다.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  activeDeadlineSeconds: {{ .Values.createDatabase.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.createDatabase.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "umc-product-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-bootstrap
        {{- if $copyFromDev }}
        # dev-db와 preview의 NetworkPolicy가 이 label을 가진 Pod만 dev PostgreSQL 연결을 허용한다.
        infra.university.neordinary.com/dev-db-reader: "true"
        {{- end }}
    spec:
      restartPolicy: Never
      priorityClassName: {{ .Values.priorityClassName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: createdb
          image: {{ $postgresClientImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          # Kubernetes는 args·env 값의 `$$`를 `$`로 줄이고 `$(VAR)`를 치환한다.
          # 파일 원문이 그대로 전달되도록 `$`를 모두 두 배로 넣는다(SQL의 `AS $$` 등).
          args:
            - {{ .Files.Get "files/preview-database-bootstrap.sh" | replace "$" "$$" | quote }}
          env:
            - name: PGHOST
              value: {{ .Values.createDatabase.host | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.createDatabase.existingSecret }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.createDatabase.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: {{ .Values.createDatabase.bootstrapDatabase | quote }}
            - name: PGCONNECT_TIMEOUT
              value: {{ .Values.createDatabase.connectTimeoutSeconds | quote }}
            - name: PGOPTIONS
              value: {{ printf "-c statement_timeout=%s" .Values.createDatabase.statementTimeout | quote }}
            - name: TARGET_DB
              value: {{ required "createDatabase.name 이 필요하다" .Values.createDatabase.name | quote }}
            - name: TARGET_OWNER
              value: {{ $databaseOwner | quote }}
            - name: COPY_FROM_DEV
              value: {{ $copyFromDev | toString | quote }}
            {{- if $copyFromDev }}
            {{- $source := .Values.createDatabase.copyFromDev }}
            - name: SOURCE_HOST
              value: {{ required "createDatabase.copyFromDev.host가 필요하다" $source.host | quote }}
            - name: SOURCE_DB
              value: {{ required "createDatabase.copyFromDev.database가 필요하다" $source.database | quote }}
            - name: SOURCE_USER
              value: {{ required "createDatabase.copyFromDev.user가 필요하다" $source.user | quote }}
            - name: SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "createDatabase.copyFromDev.existingSecret이 필요하다" $source.existingSecret | quote }}
                  key: DEV_DB_PREVIEW_DUMP_PASSWORD
            - name: CLEANUP_SQL
              value: {{ .Files.Get "files/preview-external-state-cleanup.sql" | replace "$" "$$" | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.createDatabase.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
