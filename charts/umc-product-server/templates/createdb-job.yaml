{{- if and .Values.deployment.enabled .Values.createDatabase.enabled }}
{{- $databaseOwner := required "createDatabase.owner 이 필요하다" .Values.createDatabase.owner -}}
{{- $postgresClientImage := required "postgresClient.image가 필요하다" .Values.postgresClient.image -}}
{{- if ne $postgresClientImage "postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677" -}}
{{- fail "postgresClient.image는 StatefulSet과 같은 검증된 PG18/PostGIS 3.6 digest여야 한다" -}}
{{- end -}}
{{- if ne $databaseOwner "umc_product_preview_app" -}}
{{- fail "createDatabase.owner는 umc_product_preview_app 이어야 한다" -}}
{{- end -}}
{{- /*
  PR 프리뷰용 database 생성. 프리뷰만 켠다 (prod·dev 는 database 가 시크릿에 이미 있다).

  왜 필요한가: 프리뷰는 postgres 한 대를 공유하고 PR 마다 database 를 나눈다.
  나누지 않으면 여러 PR 의 Flyway 가 같은 스키마를 동시에 고쳐 서로를 깬다.
  그런데 postgres 는 접속 시 database 를 자동으로 만들어주지 않는다 — 없으면 앱이
  "database does not exist" 로 죽는다. 그래서 앱보다 먼저 이 Job 이 만든다.

  sync-wave 를 앱보다 낮게 둬서 순서를 보장하고, \gexec 로 멱등하게 만든다
  (CREATE DATABASE 는 IF NOT EXISTS 를 지원하지 않는다).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "umc-product-server.fullname" . }}-createdb
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # 앱(기본 0)보다 먼저
    # Job spec은 불변이고 selector는 controller가 생성하므로 delete/create로 교체한다.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  activeDeadlineSeconds: {{ .Values.createDatabase.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.createDatabase.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "umc-product-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-bootstrap
    spec:
      restartPolicy: Never
      priorityClassName: {{ .Values.priorityClassName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: createdb
          image: {{ $postgresClientImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              if [ "$TARGET_OWNER" != "umc_product_preview_app" ]; then
                echo "database 생성 거부: 허용되지 않은 owner: $TARGET_OWNER" >&2
                exit 64
              fi
              database_ready=false
              for i in $(seq 1 40); do
                if pg_isready -q; then
                  database_ready=true
                  break
                fi
                sleep 3
              done
              test "$database_ready" = true
              # \gexec — SELECT 가 만들어낸 SQL 문자열을 실행한다. 이미 있으면 아무것도 안 만든다.
              # CREATE DATABASE 는 트랜잭션 안에서 못 돌아 psql 변수 + \gexec 조합을 쓴다.
              psql -v ON_ERROR_STOP=1 --set=db="$TARGET_DB" --set=owner="$TARGET_OWNER" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'owner')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db') \gexec
              SQL
              # Flyway는 최소권한 app role로 실행되므로 관리자 자격증명으로 확장을 먼저 설치한다.
              psql --dbname "$TARGET_DB" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE EXTENSION IF NOT EXISTS postgis;
              CREATE EXTENSION IF NOT EXISTS btree_gist;
              SQL
              echo "database 준비 완료: $TARGET_DB"
          env:
            - name: PGHOST
              value: {{ .Values.createDatabase.host | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.createDatabase.existingSecret }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.createDatabase.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: {{ .Values.createDatabase.bootstrapDatabase | quote }}
            - name: PGCONNECT_TIMEOUT
              value: {{ .Values.createDatabase.connectTimeoutSeconds | quote }}
            - name: PGOPTIONS
              value: {{ printf "-c statement_timeout=%s" .Values.createDatabase.statementTimeout | quote }}
            - name: TARGET_DB
              value: {{ required "createDatabase.name 이 필요하다" .Values.createDatabase.name | quote }}
            - name: TARGET_OWNER
              value: {{ $databaseOwner | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
