{{- if and .Values.deployment.enabled .Values.ingress.enabled .Values.testApi.enabled }}
{{- if ne .Values.environment "dev" }}
{{- fail "testApi.enabled=true는 dev 환경에서만 허용된다" }}
{{- end }}
{{- $host := required "testApi.enabled=true이면 ingress.host가 필수" .Values.ingress.host }}
{{- $secretName := required "testApi.basicAuth.existingSecret이 필수" .Values.testApi.basicAuth.existingSecret }}
{{- $middlewareName := printf "%s-test-api-basic-auth" (include "umc-product-server.fullname" .) }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $middlewareName }}
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  basicAuth:
    secret: {{ $secretName | quote }}
    # Basic 자격증명이 백엔드 Authorization 헤더로 전달되지 않게 한다. 따라서 Bearer
    # JWT도 필요한 test endpoint는 이 Ingress를 통해 동시에 검증할 수 없다.
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "umc-product-server.fullname" . }}-test-api
  labels:
    {{- include "umc-product-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace $middlewareName | quote }}
    # 같은 host의 일반 / 라우터보다 /test 라우터가 항상 먼저 선택되게 한다.
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /test
            pathType: Prefix
            backend:
              service:
                name: {{ include "umc-product-server.fullname" . }}
                port:
                  name: http
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
