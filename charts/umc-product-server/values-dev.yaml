# 공유 개발 환경 override. bootstrap gate는 필수 이미지와 시크릿 검증 후에만 연다.

environment: dev

deployment:
  enabled: true

# develop 배포 CI가 tag와 digest를 함께 갱신하며 운영 values와 독립적으로 승격한다.
image:
  tag: "0533523fd8cd"
  digest: "sha256:64fd3ac92aec615e463759ab56d6e3ba84ce9d2336caea07d6ee12f3b34fdf59"

priorityClassName: dev-low

# dev 앱이 운영 DB에 연결되지 않도록 DB 허용 대상 namespace를 분리한다.
networkPolicy:
  enabled: true
  database:
    namespace: dev-db

ingress:
  enabled: true
  host: api-dev.university.neordinary.com
  tls:
    - hosts: [api-dev.university.neordinary.com]
      secretName: api-dev-university-neordinary-com-tls

certificate:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 2Gi
  limits:
    cpu: 1500m
    memory: 3Gi

env:
  SPRING_PROFILES_ACTIVE: dev
  SPRING_APPLICATION_NAME: dev-umc-product
  APP_ENVIRONMENT: dev
  CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,https://dev.admin.university.neordinary.com,https://www.dev.admin.university.neordinary.com,https://dev.auth.university.neordinary.com,https://www.dev.auth.university.neordinary.com,https://dev.activity.university.neordinary.com"
  APP_TEST_API_ENABLED: "true"
  # 외부 문서 경로는 별도 Traefik Basic Auth Ingress가 보호한다.
  OPENAPI_ENABLE: "true"
  FCM_ENABLED: "true"
  # dev 프론트 주소를 확정하기 전까지 공용 프론트를 사용한다. dev QR 플로우 검증 전 교체한다.
  DEMODAY_QR_BASE_URL: https://university.neordinary.com
  SSO_ISSUER: https://api-dev.university.neordinary.com
  # macOS Google 소셜 SSO. Client Secret은 app-oauth Secret에서 공급한다.
  SSO_SOCIAL_GOOGLE_ENABLED: "true"
  SSO_SOCIAL_GOOGLE_CLIENT_ID: "882297658822-ag179p23eqhc5lti8ue5cgbf5phekbfh.apps.googleusercontent.com"
  SSO_SOCIAL_GOOGLE_CALLBACK_URI: https://api-dev.university.neordinary.com/api/v1/auth/sso/social/google/callback
  SSO_SOCIAL_APPLE_ENABLED: "true"
  SSO_SOCIAL_APPLE_CALLBACK_URI: https://api-dev.university.neordinary.com/api/v1/auth/sso/social/apple/callback
  SSO_SOCIAL_KAKAO_ENABLED: "true"
  SSO_SOCIAL_KAKAO_CALLBACK_URI: https://api-dev.university.neordinary.com/api/v1/auth/sso/social/kakao/callback
  SSO_SOCIAL_KAKAO_OIDC: "true"
  KAKAO_ALLOWED_REDIRECT_URIS: https://api-dev.university.neordinary.com/api/v1/auth/sso/social/kakao/callback
  # Auth App이 Kakao JS SDK로 받은 ID Token의 aud(JavaScript 키). 공개 키라 Secret이 아니다.
  KAKAO_ALLOWED_ID_TOKEN_AUDIENCES: "4e79ba06223b60e13ad76bb6aec8f2b9"
  CERTIFICATE_VERIFICATION_URL_TEMPLATE: https://api-dev.university.neordinary.com/api/v1/certificates/verify/{serialNumber}
  S3_BUCKET_NAME: umc-product-dev-app-storage-351284652562-ap-northeast-2
  S3_REGION: ap-northeast-2
  SES_REGION: ap-northeast-2
  # SMTP 지원 이미지와 app-email/SMTP_PASSWORD를 먼저 준비한다. SES 복귀 시 provider와 발신자를 함께 변경한다.
  EMAIL_PROVIDER: smtp
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USERNAME: umcproduct1227@gmail.com
  EMAIL_NO_REPLY_ADDRESS: umcproduct1227@gmail.com
  GOOGLE_CLIENT_ID_LIST: "882297658822-ag179p23eqhc5lti8ue5cgbf5phekbfh.apps.googleusercontent.com,882297658822-qaf493b6fu6a9f33artnu435jimkoome.apps.googleusercontent.com,882297658822-gsl0u8uo78qtt5h0ggkm421sml9c02pd.apps.googleusercontent.com,882297658822-d47kcffbv3eoms278pak6rcv21lhcei8.apps.googleusercontent.com,655033275728-f7jpdingakk1f4im8reegjmioth8jvnv.apps.googleusercontent.com"
  APP_SEED_ENABLED: "true"
  # 앱이 기동할 때마다 QA 시딩(/test/seed/qa와 같음)을 실행한다. 이미 있는 데이터는 건너뛰므로 켜 둔 채로 둔다.
  APP_SEED_QA_AUTO_RUN: "true"
  # 개발 앱 전용 role과 DB를 사용한다. 비밀번호는 dev-app의 app-db Secret에서 주입한다.
  DATABASE_URL: jdbc:postgresql://postgres.dev-db.svc.cluster.local:5432/umc_product_dev
  DATABASE_USERNAME: umc_product_dev_app
  MEDIA_STORAGE_PURGE_ENABLED: "false"
  PRIVACY_RETENTION_ENABLED: "false"

documentation:
  enabled: true

# 데이터 변경용 test API는 dev에서만 문서용 Basic Auth 자격증명으로 보호해 제공한다.
testApi:
  enabled: true

probes:
  startup:
    failureThreshold: 60

# Firebase 자격증명은 dev 전용 AWS source에서 공급한다.
requiredSecrets:
  - app-db
  - app-jwt
  - app-oauth
  - app-storage
  - app-email
  - app-fcm
  - app-report-discord
  # QA 시딩 계정 비밀번호. 이미 만든 계정은 바뀌지 않으므로 Reloader 대상에 넣지 않는다.
  - app-seed

reloader:
  secretNames:
    - app-oauth
    - app-storage
    - app-email
    - app-fcm
    - app-report-discord
