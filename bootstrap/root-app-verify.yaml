# 기존 앱 writer 중지와 새 DB 복원 확인 후 사용한다.
# API/Preview Application은 포함하되 ExternalDNS는 제외해 DNS 전환 전 검증 단계를 구성한다.
# 실제 앱 실행은 chart의 workload gate에 따르며, 이 파일로 기존 ExternalDNS를 중지할 수는 없다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/UMC-PRODUCT/umc-product-infra.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: applications/platform/external-dns.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
