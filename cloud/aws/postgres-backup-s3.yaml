AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated encrypted S3 bucket and write-only IAM user for UMC Product PostgreSQL backups

# 백업 저장소·업로드 사용자를 준비한다. access key 발급과 백업 작업 활성화는 별도 절차다.
Parameters:
  BackupBucketName:
    Type: String
    Description: Globally unique bucket name for production PostgreSQL backups
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

Rules:
  SeoulRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, ap-northeast-2]
        AssertDescription: Deploy this stack only in Seoul (ap-northeast-2)

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    # 스택 삭제·교체 시 기존 백업 버킷을 보존한다. 객체 lifecycle 정리는 계속 적용된다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BackupBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        # 운영 백업 접두사에만 현재 버전 만료·이전 버전 정리 기준을 적용한다.
        Rules:
          - Id: expire-production-postgres-backups
            Status: Enabled
            Prefix: postgres/prod/
            ExpirationInDays: 35
            NoncurrentVersionExpiration:
              NoncurrentDays: 35
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        # 객체 ACL을 사용하지 않고 버킷 소유권·IAM 정책으로 접근을 관리한다.
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        # 같은 키로 다시 업로드해도 이전 버전을 lifecycle 정리 전까지 보관한다.
        Status: Enabled
      Tags:
        - Key: managed-by
          Value: cloudformation
        - Key: purpose
          Value: postgres-backup

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # 보존되는 버킷에도 HTTPS·암호화 요구 정책을 남긴다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyMissingServerSideEncryption
            # 기본 암호화와 별개로 업로드 요청에 AES256 암호화 헤더를 명시하도록 강제한다.
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${BackupBucket.Arn}/postgres/prod/*"
            Condition:
              "Null":
                s3:x-amz-server-side-encryption: "true"
          - Sid: DenyWrongServerSideEncryption
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${BackupBucket.Arn}/postgres/prod/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: AES256

  BackupWriter:
    # 백업 객체는 업로드·multipart 취소만 허용한다. 조회·복구·삭제 권한은 부여하지 않는다.
    Type: AWS::IAM::User
    Properties:
      UserName: umc-product-postgres-backup-writer
      Policies:
        - PolicyName: write-production-postgres-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBucketLocation
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt BackupBucket.Arn
              - Sid: UploadBackupObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${BackupBucket.Arn}/postgres/prod/*"
      Tags:
        - Key: managed-by
          Value: cloudformation
        - Key: purpose
          Value: postgres-backup-writer

Outputs:
  BackupBucketName:
    Value: !Ref BackupBucket
  BackupBucketRegion:
    Value: !Ref AWS::Region
  BackupBucketOwnerAccountId:
    Value: !Ref AWS::AccountId
  BackupWriterUserName:
    Value: !Ref BackupWriter
