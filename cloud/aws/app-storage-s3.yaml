AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated private S3 bucket and least-privilege IAM user for one UMC Product environment

# 환경 하나마다 별도 버킷·IAM 사용자를 만든다. access key 발급과 Secret 등록은 별도 절차다.
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - prod
      - dev
      - preview
    Description: UMC Product application environment that owns this bucket and IAM user

Mappings:
  EnvironmentConfig:
    prod:
      BucketPrefix: umc-product-prod-app-storage
      UserName: umc-product-prod-app-storage
      PolicyName: access-production-app-storage
    dev:
      BucketPrefix: umc-product-dev-app-storage
      UserName: umc-product-dev-app-storage
      PolicyName: access-development-app-storage
    preview:
      BucketPrefix: umc-product-preview-app-storage
      UserName: umc-product-preview-app-storage
      PolicyName: access-preview-app-storage

Rules:
  SeoulRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-northeast-2]
        AssertDescription: This stack must be deployed in ap-northeast-2

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  AppStorageBucket:
    Type: AWS::S3::Bucket
    # 스택 삭제·리소스 교체로 업로드 파일이 사라지지 않도록 기존 버킷을 남긴다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub
        - "${BucketPrefix}-${AWS::AccountId}-${AWS::Region}"
        - BucketPrefix: !FindInMap [EnvironmentConfig, !Ref Environment, BucketPrefix]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        # 브라우저 요청을 허용할 origin 목록이다. localhost는 dev·preview에서만 포함한다.
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins: !If
              - IsProduction
              - - https://university.neordinary.com
                - https://admin.university.neordinary.com
                - https://tech.university.neordinary.com
              - - https://university.neordinary.com
                - https://admin.university.neordinary.com
                - https://tech.university.neordinary.com
                - http://localhost:5173
            ExposedHeaders:
              - ETag
              - x-amz-server-side-encryption
              - x-amz-request-id
              - x-amz-id-2
            MaxAge: 3600
      LifecycleConfiguration:
        # 완료된 파일은 만료시키지 않고 중단된 multipart 업로드만 정리한다.
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        # 개별 객체 ACL 대신 버킷 소유권과 IAM 정책으로 접근을 관리한다.
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        # public/ 접두사의 객체도 익명 공개 대상으로 만들지 않는다.
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: managed-by
          Value: cloudformation
        - Key: environment
          Value: !Ref Environment
        - Key: purpose
          Value: app-storage

  AppStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # 보존되는 버킷에 HTTPS 강제 정책도 함께 남긴다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AppStorageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AppStorageBucket.Arn
              - !Sub "${AppStorageBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AppStorageUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !FindInMap [EnvironmentConfig, !Ref Environment, UserName]
      Policies:
        - PolicyName: !FindInMap [EnvironmentConfig, !Ref Environment, PolicyName]
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListApplicationStorage
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AppStorageBucket.Arn
              - Sid: ReadWriteApplicationObjects
                # 객체 읽기·쓰기·삭제는 앱이 사용하는 두 접두사로 한정한다.
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${AppStorageBucket.Arn}/public/*"
                  - !Sub "${AppStorageBucket.Arn}/private/*"
      Tags:
        - Key: managed-by
          Value: cloudformation
        - Key: environment
          Value: !Ref Environment
        - Key: purpose
          Value: app-storage

Outputs:
  AppStorageEnvironment:
    Value: !Ref Environment
  AppStorageBucketName:
    Value: !Ref AppStorageBucket
  AppStorageBucketRegion:
    Value: !Ref AWS::Region
  AppStorageBucketOwnerAccountId:
    Value: !Ref AWS::AccountId
  AppStorageUserName:
    Value: !Ref AppStorageUser
  AppStorageUserArn:
    Value: !GetAtt AppStorageUser.Arn
