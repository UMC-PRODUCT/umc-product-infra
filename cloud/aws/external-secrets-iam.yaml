AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege IAM identities for UMC Product External Secrets Operator

# 이 스택은 자격증명 값이나 Secrets Manager Secret을 만들지 않는다.
# bootstrap user는 Secret을 직접 읽지 못하고, namespace가 맞는 환경 역할만 AssumeRole한다.
Rules:
  SeoulRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, ap-northeast-2]
        AssertDescription: Deploy this stack only in Seoul (ap-northeast-2)

Resources:
  BootstrapUser:
    # IAM 사용자만 생성한다. 실제 access key 발급·클러스터 등록은 별도 절차다.
    Type: AWS::IAM::User
    Properties:
      UserName: umc-external-secrets-bootstrap
      Tags:
        - Key: managed-by
          Value: cloudformation
        - Key: purpose
          Value: external-secrets-bootstrap

  ProdRole:
    # 각 역할은 요청 세션의 SecretStore 이름·종류·namespace 태그를 조건으로 신뢰한다.
    # 운영 앱·DB용 ESO는 이 역할에 나열된 prod Secret만 읽을 수 있다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-prod
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: [app, db]
      Policies:
        - PolicyName: read-umc-product-prod-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Secrets Manager ARN의 자동 6자리 suffix만 허용한다. -*는 같은 접두사의 다른 이름까지 넓어진다.
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/app-db-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/app-jwt-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/app-oauth-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/app-storage-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/app-email-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/app-fcm-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/docs-basic-auth-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/postgres-secrets-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/postgres-readonly-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/postgres-exporter-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/prod/backup-s3-??????"

  DevRole:
    # dev 앱·DB의 Secret 읽기 범위를 운영 환경과 분리한다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-dev
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: [dev-app, dev-db]
      Policies:
        - PolicyName: read-umc-product-dev-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/app-db-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/app-jwt-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/app-oauth-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/app-storage-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/app-email-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/docs-basic-auth-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/dev/postgres-secrets-??????"

  PreviewRole:
    # PR별 역할을 만들지 않고 preview namespace용 Secret 읽기 역할을 공유한다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-preview
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: preview
      Policies:
        - PolicyName: read-umc-product-preview-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/app-db-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/app-jwt-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/app-oauth-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/app-storage-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/app-email-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/docs-basic-auth-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/preview/postgres-preview-secrets-??????"

  MonitoringRole:
    # 모니터링은 Grafana 관리자·Discord 알림 Secret만 읽는다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-monitoring
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: monitoring
      Policies:
        - PolicyName: read-umc-product-monitoring-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/platform/monitoring/grafana-admin-??????"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/platform/monitoring/alertmanager-discord-??????"

  ArgoCDRole:
    # Argo CD가 Preview PR을 조회하는 GitHub token만 읽는다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-argocd
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: argocd
      Policies:
        - PolicyName: read-umc-product-argocd-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/platform/argocd/preview-github-token-??????"

  CertManagerRole:
    # DNS 변경 권한 자체가 아니라 cert-manager용 Route 53 자격증명을 읽는 역할이다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-cert-manager
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: cert-manager
      Policies:
        - PolicyName: read-umc-product-cert-manager-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/platform/cert-manager/route53-credentials-??????"

  ExternalDNSRole:
    # ExternalDNS 자격증명은 cert-manager와 별도 Secret으로 읽는다.
    Type: AWS::IAM::Role
    Properties:
      RoleName: umc-secrets-external-dns
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapUser.Arn
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/esoStoreKind: SecretStore
                aws:RequestTag/esoStoreName: aws-secretsmanager
                aws:RequestTag/esoNamespace: external-dns
      Policies:
        - PolicyName: read-umc-product-external-dns-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/umc-product/platform/external-dns/route53-credentials-??????"

  BootstrapAssumeRolePolicy:
    # bootstrap 사용자에게 위 역할의 AssumeRole·세션 태그 권한만 부여한다.
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: assume-umc-product-secret-roles
      Users: [!Ref BootstrapUser]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Resource:
              - !GetAtt ProdRole.Arn
              - !GetAtt DevRole.Arn
              - !GetAtt PreviewRole.Arn
              - !GetAtt MonitoringRole.Arn
              - !GetAtt ArgoCDRole.Arn
              - !GetAtt CertManagerRole.Arn
              - !GetAtt ExternalDNSRole.Arn

Outputs:
  BootstrapUserName:
    Value: !Ref BootstrapUser
  AwsAccountId:
    Value: !Ref AWS::AccountId
  AwsRegion:
    Value: !Ref AWS::Region
