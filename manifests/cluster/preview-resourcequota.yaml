# 단일 노드 Preview 예산. 고정 PostgreSQL Service 2개와 PR Service 최대 2개만 허용한다.
# 1차 차단은 backend publish-preview.yml의 admit job이 라벨을 떼는 것이다. quota는 그 판정이
# 동시에 실행되는 등으로 빗나갔을 때의 마지막 차단이다.
# PR Service는 createdb Job보다 먼저 동기화되어 세 번째 PR이 DB를 남기지 못하게 한다.
# quota는 namespace 전체 합계다. 요청을 거부할 뿐 기존 PR을 골라 종료하거나 자리를 교체하지 않는다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-budget
  namespace: preview
spec:
  hard:
    # 모든 PR이 공유하는 와일드카드 Certificate와 Mailpit loopback Certificate만 허용한다.
    count/certificates.cert-manager.io: "2"
    count/services: "4"
    # 공용 PostgreSQL exporter 1개 + PR 앱 2개. PR 슬롯 수는 위 Service 수가 먼저 막는다.
    count/deployments.apps: "3"
    # 앱 2개(250m/2Gi, limit 3Gi) + 공용 PostgreSQL(250m/2Gi, limit 2Gi)
    # + 공용 PostgreSQL exporter 1개(10m/32Mi, limit 64Mi)
    # + PR별 Mailpit 2개(20m/64Mi, limit 128Mi)
    # + 동시에 도는 dev 복원 Job 2개(100m/128Mi, limit 512Mi)와 삭제 Job 2개(50m/64Mi, limit 128Mi)
    # + 고아 DB 점검 CronJob 1개(20m/32Mi, limit 64Mi)
    # 두 PR이 함께 닫혀도 두 번째 PostDelete 삭제 Job이 quota에 막혀 DeletionError로 남지 않게 한다.
    requests.cpu: 1120m
    requests.memory: 6720Mi
    limits.memory: 9856Mi
    # PVC는 이 namespace의 공용 PostgreSQL data 하나(5Gi)뿐이다. PR chart가 PVC를 만들지 못하게 막는다.
    # 이 두 값과 위 Certificate 수는 설계상 상시 100%라 prometheus.yaml의 Discord route가 이 세 resource의
    # KubeQuotaFullyUsed를 버린다. hard limit을 바꾸면 그 route도 고친다.
    count/persistentvolumeclaims: "1"
    requests.storage: 5Gi
