# 단일 노드 Preview 예산. 고정 PostgreSQL Service 2개와 PR Service 최대 3개만 허용한다.
# PR Service는 createdb Job보다 먼저 동기화되어 네 번째 PR이 DB를 남기지 못하게 한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-budget
  namespace: preview
spec:
  hard:
    # 모든 PR이 공유하는 와일드카드 Certificate 하나만 허용한다.
    count/certificates.cert-manager.io: "1"
    count/services: "5"
    count/deployments.apps: "3"
    requests.cpu: 1050m
    requests.memory: 4416Mi
    limits.memory: 7808Mi
