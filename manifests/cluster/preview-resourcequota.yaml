# 단일 노드 Preview 예산. 고정 PostgreSQL Service 2개와 PR Service 최대 2개만 허용한다.
# 1차 차단은 backend publish-preview.yml의 admit job이 라벨을 떼는 것이다. quota는 그 판정이
# 동시에 실행되는 등으로 빗나갔을 때의 마지막 차단이다.
# PR Service는 createdb Job보다 먼저 동기화되어 세 번째 PR이 DB를 남기지 못하게 한다.
# quota는 namespace 전체 합계다. 요청을 거부할 뿐 기존 PR을 골라 종료하거나 자리를 교체하지 않는다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-budget
  namespace: preview
spec:
  hard:
    # 모든 PR이 공유하는 와일드카드 Certificate 하나만 허용한다.
    count/certificates.cert-manager.io: "1"
    count/services: "4"
    count/deployments.apps: "2"
    # 앱 2개(250m/2Gi, limit 3Gi) + 공용 PostgreSQL(250m/2Gi, limit 2Gi)
    # + PR별 Mailpit 2개(20m/64Mi, limit 128Mi)
    # + 동시에 도는 dev 복원 Job 2개(100m/128Mi, limit 512Mi)와 삭제 Job 1개(50m/64Mi, limit 128Mi)
    requests.cpu: 1040m
    requests.memory: 6592Mi
    limits.memory: 9600Mi
