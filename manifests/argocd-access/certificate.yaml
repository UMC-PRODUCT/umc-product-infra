# Argo CD 공개 HTTPS용 인증서를 먼저 발급한다. 같은 Application의 Ingress(wave 1)가 이 Secret을 사용한다.
# Ready는 최신 generation 기준으로 health gate가 확인하며 TLS private key를 Git에 저장하지 않는다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretName: argo-university-neordinary-com-tls
  dnsNames:
    - argo.university.neordinary.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
