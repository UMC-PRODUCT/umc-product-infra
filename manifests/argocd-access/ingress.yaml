# 표준 Ingress의 HTTP backend를 사용한다. Argo CD CLI는 --grpc-web을 사용한다.
# 외부 TLS는 Traefik websecure에서 종료하고 내부 argocd-server의 http Service 포트로 전달한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    external-dns.kubernetes.io/managed-by: umc-infra
    external-dns.kubernetes.io/target: "1.255.226.166"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: argo.university.neordinary.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
  # Certificate의 secretName과 같아야 하며 이 Secret은 Ingress와 같은 namespace에 있어야 한다.
  tls:
    - hosts:
        - argo.university.neordinary.com
      secretName: argo-university-neordinary-com-tls
