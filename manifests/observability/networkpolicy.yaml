# monitoring namespace는 기본적으로 ingress를 닫고, 실제 데이터 흐름만 추가로 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Prometheus, Grafana, Loki 등 platform 내부 통신. Collector와 Tempo는 아래의
# port별 정책으로 더 좁게 열기 위해 이 정책의 대상에서 제외한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-same-namespace
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [opentelemetry-collector, tempo]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# Grafana의 public Ingress를 열었을 때도 kube-system Traefik의 3000/TCP만 허용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow-traefik-ingress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - { protocol: TCP, port: 3000 }
---
# 운영·개발·PR 앱은 중앙 OTel gateway의 OTLP port에만 들어올 수 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-allow-app-otlp
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
      component: standalone-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [app, dev-app, preview]
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
---
# Collector 자체 metrics는 monitoring namespace의 Prometheus만 scrape한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-allow-prometheus-metrics
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
      component: standalone-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: prometheus
              app.kubernetes.io/component: server
      ports:
        - { protocol: TCP, port: 8888 }
---
# Tempo chart 1.18.0 Service는 비활성화할 수 없는 legacy receiver port도 선언한다.
# 실제 config는 OTLP만 켜며, 정책은 Collector의 OTLP/HTTP와 내부 query/metrics만 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-allow-required-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 3100 }
        - { protocol: TCP, port: 4318 }
