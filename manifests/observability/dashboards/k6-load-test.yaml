# 자동 생성 — observability/ 원본은 직접 수정하고 scripts/gen-configmaps.py를 재실행하세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-k6-load-test
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: umc-infra
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards/UMC Product
data:
  k6-load-test.json: |
    {
      "description": "dev·preview 부하 테스트 중 어느 자원이 먼저 차는지 볼 때 연다. 상단 env로 환경을 고르면 앱·DB 패널이 모두 따라간다. 헤더(현재 상태) ①k6 판정 ②앱 내부 ③DB 내부 ④호스트 USE ⑤DB 컨테이너. 공유 크로스헤어로 같은 시각을 위에서 아래로 읽는다. 실행은 umc-product-server의 loadtest/README.md를 본다.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "System Overview",
          "type": "link",
          "url": "/d/umc-product-system-overview"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "앱이 직접 센 초당 HTTP 요청 수(actuator 제외). 앱 limiter가 막은 429도 포함한다. No data는 앱 지표를 수집하지 못했다는 뜻이다.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_server_requests_milliseconds_count{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\", uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "앱 초당 요청",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "앱이 잰 p95 응답 시간의 마지막 값(actuator 제외). 800ms를 넘으면 빨갛게 표시한다. 마지막 구간에 요청이 없으면 \"요청 없음\"으로 보인다.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "요청 없음",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 800
                  }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 5,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_milliseconds_bucket{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\", uri!~\"/actuator.*\"}[$__rate_interval]))) >= 0",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "앱 p95 응답시간",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "선택한 조회 범위 전체에서 요청 수 기준으로 센 5xx 비율. 1%를 넘으면 빨갛게 표시한다. 요청이 없으면 0이다.",
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 10,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(increase(http_server_requests_milliseconds_count{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\", status=~\"5..\"}[$__range])) or vector(0)) / clamp_min(sum(increase(http_server_requests_milliseconds_count{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\"}[$__range])), 1e-9)",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "5xx 비율",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "DB 커넥션을 기다리는 요청 수. 0보다 크면 이미 커넥션 풀이 병목이다. 풀 크기는 10이다.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 15,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(hikaricp_connections_pending{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Hikari pending",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "요청을 처리 중인 Tomcat 스레드 수. 최대 200이다. 최대에 가까우면 요청이 줄을 선다.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 160
                  },
                  {
                    "color": "red",
                    "value": 200
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 19,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(tomcat_threads_busy{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Tomcat 바쁜 스레드",
          "type": "stat"
        },
        {
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 6,
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "k6 가 세는 HTTP 요청/초. 홈 1행동=4요청이라 사용자 기준 처리량(TPS)=RPS÷4. breakpoint 로 점증 중 여기가 평평해지는 순간부터가 포화 — 아래 응답시간과 같이 본다. k6 실행 중에만 채워진다. 보내는 방법은 서버 저장소 [loadtest/README.md의 \"결과를 Grafana로 보내기\"](https://github.com/UMC-PRODUCT/umc-product-server/blob/develop/loadtest/README.md)를 본다.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 2,
                    "showPoints": "never"
                  },
                  "unit": "reqps"
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "RPS"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "fixedColor": "#5794F2",
                          "mode": "fixed"
                        }
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 5,
                "w": 24,
                "x": 0,
                "y": 5
              },
              "id": 7,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": false
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(k6_http_reqs_total{env=\"$env\", env=~\"dev|preview\", testid=~\"$testid\"}[$__rate_interval]))",
                  "legendFormat": "RPS",
                  "refId": "A"
                }
              ],
              "title": "처리량 RPS (요청/초)",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "단위: 초. p95(진한 선)가 판정 기준 — TPS 평탄화와 동시 급등 지점이 한계. p95·avg는 실행 시작부터의 누적이 아니라 최근 rate 창 안의 요청만 본 구간 값이다. k6 실행 중에만 채워진다. 보내는 방법은 서버 저장소 [loadtest/README.md의 \"결과를 Grafana로 보내기\"](https://github.com/UMC-PRODUCT/umc-product-server/blob/develop/loadtest/README.md)를 본다.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 2,
                    "showPoints": "never",
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "transparent",
                        "value": null
                      },
                      {
                        "color": "#F2495C",
                        "value": 0.8
                      }
                    ]
                  },
                  "unit": "s"
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "p95"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "fixedColor": "#D9578F",
                          "mode": "fixed"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "avg"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "fixedColor": "#EFA8CD",
                          "mode": "fixed"
                        }
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 5,
                "w": 24,
                "x": 0,
                "y": 10
              },
              "id": 8,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_quantile(0.95, sum(rate(k6_http_req_duration_seconds{env=\"$env\", env=~\"dev|preview\", testid=~\"$testid\"}[$__rate_interval])))",
                  "legendFormat": "p95",
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_avg(sum(rate(k6_http_req_duration_seconds{env=\"$env\", env=~\"dev|preview\", testid=~\"$testid\"}[$__rate_interval])))",
                  "legendFormat": "avg",
                  "refId": "B"
                }
              ],
              "title": "응답시간 (전체 집계)",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "위 선(VUs)=접속해서 결과를 기다리는 인원, 아래 선(busy)=서버가 지금 잡고 일하는 요청 수. 두 선의 간격 = 어딘가 줄에서 기다리는 인원. VUs 급증 자체가 포화 신호(행동 시간이 길어지고 있다는 뜻). VUs 선은 k6 실행 중에만 채워진다. 보내는 방법은 서버 저장소 [loadtest/README.md의 \"결과를 Grafana로 보내기\"](https://github.com/UMC-PRODUCT/umc-product-server/blob/develop/loadtest/README.md)를 본다.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 2,
                    "showPoints": "never"
                  },
                  "unit": "short"
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "동시 접속자 (응답 대기 포함)"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "fixedColor": "#8E8E93",
                          "mode": "fixed"
                        }
                      },
                      {
                        "id": "custom.lineStyle",
                        "value": {
                          "dash": [
                            10,
                            6
                          ],
                          "fill": "dash"
                        }
                      },
                      {
                        "id": "custom.fillOpacity",
                        "value": 0
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 5,
                "w": 24,
                "x": 0,
                "y": 15
              },
              "id": 9,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(k6_vus{env=\"$env\", env=~\"dev|preview\", testid=~\"$testid\"})",
                  "legendFormat": "동시 접속자 (응답 대기 포함)",
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "tomcat_threads_busy{application=\"$service\", application=~\"dev-umc-product|preview-umc-product-pr[0-9]+\"}",
                  "legendFormat": "서버가 실제 처리 중",
                  "refId": "B"
                }
              ],
              "title": "동시 접속자 — 체류(VUs) vs 서버 처리 중(Tomcat busy)",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "auth = 토큰 발급(측정 대상 아님, 분리 표시). k6 실행 중에만 채워진다. 보내는 방법은 서버 저장소 [loadtest/README.md의 \"결과를 Grafana로 보내기\"](https://github.com/UMC-PRODUCT/umc-product-server/blob/develop/loadtest/README.md)를 본다.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 2,
                    "showPoints": "never"
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 7,
                "w": 8,
                "x": 0,
                "y": 20
              },
              "id": 10,
              "options": {
                "legend": {
                  "calcs": [
                    "mean",
                    "max"
                  ],
                  "displayMode": "table",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (scenario) (rate(k6_http_reqs_total{env=\"$env\", env=~\"dev|preview\", testid=~\"$testid\"}[$__rate_interval]))",
                  "legendFormat": "{{scenario}}",
                  "refId": "A"
                }
              ],
              "title": "시나리오별 RPS",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "시나리오별 p95는 실행 시작부터의 누적이 아니라 최근 rate 창 안의 요청만 본 구간 값이다. k6 실행 중에만 채워진다. 보내는 방법은 서버 저장소 [loadtest/README.md의 \"결과를 Grafana로 보내기\"](https://github.com/UMC-PRODUCT/umc-product-server/blob/develop/loadtest/README.md)를 본다.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 2,
                    "showPoints": "never",
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "transparent",
                        "value": null
                      },
                      {
                        "color": "#F2495C",
                        "value": 0.8
                      }
                    ]
                  },
                  "unit": "s"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 7,
                "w": 8,
                "x": 8,
                "y": 20
              },
              "id": 11,
              "options": {
                "legend": {
                  "calcs": [
                    "mean",
                    "max"
                  ],
                  "displayMode": "table",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_quantile(0.95, sum by (scenario) (rate(k6_http_req_duration_seconds{env=\"$env\", env=~\"dev|preview\", testid=~\"$testid\"}[$__rate_interval])))",
                  "legendFormat": "{{scenario}}",
                  "refId": "A"
                }
              ],
              "title": "시나리오별 p95",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "실패 기준은 k6 expected_response이고, 2xx·3xx 외 상태는 실패로 센다. 실패가 없으면 0으로 보인다. k6 실행 중에만 채워진다. 보내는 방법은 서버 저장소 [loadtest/README.md의 \"결과를 Grafana로 보내기\"](https://github.com/UMC-PRODUCT/umc-product-server/blob/develop/loadtest/README.md)를 본다.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
