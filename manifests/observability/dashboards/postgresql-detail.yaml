                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(kube_pod_container_resource_requests{namespace=\"db\", pod=~\"postgres-.*\", container=\"postgres\", resource=\"cpu\", unit=\"core\"})",
                            "legendFormat": "CPU request",
