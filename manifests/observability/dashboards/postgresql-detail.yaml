# 자동 생성 — observability/ 원본은 직접 수정하고 scripts/gen-configmaps.py를 재실행하세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-postgresql-detail
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: umc-infra
    grafana_dashboard: "1"
data:
  postgresql-detail.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "umc-product-postgresql-detail"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "[PROD ONLY] 운영 클러스터의 PostgreSQL 전용 상세 대시보드. postgres-exporter DB 내부 지표와 kube-state-metrics의 선언 상태를 보여준다. dev에는 이 exporter가 없으므로 dev 데이터로 해석하지 않는다.",
        "editable": true,
        "elements": {
          "panel-100": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(kube_statefulset_status_replicas_ready{namespace=\"db\", statefulset=\"postgres\"})",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "Ready replicas",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(kube_statefulset_replicas{namespace=\"db\", statefulset=\"postgres\"})",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "Desired replicas",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "B"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "[prod-only] 운영 클러스터의 단일 PostgreSQL exporter/Kubernetes 상태입니다. PostgreSQL StatefulSet의 Ready replica 수와 desired replica 수입니다. 실제 데이터베이스 쿼리 가능 여부는 PostgreSQL Up 패널에서 확인합니다.",
              "id": 100,
              "links": [],
              "title": "PostgreSQL StatefulSet Replicas",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red"
                          },
                          {
                            "color": "green",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-101": {
