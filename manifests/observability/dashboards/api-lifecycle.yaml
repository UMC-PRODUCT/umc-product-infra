# 자동 생성 — observability/ 원본은 직접 수정하고 scripts/gen-configmaps.py를 재실행하세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-api-lifecycle
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: umc-infra
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards/UMC Product
data:
  api-lifecycle.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "umc-product-api-lifecycle"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "구 API 제거 검토용 요청 근거. 앱 버전은 OTLP structured metadata로 조회하며 사용되지 않았다는 판정이나 자동 삭제를 제공하지 않는다.",
        "editable": false,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "호출·버전 정보는 제거 검토의 근거 중 하나다.",
              "id": 1,
              "links": [],
              "title": "확인 순서와 관측 한계",
              "vizConfig": {
                "group": "text",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "content": "**기본 1시간 조회** · 서비스 → 메서드·경로 템플릿 → 클라이언트 순서로 좁히세요. 7·14·30일 집계는 오래 걸릴 수 있으므로 필요한 때 선택하세요. 자동 새로고침은 꺼져 있습니다.\n\n**오류 아이콘은 조회 실패입니다.** 아이콘의 오류 메시지를 먼저 확인하세요. `No data`나 목록 누락도 호출 0건·제거 가능을 뜻하지 않습니다. 계측·수집 상태와 구버전 지원 정책을 함께 확인하세요.\n\n`provided` 정상 헤더 · `missing` 헤더 없음 · `invalid` 무효 헤더 · `not_instrumented` 계측 전/수집 확인. [사용 가이드](https://github.com/UMC-PRODUCT/umc-product-infra/blob/main/docs/guides/api-lifecycle.md)",
                    "mode": "markdown"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "loki"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(count_over_time({service_name=~\"${service:regex}\"} | event=\"api_request_completed\" | label_format clientService=`{{ if .clientService }}{{ .clientService }}{{ else }}UNKNOWN{{ end }}` | clientService=~\"${client_service:regex}\" | method=~\"${method:regex}\" | uriTemplate=~`.*${uri_template:regex}.*` | keep service_name [$window]))",
                            "legendFormat": "",
                            "queryType": "instant"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "$window"
                  },
                  "transformations": []
                }
              },
              "description": "선택 조건에 일치해 실제 수집된 완료 로그 수. 인증 필터 등 MVC 인터셉터 이전 요청과 유실 로그를 포함하지 않는다. No data를 0으로 치환하지 않는다.",
              "id": 2,
              "links": [],
              "title": "선택 API 완료 로그 · $window",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "none",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(rate(http_server_requests_milliseconds_count{application=~\"${service:regex}\"}[5m]))",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "5m"
                  },
                  "transformations": []
                }
              },
              "description": "Prometheus 전체 서비스 참고값. 클라이언트·메서드·경로 필터를 적용하지 않으며 로그와 수집 범위가 다르다. 0이어도 전체 관측 기간의 로그 수집 정상이나 미사용을 증명하지 않는다.",
              "id": 3,
              "links": [],
              "title": "서비스 전체 HTTP 요청/초 · 최근 5분",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "none",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-4": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(increase(otelcol_exporter_send_failed_log_records[5m]))",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "5m"
                  },
                  "transformations": []
                }
              },
              "description": "모든 서비스의 Collector 실패 건수 참고값. 0이어도 수신 거부·앱 내 유실·과거 공백을 배제할 수 없다. No data는 Collector 상태 확인이 필요하다.",
              "id": 4,
              "links": [],
              "title": "전체 Collector 로그 전송 실패 · 최근 5분",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "none",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-5": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "loki"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sort_desc(sum by (method, uriTemplate) (count_over_time({service_name=~\"${service:regex}\"} | event=\"api_request_completed\" | label_format clientService=`{{ if .clientService }}{{ .clientService }}{{ else }}UNKNOWN{{ end }}` | clientService=~\"${client_service:regex}\" | method=~\"${method:regex}\" | uriTemplate=~`.*${uri_template:regex}.*` | keep service_name, method, uriTemplate [$window])))",
                            "legendFormat": "{{method}} {{uriTemplate}}",
                            "queryType": "instant"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "$window"
                  },
                  "transformations": []
                }
              },
              "description": "전체 API 목록이 아니라 이 기간에 관측된 API 목록이다. 목록에 없는 API는 미관측 상태로 별도 검토한다. Loki series 제한 오류가 나면 클라이언트·메서드·경로 조건을 좁힌다.",
              "id": 5,
              "links": [],
              "title": "API별 관측 호출 수 · $window",
              "vizConfig": {
                "group": "bargauge",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "displayName": "${__data.fields.method} ${__data.fields.uriTemplate}",
                      "min": 0,
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "displayMode": "basic",
                    "maxVizHeight": 32,
                    "minVizHeight": 32,
                    "minVizWidth": 8,
                    "namePlacement": "left",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "limit": 5000,
                      "values": true
                    },
                    "showUnfilled": true,
                    "sizing": "manual",
                    "valueMode": "color"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-6": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "loki"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sort_desc(sum by (clientService, clientVersion) (count_over_time({service_name=~\"${service:regex}\"} | event=\"api_request_completed\" | label_format clientService=`{{ if .clientService }}{{ .clientService }}{{ else }}UNKNOWN{{ end }}` | clientService=~\"${client_service:regex}\" | method=~\"${method:regex}\" | uriTemplate=~`.*${uri_template:regex}.*` | label_format clientVersion=`{{ if .clientVersion }}{{ .clientVersion }}{{ else }}NOT_INSTRUMENTED{{ end }}` | keep service_name, clientService, clientVersion [$window])))",
                            "legendFormat": "{{clientService}} · {{clientVersion}}",
                            "queryType": "instant"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "$window"
                  },
                  "transformations": []
                }
              },
              "description": "요청 건수이며 사용자 수·설치 수가 아니다. UNKNOWN은 식별하지 못한 버전이며 NOT_INSTRUMENTED는 버전 필드가 없는 기록이다. 미관측 버전의 설치나 재접속 가능성을 배제하지 않는다.",
              "id": 6,
              "links": [],
              "title": "클라이언트 · 버전별 관측 호출 수 · $window",
              "vizConfig": {
                "group": "bargauge",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "displayName": "${__data.fields.clientService} ${__data.fields.clientVersion}",
                      "min": 0,
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "displayMode": "basic",
                    "maxVizHeight": 32,
                    "minVizHeight": 32,
                    "minVizWidth": 8,
                    "namePlacement": "left",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "limit": 5000,
                      "values": true
                    },
                    "showUnfilled": true,
                    "sizing": "manual",
                    "valueMode": "color"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-7": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "loki"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum by (clientVersionStatus) (count_over_time({service_name=~\"${service:regex}\"} | event=\"api_request_completed\" | label_format clientService=`{{ if .clientService }}{{ .clientService }}{{ else }}UNKNOWN{{ end }}` | clientService=~\"${client_service:regex}\" | method=~\"${method:regex}\" | uriTemplate=~`.*${uri_template:regex}.*` | label_format clientVersionStatus=`{{ if .clientVersionStatus }}{{ .clientVersionStatus }}{{ else }}not_instrumented{{ end }}` | keep service_name, clientVersionStatus [$window]))",
                            "legendFormat": "{{clientVersionStatus}}",
                            "queryType": "instant"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "$window"
                  },
                  "transformations": []
                }
              },
              "description": "provided: 유효한 헤더, missing: 헤더 없음, invalid: 무효 헤더, not_instrumented: 상태 필드 없음. 전체 데이터가 없으면 비중도 알 수 없다. 없는 항목을 0으로 보충하지 않는다.",
              "id": 7,
              "links": [],
              "title": "버전 계측 상태 비중 · $window",
              "vizConfig": {
                "group": "piechart",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "displayLabels": [
                      "name",
                      "percent"
                    ],
                    "legend": {
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "values": [
                        "value",
                        "percent"
                      ]
                    },
                    "pieType": "pie",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "limit": 5000,
                      "values": true
                    },
                    "tooltip": {
                      "mode": "single",
                      "sort": "none"
                    }
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-8": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "loki"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "direction": "backward",
                            "editorMode": "code",
                            "expr": "{service_name=~\"${service:regex}\"} | event=\"api_request_completed\" | label_format clientService=`{{ if .clientService }}{{ .clientService }}{{ else }}UNKNOWN{{ end }}` | clientService=~\"${client_service:regex}\" | method=~\"${method:regex}\" | uriTemplate=~`.*${uri_template:regex}.*` | label_format clientVersion=`{{ if .clientVersion }}{{ .clientVersion }}{{ else }}NOT_INSTRUMENTED{{ end }}`, clientVersionStatus=`{{ if .clientVersionStatus }}{{ .clientVersionStatus }}{{ else }}not_instrumented{{ end }}` | keep service_name, method, uriTemplate, clientService, clientVersion, clientVersionStatus, statusCode | line_format `{{ .method }} {{ .uriTemplate }} | client={{ .clientService }} version={{ .clientVersion }} versionStatus={{ .clientVersionStatus }} http={{ .statusCode }}`",
                            "legendFormat": "",
                            "maxLines": 200,
                            "queryType": "range"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "timeFrom": "$window"
                  },
                  "transformations": []
                }
              },
              "description": "첫 행의 시간이 선택 조건·기간에서 마지막으로 관측한 시각이다. 전체 수명 중 마지막 호출을 보장하지 않는다. 사용자 ID·IP·실제 요청 경로·trace ID는 결과에서 제외한다.",
              "id": 8,
              "links": [],
              "title": "최근 관측 요청 · 최신 200건",
              "vizConfig": {
                "group": "logs",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "dedupStrategy": "none",
                    "enableInfiniteScrolling": false,
                    "enableLogDetails": false,
                    "prettifyLogMessage": false,
                    "showCommonLabels": false,
                    "showControls": false,
                    "showFieldSelector": false,
                    "showLabels": false,
                    "showLevel": false,
                    "showTime": true,
                    "sortOrder": "Descending",
                    "timestampResolution": "ms",
                    "unwrappedColumns": false,
                    "wrapLogMessage": true
                  }
                },
                "version": "13.0.1"
              }
            }
          }
        },
        "layout": {
          "kind": "GridLayout",
          "spec": {
            "items": [
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-1"
                  },
                  "height": 5,
                  "width": 24,
