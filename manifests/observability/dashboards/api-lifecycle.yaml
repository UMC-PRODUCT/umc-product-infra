                }
              }
            ]
          }
        },
        "links": [
          {
            "asDropdown": false,
            "icon": "external link",
            "includeVars": true,
            "keepTime": false,
            "tags": [],
            "targetBlank": false,
            "title": "System Overview",
            "type": "link",
            "url": "/d/umc-product-system-overview"
          },
          {
            "asDropdown": false,
            "icon": "external link",
            "includeVars": true,
            "keepTime": false,
            "tags": [],
            "targetBlank": false,
            "title": "Application Detail",
            "type": "link",
            "url": "/d/umc-product-server-default"
