          "panel-13": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(1 - (node_filesystem_avail_bytes{job=\"node-exporter\", os=\"linux\", device_error=\"\", fstype!~\"tmpfs|overlay|squashfs|devtmpfs|proc|sysfs|cgroup2?|pstore|tracefs|debugfs|securityfs|configfs|nsfs|autofs|fuse\\..*|ramfs|binfmt_misc|rpc_pipefs\", mountpoint!~\"^/(dev|proc|sys|run|var/lib/docker|var/lib/containers|var/lib/kubelet|snap)($|/)\"} / node_filesystem_size_bytes{job=\"node-exporter\", os=\"linux\", device_error=\"\", fstype!~\"tmpfs|overlay|squashfs|devtmpfs|proc|sysfs|cgroup2?|pstore|tracefs|debugfs|securityfs|configfs|nsfs|autofs|fuse\\..*|ramfs|binfmt_misc|rpc_pipefs\", mountpoint!~\"^/(dev|proc|sys|run|var/lib/docker|var/lib/containers|var/lib/kubelet|snap)($|/)\"}))",
                            "legendFormat": "worst eligible filesystem",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 실제 host filesystem 중 사용률이 가장 높은 값입니다. device error, pseudo/container filesystem과 /dev, /proc, /sys, /run, Docker/containerd/Kubelet/Snap mount를 제외합니다.",
