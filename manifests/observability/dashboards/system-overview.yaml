                      },
                      "unit": "reqps"
                    },
                    "overrides": []
                  },
                  "options": {
                    "annotations": {
                      "clustering": -1,
                      "multiLane": false
                    },
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-17": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
