# 자동 생성 — observability/ 원본은 직접 수정하고 scripts/gen-configmaps.py를 재실행하세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-system-overview
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: umc-infra
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards/UMC Product
data:
  system-overview.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "umc-product-system-overview"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "어디가 문제인지 모를 때 먼저 여는 홈 화면. UMC PRODUCT 운영 landing dashboard. prod/dev 앱의 metric signal과 RED, error logs, HikariCP 포화를 비교한다. PostgreSQL과 Linux host 영역은 PROD ONLY이며 dev exporter를 가정하지 않는다. 현재 수집하지 않는 cAdvisor Pod 실제 사용량은 표시하지 않는다. Traefik edge 행만 prod/dev 비교가 아니라 모든 host 합계다.",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(process_uptime_milliseconds{application=\"prod-umc-product\"}) > bool 0 or vector(0)",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "prod",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "prod Spring Boot uptime metric이 현재 Prometheus에 있으면 1입니다. OTLP metric signal 상태이며 외부 HTTP endpoint 가용성 probe는 아닙니다.",
              "id": 1,
              "links": [],
              "title": "[PROD] App telemetry status",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red"
                          },
                          {
                            "color": "green",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "none"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "min(up{job=\"node-exporter\", os=\"linux\"}) or vector(0)",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "prod linux",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 node_exporter scrape 상태입니다. 로컬 macOS exporter나 dev 애플리케이션 상태가 아닙니다.",
              "id": 10,
              "links": [],
              "title": "[PROD ONLY] Linux node exporter up",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red",
                            "value": 0
                          },
                          {
                            "color": "green",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "none"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{job=\"node-exporter\", os=\"linux\", mode=\"idle\"}[$__rate_interval]))",
                            "legendFormat": "{{instance}}",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 non-idle CPU 비율입니다.",
              "id": 11,
              "links": [],
              "title": "[PROD ONLY] Host CPU busy",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "drawStyle": "line",
                        "fillOpacity": 15,
                        "lineWidth": 2,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "none"
                        }
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": 0
                          },
                          {
                            "color": "yellow",
                            "value": 0.7
                          },
                          {
                            "color": "red",
                            "value": 0.9
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": ""
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "1 - (node_memory_MemAvailable_bytes{job=\"node-exporter\", os=\"linux\"} / node_memory_MemTotal_bytes{job=\"node-exporter\", os=\"linux\"})",
                            "legendFormat": "{{instance}}",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 MemAvailable/MemTotal 기반 memory 사용 비율입니다.",
              "id": 12,
              "links": [],
              "title": "[PROD ONLY] Host memory usage",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "drawStyle": "line",
                        "fillOpacity": 15,
                        "lineWidth": 2,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "none"
                        }
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": 0
                          },
                          {
                            "color": "yellow",
                            "value": 0.75
                          },
                          {
                            "color": "red",
                            "value": 0.9
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": ""
              }
            }
          },
          "panel-13": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(1 - (node_filesystem_avail_bytes{job=\"node-exporter\", os=\"linux\", device_error=\"\", fstype!~\"tmpfs|overlay|squashfs|devtmpfs|proc|sysfs|cgroup2?|pstore|tracefs|debugfs|securityfs|configfs|nsfs|autofs|fuse\\\\..*|ramfs|binfmt_misc|rpc_pipefs\", mountpoint!~\"^/(dev|proc|sys|run|var/lib/docker|var/lib/containers|var/lib/kubelet|snap)($|/)\"} / node_filesystem_size_bytes{job=\"node-exporter\", os=\"linux\", device_error=\"\", fstype!~\"tmpfs|overlay|squashfs|devtmpfs|proc|sysfs|cgroup2?|pstore|tracefs|debugfs|securityfs|configfs|nsfs|autofs|fuse\\\\..*|ramfs|binfmt_misc|rpc_pipefs\", mountpoint!~\"^/(dev|proc|sys|run|var/lib/docker|var/lib/containers|var/lib/kubelet|snap)($|/)\"}))",
                            "legendFormat": "worst eligible filesystem",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 실제 host filesystem 중 사용률이 가장 높은 값입니다. device error, pseudo/container filesystem과 /dev, /proc, /sys, /run, Docker/containerd/Kubelet/Snap mount를 제외합니다.",
              "id": 13,
              "links": [],
              "title": "[PROD ONLY] Host filesystem usage",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": 0
                          },
                          {
                            "color": "yellow",
                            "value": 0.75
                          },
                          {
                            "color": "red",
                            "value": 0.9
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-14": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "상황별로 어느 화면을 열지 안내한다. docs/guides/monitoring.md 표의 요약이다.",
              "id": 14,
              "links": [],
              "title": "어떤 화면을 열까",
              "vizConfig": {
                "group": "text",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  },
                  "options": {
                    "content": "이 화면에서 prod/dev 요청량·5xx 비율·응답 시간과 운영 DB·호스트 요약을 먼저 보고, 이상한 부분만 아래 화면으로 좁힌다. 링크는 지금 보는 시간 범위를 그대로 가져간다.\n\n| 상황 | 화면 | 먼저 볼 것 |\n|---|---|---|\n| API가 느리거나 에러가 늘었다 | [Application Detail](/d/umc-product-server-default?${__url_time_range}) | HTTP 응답 시간, JVM 메모리·GC, HikariCP 포화 |\n| 요청이 몰려 429가 난다 | 이 화면의 Traefik edge 패널 → [Application Detail](/d/umc-product-server-default?${__url_time_range}) | Traefik 차단 수, 앱 limiter 차단과 API별 429 |\n| 에러 메시지와 원인을 찾는다 | [서버팀 로그 탐색](/d/umc-product-server-logs?${__url_time_range}) | 같은 시간대 ERROR 로그와 trace ID |\n| 특정 요청이 어디서 오래 걸렸는지 본다 | [API 처리 흐름 (Tempo)](/d/umc-product-api-flow?${__url_time_range}) | trace의 구간별 처리 시간 |\n| 구 API를 어떤 앱 버전이 아직 호출하는지 본다 | [API 호환성 · 사용 현황](/d/umc-product-api-lifecycle?${__url_time_range}) | 경로·메서드별 호출, 버전 누락 |\n| 운영 DB 연결이 부족하거나 DB가 느리다 | [PostgreSQL Detail](/d/umc-product-postgresql-detail?${__url_time_range}) | 접속 수, transaction·lock, DB 용량 |\n| 서버 전체 CPU·메모리·디스크가 부족하다 | [Node Exporter Host Metrics](/d/umc-product-node-exporter-host?${__url_time_range}) | 호스트 CPU·메모리·디스크·네트워크 |\n| 캐시가 잘 동작하는지 본다 | [Cache](/d/umc-product-cache?${__url_time_range}) | Caffeine hit/miss, 적중률 |\n| dev·preview에 부하 테스트를 건다 | [부하 테스트 (k6)](/d/umc-product-k6-load-test?${__url_time_range}) | HikariCP pending, Tomcat 바쁜 스레드, 앱·DB 컨테이너 CPU(limit 대비)·throttling, 호스트 PSI, Traefik 메모리 |\n\n클러스터·Pod 자원, 네트워크, 호스트, 저장소, 모니터링 자체의 상태는 Kubernetes 폴더에서 본다. [0. Kubernetes 폴더 읽는 법](/d/umc-product-kubernetes-guide?${__url_time_range})에 상황별로 열 화면과 바로 가는 링크가 있다.\n\nPod가 Pending이거나 재시작·OOM이 난 원인은 Argo CD의 해당 Pod → Events/Logs에서 본다. 자세한 설명은 [조회 가이드](https://github.com/UMC-PRODUCT/umc-product-infra/blob/main/docs/guides/monitoring.md)에 있다.\n",
                    "mode": "markdown"
                  }
                }
              }
            }
          },
          "panel-15": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "umc-product 태그가 붙은 대시보드 목록. Kubernetes 폴더 안내도 포함한다. 시간 범위를 유지한 채 연다.",
              "id": 15,
              "links": [],
              "title": "UMC Product 대시보드",
              "vizConfig": {
                "group": "dashlist",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  },
                  "options": {
                    "includeVars": false,
                    "keepTime": true,
                    "maxItems": 20,
                    "query": "",
                    "showFolderNames": false,
                    "showHeadings": false,
                    "showRecentlyViewed": false,
                    "showSearch": true,
                    "showStarred": false,
                    "tags": [
                      "umc-product"
                    ]
                  }
                }
              }
            }
          },
          "panel-16": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "clamp_min(sum(rate(traefik_entrypoint_requests_total{code=\"429\"}[$__rate_interval])) - (sum(rate(traefik_service_requests_total{code=\"429\"}[$__rate_interval])) or vector(0)), 0) or sum(rate(traefik_entrypoint_requests_total[$__rate_interval])) * 0",
                            "legendFormat": "Traefik edge",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "앱에 닿기 전에 Traefik이 막은 요청 수(Traefik 429 − 앱 429). 어떤 변수도 따르지 않는 모든 host 합계이고 앱 로그에 남지 않는다. 0은 수집 중 차단이 늘지 않았다는 뜻이고, No data는 수집 실패다. Traefik이 재시작된 뒤 앱이 처음 429를 돌려준 때는 값이 잠깐 튈 수 있어 같은 시각 Application Detail의 `429 차단 — 규칙별`과 함께 본다. 자세한 한계는 docs/operations/domains-tls.md에 있다.",
              "id": 16,
              "links": [],
              "title": "Traefik edge 429 — 모든 host",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
