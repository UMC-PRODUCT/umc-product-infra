                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "1 - (node_memory_MemAvailable_bytes{job=\"node-exporter\", os=\"linux\"} / node_memory_MemTotal_bytes{job=\"node-exporter\", os=\"linux\"})",
