# 자동 생성 — observability/ 원본은 직접 수정하고 scripts/gen-configmaps.py를 재실행하세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-system-overview
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: umc-infra
    grafana_dashboard: "1"
  annotations:
    grafana_folder: /tmp/dashboards/UMC Product
data:
  system-overview.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "umc-product-system-overview"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "UMC PRODUCT 운영 landing dashboard. prod/dev 앱의 metric signal과 RED, error logs, HikariCP 포화를 비교한다. PostgreSQL과 Linux host 영역은 PROD ONLY이며 dev exporter를 가정하지 않는다. 현재 수집하지 않는 cAdvisor Pod 실제 사용량은 표시하지 않는다.",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(process_uptime_milliseconds{application=\"prod-umc-product\"}) > bool 0 or vector(0)",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "prod",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "prod Spring Boot uptime metric이 현재 Prometheus에 있으면 1입니다. OTLP metric signal 상태이며 외부 HTTP endpoint 가용성 probe는 아닙니다.",
              "id": 1,
              "links": [],
              "title": "[PROD] App telemetry status",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red"
                          },
                          {
                            "color": "green",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "none"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "min(up{job=\"node-exporter\", os=\"linux\"}) or vector(0)",
                            "format": "time_series",
                            "instant": true,
                            "legendFormat": "prod linux",
                            "range": false
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 node_exporter scrape 상태입니다. 로컬 macOS exporter나 dev 애플리케이션 상태가 아닙니다.",
              "id": 10,
              "links": [],
              "title": "[PROD ONLY] Linux node exporter up",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red",
                            "value": 0
                          },
                          {
                            "color": "green",
                            "value": 1
                          }
                        ]
                      },
                      "unit": "none"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  }
                },
                "version": "13.0.1"
              }
            }
          },
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{job=\"node-exporter\", os=\"linux\", mode=\"idle\"}[$__rate_interval]))",
                            "legendFormat": "{{instance}}",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "운영 Linux host의 non-idle CPU 비율입니다.",
              "id": 11,
              "links": [],
              "title": "[PROD ONLY] Host CPU busy",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "drawStyle": "line",
                        "fillOpacity": 15,
                        "lineWidth": 2,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "none"
                        }
                      },
                      "max": 1,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": 0
                          },
                          {
                            "color": "yellow",
                            "value": 0.7
                          },
                          {
                            "color": "red",
                            "value": 0.9
                          }
                        ]
                      },
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  }
                },
                "version": ""
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
