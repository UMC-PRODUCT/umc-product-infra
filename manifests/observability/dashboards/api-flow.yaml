# 자동 생성 — observability/ 원본은 직접 수정하고 scripts/gen-configmaps.py를 재실행하세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-api-flow
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: umc-infra
    grafana_dashboard: "1"
data:
  api-flow.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "umc-product-api-flow"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Tempo 로 각 API 요청의 처리 흐름(계층/노드그래프)과 아웃박스 relay span link 를 확인하는 대시보드.",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "API 처리 흐름을 Tempo로 보는 방법",
              "id": 1,
              "links": [],
              "title": "사용 안내",
              "vizConfig": {
                "group": "text",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  },
                  "options": {
                    "content": "## API 처리 흐름 보기 (Tempo + Node graph)\n\n각 API 요청이 거치는 계층(controller -> usecase -> adapter -> db)과, 아웃박스 relay <-> 원 요청 trace의 span link를 Tempo로 확인합니다.\n\n### 사용법\n1. 상단 **TraceQL** 드롭다운에서 프리셋을 고르거나, 직접 쿼리를 입력하면 아래 **Traces** 패널이 갱신됩니다.\n2. trace 한 건을 클릭 -> 상세 상단 **Node graph** 패널을 펼치면 처리 흐름이 그래프로 보입니다.\n3. span 클릭 -> **References**에서 span link로 원 요청/연관 trace로 이동합니다.\n\n### 프리셋 TraceQL\n- 도메인별 흐름: `{ span.app.domain != \"\" }` (기본)\n- 학교 전체 조회(@Public, 테스트 편함): `{ name = \"http get /api/v1/schools/all\" }`\n- 이메일 인증 발송: `{ name = \"http post /api/v1/auth/email-verification\" }`\n- 유스케이스 span만: `{ span.app.usecase != \"\" }`\n- 아웃박스 relay(원 요청과 span link): `{ name = \"outbox.relay.publish\" }`\n\n> HTTP 서버 span 이름은 `http <method> <path>` 형식입니다(예: `http get /api/v1/schools/all`). 계층 흐름 쿼리(`app.domain` / `app.usecase` 등)는 `TraceFlowAspect`가 모든 요청에 자동 생성합니다. `outbox.relay.publish` span은 poller가 처리한 domain event가 있을 때 생성됩니다.\n\n> UMC k3s의 prod/dev/preview는 trace sampling을 1.0으로 고정합니다. 요청이 보이지 않으면 Collector의 refused/enqueue/export 경보와 Tempo 상태를 확인하세요.\n\n자세한 운영 설명은 `umc-infra/argocd/applications/platform/observability/README.md`를 참고하세요.",
                    "mode": "markdown"
                  }
                }
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "tempo"
                          },
                          "group": "tempo",
                          "kind": "DataQuery",
                          "spec": {
                            "filters": [],
                            "limit": 20,
                            "query": "$traceql",
                            "queryType": "traceql",
                            "tableType": "traces"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "상단 TraceQL 변수로 필터된 최근 trace. 행 클릭 -> Node graph 로 흐름 확인. (계층 흐름은 아웃박스 on/off 무관)",
              "id": 2,
              "links": [],
              "title": "Traces",
              "vizConfig": {
                "group": "table",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  },
                  "options": {
                    "showHeader": true
                  }
                }
              }
            }
          }
        },
        "layout": {
          "kind": "RowsLayout",
          "spec": {
            "rows": [
              {
                "kind": "RowsLayoutRow",
                "spec": {
                  "collapse": false,
                  "layout": {
                    "kind": "GridLayout",
                    "spec": {
                      "items": [
                        {
                          "kind": "GridLayoutItem",
                          "spec": {
                            "element": {
                              "kind": "ElementReference",
                              "name": "panel-1"
                            },
                            "height": 10,
                            "width": 24,
                            "x": 0,
                            "y": 0
                          }
                        },
                        {
                          "kind": "GridLayoutItem",
                          "spec": {
                            "element": {
                              "kind": "ElementReference",
                              "name": "panel-2"
                            },
                            "height": 14,
                            "width": 24,
                            "x": 0,
                            "y": 10
                          }
                        }
                      ]
                    }
                  }
                }
              }
            ]
          }
        },
        "links": [
          {
            "asDropdown": false,
            "icon": "external link",
            "includeVars": true,
            "keepTime": true,
            "tags": [],
            "targetBlank": false,
            "title": "System Overview",
            "type": "link",
            "url": "/d/umc-product-system-overview"
          }
        ],
        "liveNow": false,
        "preload": false,
        "tags": [
          "umc-product",
          "tempo",
          "observability",
          "trace-flow"
        ],
        "timeSettings": {
          "autoRefresh": "",
          "autoRefreshIntervals": [
            "5s",
            "10s",
            "30s",
            "1m",
            "5m",
            "15m",
            "30m",
            "1h"
          ],
          "fiscalYearStartMonth": 0,
          "from": "now-3h",
          "hideTimepicker": false,
          "timezone": "Asia/Seoul",
          "to": "now"
        },
        "title": "API 처리 흐름 (Tempo)",
        "variables": [
          {
            "kind": "CustomVariable",
            "spec": {
              "allowCustomValue": true,
              "current": {
                "text": "도메인별 흐름 (전체 계층)",
                "value": "{ span.app.domain != \"\" }"
              },
              "description": "Traces 패널에 적용할 TraceQL. 프리셋 선택 또는 직접 입력.",
              "hide": "dontHide",
              "includeAll": false,
              "label": "TraceQL",
              "multi": false,
              "name": "traceql",
              "options": [
                {
                  "text": "도메인별 흐름 (전체 계층)",
                  "value": "{ span.app.domain != \"\" }"
                },
                {
                  "text": "학교 전체 조회 (GET · @Public 테스트용)",
                  "value": "{ name = \"http get /api/v1/schools/all\" }"
                },
                {
                  "text": "이메일 인증 발송 (POST)",
                  "value": "{ name = \"http post /api/v1/auth/email-verification\" }"
                },
                {
                  "text": "유스케이스 span만",
                  "value": "{ span.app.usecase != \"\" }"
                },
                {
                  "text": "아웃박스 relay (outbox 활성화 시)",
                  "value": "{ name = \"outbox.relay.publish\" }"
                }
              ],
              "query": "도메인별 흐름 (전체 계층) : { span.app.domain != \"\" }, 학교 전체 조회 (GET · @Public 테스트용) : { name = \"http get /api/v1/schools/all\" }, 이메일 인증 발송 (POST) : { name = \"http post /api/v1/auth/email-verification\" }, 유스케이스 span만 : { span.app.usecase != \"\" }, 아웃박스 relay (outbox 활성화 시) : { name = \"outbox.relay.publish\" }",
              "skipUrlSync": false
            }
          }
        ]
      }
    }
