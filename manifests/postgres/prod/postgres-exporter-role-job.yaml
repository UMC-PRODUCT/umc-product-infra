# PostgreSQL exporter 전용 role. 관리자·앱·사람용 readonly 계정을 재사용하지 않는다.
# pg_monitor는 통계/설정 조회만 허용하고 애플리케이션 테이블 SELECT 권한은 주지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-exporter-role
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter-role
    app.kubernetes.io/component: database-bootstrap
    environment: prod
  annotations:
    # Job spec은 불변이다. manifest 변경 시 Argo CD가 삭제 후 다시 생성한다.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter-role
        app.kubernetes.io/component: database-bootstrap
        environment: prod
    spec:
      restartPolicy: Never
      priorityClassName: db-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
          command: ["sh", "-ec"]
          args:
            - |
              database_ready=false
              for i in $(seq 1 40); do
                if pg_isready -q; then
                  database_ready=true
                  break
                fi
                sleep 3
              done
              test "$database_ready" = true

              psql -v ON_ERROR_STOP=1 <<'SQL'
              \getenv exporter_pw EXPORTER_PASSWORD
              SELECT format('CREATE ROLE umc_product_exporter LOGIN PASSWORD %L', :'exporter_pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'umc_product_exporter') \gexec
              SELECT format('ALTER ROLE umc_product_exporter LOGIN PASSWORD %L', :'exporter_pw') \gexec
              ALTER ROLE umc_product_exporter
                NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS
                CONNECTION LIMIT 3;
              ALTER ROLE umc_product_exporter SET statement_timeout = '8s';

              GRANT CONNECT ON DATABASE umc_product TO umc_product_exporter;
              GRANT pg_monitor TO umc_product_exporter;

              DO $role_check$
              BEGIN
                IF EXISTS (
                  SELECT 1
                    FROM pg_auth_members membership
                    JOIN pg_roles granted_role ON granted_role.oid = membership.roleid
                   WHERE membership.member = (
                     SELECT oid FROM pg_roles WHERE rolname = 'umc_product_exporter'
                   )
                     AND granted_role.rolname <> 'pg_monitor'
                ) THEN
                  RAISE EXCEPTION 'umc_product_exporter has an unexpected role membership';
                END IF;
              END
              $role_check$;
              SQL
          env:
            - name: PGHOST
              value: postgres.db.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              value: umc_product
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGOPTIONS
              value: "-c statement_timeout=30s -c lock_timeout=10s"
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter
                  key: POSTGRES_EXPORTER_PASSWORD
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
