# pg-backup을 umc_product_backup으로 바꾸기 전에 같은 pg_dump가 이 role로 성공하는지 확인하는 수동 점검이다.
# create job --from=cronjob/postgres-backup-role-check로만 실행하며 dump는 Pod와 함께 버린다.
# S3 자격증명과 443 송신이 없고 DB 5432만 연결한다. 전환 PR에서 이 CronJob을 삭제한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-role-check
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-backup-role-check
    app.kubernetes.io/component: backup-check
    environment: prod
spec:
  # suspend를 풀더라도 03:00 pg-backup과 ephemeral storage 25Gi를 동시에 잡지 않도록 낮 시간에 둔다.
  schedule: "0 14 * * *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup-role-check
        app.kubernetes.io/component: backup-check
        environment: prod
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup-role-check
            app.kubernetes.io/component: backup-check
            environment: prod
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
              command: ["sh", "-c"]
              # pg_dump 옵션은 backup-cronjob.yaml과 같게 유지한다. 권한이 없으면 pg_dump가 실패하지만,
              # 추가 방어로 table data·sequence 값 항목 수를 catalog와 비교한다. 데이터 내용은 출력하지 않는다.
              args:
                - |
                  set -eu
                  umask 027
                  database_ready=false
                  for i in $(seq 1 40); do
                    if pg_isready -q; then
                      database_ready=true
                      break
                    fi
                    sleep 3
                  done
                  test "$database_ready" = true
                  backup_file=/backup/role-check.dump
                  pg_dump -Fc --lock-wait-timeout=5min -f "$backup_file"
                  test -s "$backup_file"
                  pg_restore --list "$backup_file" >/backup/role-check.toc
                  dumped_tables="$(grep -c '^[0-9]*; [0-9]* [0-9]* TABLE DATA ' /backup/role-check.toc || true)"
                  dumped_sequences="$(grep -c '^[0-9]*; [0-9]* [0-9]* SEQUENCE SET ' /backup/role-check.toc || true)"
                  expected="$(psql -X -At -v ON_ERROR_STOP=1 <<'SQL'
                  SELECT count(*) FILTER (WHERE c.relkind = 'r') || ' ' || count(*) FILTER (WHERE c.relkind = 'S')
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE c.relkind IN ('r', 'S')
                     AND c.relpersistence <> 't'
                     AND n.nspname NOT IN ('pg_catalog', 'information_schema')
                     AND n.nspname NOT LIKE 'pg\_toast%'
                     AND (
                       NOT EXISTS (
                         SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid AND d.deptype = 'e'
                       )
                       OR EXISTS (SELECT 1 FROM pg_extension e WHERE c.oid = ANY (e.extconfig))
                     );
                  SQL
                  )"
                  printf 'role=%s dump_bytes=%s table_data=%s/%s sequence_set=%s/%s\n' \
                    "$PGUSER" "$(wc -c <"$backup_file")" \
                    "$dumped_tables" "${expected% *}" "$dumped_sequences" "${expected#* }"
                  test "$dumped_tables" = "${expected% *}"
                  test "$dumped_sequences" = "${expected#* }"
                  echo 'backup role check passed'
              env:
                - name: PGHOST
                  value: postgres.db.svc.cluster.local
                - name: PGUSER
                  value: umc_product_backup
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres-backup, key: POSTGRES_BACKUP_PASSWORD }
                - name: PGDATABASE
                  value: umc_product
              securityContext:
                runAsUser: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 25Gi }
                limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 26Gi }
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 25Gi
