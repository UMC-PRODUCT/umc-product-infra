# 허용 정책은 default-deny보다 먼저(-2) 적용한다. NetworkPolicy는 additive라
# 같은 ingress/egress 방향의 여러 정책에서 허용한 경로가 합집합으로 열린다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-required-ingress
  namespace: db
  labels:
    app.kubernetes.io/name: postgres
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        # namespaceSelector+podSelector가 같은 항목이므로 운영 앱만 허용(AND)한다.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: umc-product-server
              app.kubernetes.io/instance: umc-product-server
            # 첫 rollout 전 component가 없는 기존 앱도 허용하되 DB Job은 제외한다.
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values: [database-bootstrap, database-cleanup]
        # DB namespace의 명시된 bootstrap·backup Job과 exporter Pod를 허용한다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-app-role
              app.kubernetes.io/component: database-bootstrap
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-readonly-role
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-exporter-role
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-exporter
              app.kubernetes.io/component: metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pg-backup
              app.kubernetes.io/component: backup
      ports:
        - { protocol: TCP, port: 5432 }
---
# DB namespace의 Pod가 CoreDNS에 질의하는 경로다. 외부 서비스로의 일반 송신까지 허용하지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-dns-egress
  namespace: db
  labels:
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# role 생성 Job 세 종류가 같은 namespace의 PostgreSQL 5432에 접속하도록 송신을 허용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-bootstrap-allow-db-egress
  namespace: db
  labels:
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgres-app-role, postgres-readonly-role, postgres-exporter-role]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/component: database
      ports:
        - { protocol: TCP, port: 5432 }
---
# exporter는 PostgreSQL로만 query를 보내며 DNS 허용은 위 공통 정책에서 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-exporter-allow-db-egress
  namespace: db
  labels:
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/component: metrics
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/component: database
      ports:
        - { protocol: TCP, port: 5432 }
---
# monitoring의 Prometheus Pod만 exporter metrics 9187을 수집할 수 있게 두 selector를 함께 적용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-exporter-allow-prometheus-ingress
  namespace: db
  labels:
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/component: metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: prometheus-kube-prometheus-prometheus
      ports:
        - { protocol: TCP, port: 9187 }
---
# backup Pod의 DB 읽기와 S3 업로드에 필요한 송신 경로다. AWS 인증·버킷 권한은 별도 IAM이 제한한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-backup-allow-required-egress
  namespace: db
  labels:
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pg-backup
      app.kubernetes.io/component: backup
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/component: database
      ports:
        - { protocol: TCP, port: 5432 }
    # S3는 표준 NetworkPolicy에서 FQDN으로 제한할 수 없어 public IPv4 HTTPS를 허용한다.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.31.196.0/24
              - 192.52.193.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 192.175.48.0/24
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - { protocol: TCP, port: 443 }
