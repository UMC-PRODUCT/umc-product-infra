# 운영 애플리케이션 전용 PostgreSQL role. 앱에는 관리자 postgres-secrets를 주지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-app-role
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-app-role
    app.kubernetes.io/component: database-bootstrap
    environment: prod
  annotations:
    # Job spec은 불변이다. manifest 변경 시 Argo CD가 안전하게 재생성한다.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-app-role
        app.kubernetes.io/component: database-bootstrap
        environment: prod
    spec:
      restartPolicy: Never
      priorityClassName: db-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
          command: ["sh", "-ec"]
          args:
            - |
              database_ready=false
              for i in $(seq 1 40); do
                if pg_isready -q; then
                  database_ready=true
                  break
                fi
                sleep 3
              done
              test "$database_ready" = true

              psql -v ON_ERROR_STOP=1 --set=app_pw="$APP_PASSWORD" <<'SQL'
              -- UMC의 첫 Flyway migration은 두 extension을 선언한다. 최소권한 앱 role이
              -- superuser 권한 없이 migration을 통과하도록 관리자가 먼저 설치한다.
              CREATE EXTENSION IF NOT EXISTS postgis;
              CREATE EXTENSION IF NOT EXISTS btree_gist;

              SELECT format('CREATE ROLE umc_product_app LOGIN PASSWORD %L', :'app_pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'umc_product_app') \gexec
              SELECT format('ALTER ROLE umc_product_app LOGIN PASSWORD %L', :'app_pw') \gexec
              ALTER ROLE umc_product_app NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

              DO $role_check$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM pg_auth_members
                  WHERE member = (SELECT oid FROM pg_roles WHERE rolname = 'umc_product_app')
                ) THEN
                  RAISE EXCEPTION 'umc_product_app must not inherit another role';
                END IF;
              END
              $role_check$;

              ALTER DATABASE :"DBNAME" OWNER TO umc_product_app;
              ALTER SCHEMA public OWNER TO umc_product_app;
              GRANT CONNECT, TEMPORARY ON DATABASE :"DBNAME" TO umc_product_app;
              SQL
          env:
            - name: PGHOST
              value: postgres.db.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              value: umc_product
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGOPTIONS
              value: "-c statement_timeout=30s -c lock_timeout=10s"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-db, key: DATABASE_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
