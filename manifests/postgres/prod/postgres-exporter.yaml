# RDS/CloudWatch 대신 현재 K3s PostgreSQL의 내부 상태를 Prometheus 형식으로 노출한다.
# DB StatefulSet sidecar가 아니므로 exporter 변경이 PostgreSQL 재시작을 일으키지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: metrics
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  # auth module은 쓰지 않고 password는 별도 Secret file에서 읽는다.
  postgres_exporter.yml: |
    auth_modules: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: metrics
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "4"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: metrics
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: metrics
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: db
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: metrics
    environment: prod
  annotations:
    # role bootstrap Job이 완료된 뒤 시작한다. 별도 Application 간 순서는 Secret Ready로 확인한다.
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/component: metrics
        environment: prod
    spec:
      serviceAccountName: postgres-exporter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          imagePullPolicy: IfNotPresent
          args:
            # custom query/stat_statements collector를 사용하지 않아 SQL 원문을 노출하지 않는다.
            - --config.file=/etc/postgres-exporter/postgres_exporter.yml
            - --log.level=info
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          env:
            - name: DATA_SOURCE_URI
              value: postgres.db.svc.cluster.local:5432/umc_product?sslmode=disable
            - name: DATA_SOURCE_USER
              value: umc_product_exporter
            - name: DATA_SOURCE_PASS_FILE
              value: /var/run/secrets/postgres-exporter/POSTGRES_EXPORTER_PASSWORD
            # Prometheus 기본 scrape timeout(10s)보다 먼저 DB query를 중단한다.
            - name: PG_EXPORTER_COLLECTION_TIMEOUT
              value: 8s
          startupProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            # HTTP endpoint만 확인한다. DB 상태는 Prometheus가 pg_up=0으로 계속 수집해야 한다.
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 30
            timeoutSeconds: 9
            failureThreshold: 3
          livenessProbe:
            # 외부 의존성인 DB 상태를 liveness에 넣지 않는다.
            tcpSocket: { port: metrics }
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # 임시 노드의 CPU request 여유가 작아 상시 exporter 예약량을 최소화한다.
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/postgres-exporter
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/postgres-exporter
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: postgres-exporter-config
            defaultMode: 0444
        - name: credentials
          secret:
            secretName: postgres-exporter
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
