# prod 읽기전용 DB role(umc_product_ro) — 승인된 infra 운영 조회용 (docs/guides/db-access.md)
#
# 왜 Job 인가: 계정을 수동 psql 로 한 번 만들면 대체 노드 준비 후 소프트웨어 재구축 때 잊힌다.
# 이 레포가 내건 원칙이 "클러스터 정의 전체가 Git 하나로 복원"이라 계정도 Git 에 있어야 한다.
# Flyway 는 앱 스키마 전용이므로 롤·권한을 섞지 않는다.
#
# 평범한 Job 이다. PostSync 훅으로도 만들어봤지만 이 클러스터에서 실행되지 않았다 —
# 컨트롤러가 매 sync 계획에는 "PostSync/0 hook batch/Job:db/postgres-readonly-role" 로 넣으면서
# 실행 단계에서 skipHooks:true 로 건너뛴다(변경 0건 sync 에서 훅을 생략하는 동작으로 보인다).
# 검증되지 않는 경로에 계정 생성을 맡기지 않으려고 추적 리소스로 되돌렸다.
#
# Force=true,Replace=true: Job 의 spec 은 immutable 이라 apply 로는 못 고친다.
# Replace 만 주면 kubectl replace 가 되는데, Job 의 spec.selector 는 컨트롤러가 자동 생성하는
# 값이라 우리 매니페스트에 없다 → replace 가 "spec.selector: Required value" 로 거부한다.
# Force 를 함께 줘야 삭제 후 재생성(replace --force)이라 그 문제가 없다.
# 처음 생성될 때는 create 라 드러나지 않고, 매니페스트를 고친 뒤에야 터진다(실측).
# ttlSecondsAfterFinished 는 일부러 안 쓴다 — TTL 이 Job 을 지우면 ArgoCD 가 OutOfSync 로 보고
# 다시 만들어 매 TTL 마다 재실행되는 순환이 생긴다. 완료된 Job 하나는 자원을 먹지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-readonly-role
  labels:
    environment: prod
  namespace: db
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "2" # DB와 app role bootstrap 이후
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-readonly-role
    spec:
      restartPolicy: Never
      priorityClassName: db-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # postgres 이미지의 postgres 유저
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677 # StatefulSet 과 동일 버전
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # NetworkPolicy 가 새 파드를 허용하기까지 몇 초 걸린다 — 그 전에 붙으면 죽는다.
              # k3s 의 netpol 구현(kube-router)은 "허용 대상 파드 IP" 를 ipset 으로 관리하는데,
              # 파드가 뜬 직후에는 아직 그 IP 가 셋에 없다. 그 상태의 패킷은 REJECT 되고
              # psql 은 "Connection refused" 로 즉사한다(실측: 즉시 실패, 30초 뒤 성공).
              # 컨테이너가 짧게 살다 죽는 Job 만 이 창에 걸린다. 앱처럼 오래 사는 파드는 재시도로 넘긴다.
              database_ready=false
              for i in $(seq 1 40); do
                if pg_isready -q; then
                  database_ready=true
                  break
                fi
                echo "postgres 대기 중... ($i/40)"
                sleep 3
              done
              test "$database_ready" = true
              # \gexec — SELECT 가 만들어낸 SQL 문자열을 실행한다. 존재 여부에 따라 CREATE/ALTER 가
              # 하나만 걸리므로 몇 번 돌려도 결과가 같다(비밀번호는 매번 시크릿 값으로 동기화된다).
              psql -v ON_ERROR_STOP=1 --set=ro_pw="$RO_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE umc_product_ro LOGIN PASSWORD %L', :'ro_pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'umc_product_ro') \gexec
              SELECT format('ALTER ROLE umc_product_ro LOGIN PASSWORD %L', :'ro_pw')
                WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'umc_product_ro') \gexec
              ALTER ROLE umc_product_ro NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

              DO $role_check$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM pg_auth_members
                  WHERE member = (SELECT oid FROM pg_roles WHERE rolname = 'umc_product_ro')
                ) THEN
                  RAISE EXCEPTION 'umc_product_ro must not inherit another role';
                END IF;
              END
              $role_check$;

              GRANT CONNECT ON DATABASE :"DBNAME" TO umc_product_ro;  -- DBNAME 은 psql 내장 변수(PGDATABASE)
              GRANT USAGE ON SCHEMA public TO umc_product_ro;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO umc_product_ro;
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO umc_product_ro;
              -- Flyway는 최소권한 umc_product_app으로 실행하므로 그 role의 미래 객체에 적용한다.
              ALTER DEFAULT PRIVILEGES FOR ROLE umc_product_app IN SCHEMA public
                GRANT SELECT ON TABLES TO umc_product_ro;
              ALTER DEFAULT PRIVILEGES FOR ROLE umc_product_app IN SCHEMA public
                GRANT SELECT ON SEQUENCES TO umc_product_ro;

              \echo '--- umc_product_ro 권한 확인'
              SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole
                FROM pg_roles WHERE rolname = 'umc_product_ro';
              SQL
          env:
            - name: PGHOST
              value: postgres.db.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              value: umc_product
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGOPTIONS
              value: "-c statement_timeout=30s -c lock_timeout=10s"
            - name: RO_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-readonly, key: RO_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
