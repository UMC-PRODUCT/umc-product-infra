# monitoring namespace의 kube-state-metrics가 prod DB 워크로드 상태와
# 예약 리소스/PVC 용량을 읽는다. Secret과 Pod log는 읽지 않는다.
# 외부 Helm chart에 db destination을 열지 않기 위해 trusted raw manifest로 분리한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-kube-state-metrics
  namespace: db
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-kube-state-metrics
  namespace: db
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: prometheus-kube-state-metrics
    namespace: monitoring
