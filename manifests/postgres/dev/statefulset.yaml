# dev 전용 PostgreSQL — prod(manifests/postgres/prod/statefulset.yaml)의 축소판.
#
# ⚠️ prod와 반드시 같이 고쳐야 하는 값: PostGIS image digest와 PG 메이저 버전.
#    버전이 어긋나면 dev에서 통과한 마이그레이션이 prod에서 깨진다.
#
# prod와 의도적으로 다른 점: 축소한 자원·튜닝값, dev-low 우선순위, 예약 백업 없음.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    environment: dev
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      priorityClassName: dev-low # prod보다 낮은 보호 우선순위이며 실제 축출 순서를 단독으로 보장하지는 않는다.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677 # ← prod와 동일하게 유지할 것
          args:
            - -c
            - shared_buffers=512MB # limits.memory 2Gi의 25%
            - -c
            - max_connections=30
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          # 빈 데이터 디렉터리의 초기 계정·DB를 만든다. 기존 DB 비밀번호는 Secret 변경만으로 회전되지 않는다.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: umc_product_dev
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # 시작 검사 후 readiness는 Service 연결 대상을, liveness는 컨테이너 재시작 여부를 판단한다.
          startupProbe:
            exec:
              command: ["sh", "-ec", "exec pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-ec", "exec pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-ec", "exec pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # PostgreSQL 18의 기본 PGDATA(/var/lib/postgresql/18/docker)를 포함하는
            # 이미지 VOLUME 경로에 PVC를 마운트한다.
            - name: data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: run
          emptyDir:
            sizeLimit: 64Mi
  # Pod 교체 시 데이터를 보존하는 PVC다. local-path는 노드 밖 복제가 아니며 요청 크기도 강제 quota가 아니다.
  volumeClaimTemplates:
    - metadata:
        name: data
      # environment 라벨을 여기 넣으면 안 된다. spec.volumeClaimTemplates 는 불변 필드라
      # 기존 StatefulSet 갱신이 admission 단계에서 거부된다(서버 dry-run 으로 확인).
      #   Forbidden: updates to statefulset spec for fields other than 'replicas',
      #   'ordinals', 'template', 'updateStrategy', ... are forbidden
      # 그래서 이 PVC 는 다이어그램의 환경 박스 밖에 남는다 — 그림의 한계로 받아들인다.
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
