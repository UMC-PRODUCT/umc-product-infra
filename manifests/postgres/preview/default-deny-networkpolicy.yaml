# allow 정책(-2)이 먼저 준비된 뒤 공유 preview namespace 전체를 격리한다.
# 대상은 공유 DB뿐 아니라 PR 앱·생성·삭제 Job도 포함하며 각 allow 정책의 허용 경로는 유지된다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: preview
  labels:
    environment: preview
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
