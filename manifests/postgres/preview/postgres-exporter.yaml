# DB Pod sidecar로 두지 않는다. postgres image는 loopback 접속을 비밀번호 없이 신뢰하고,
# exporter 변경이 모든 PR이 쓰는 DB를 재시작시킨다.
# preview AppProject가 ConfigMap·ServiceAccount를 막고 quota가 Service 수를 묶으므로
# Deployment만 두고 PodMonitor가 Pod를 직접 수집한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-preview-exporter
  namespace: preview
  labels:
    app.kubernetes.io/name: postgres-preview-exporter
    app.kubernetes.io/component: metrics
    environment: preview
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  # quota는 exporter Pod 1개만 셈한다. surge Pod가 quota에 막히지 않게 교체 중 잠깐 끊기는 쪽을 택한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-preview-exporter
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-preview-exporter
        app.kubernetes.io/component: metrics
        environment: preview
    spec:
      priorityClassName: preview-lowest
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          imagePullPolicy: IfNotPresent
          args:
            # 설정 파일이 없어 v0.20.1은 경고만 남기고 config_last_reload_successful=0을 노출한다. 정상 상태다.
            - --log.level=info
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          env:
            - name: DATA_SOURCE_URI
              value: postgres-preview.preview.svc.cluster.local:5432/preview_bootstrap?sslmode=disable
            - name: DATA_SOURCE_USER
              value: umc_product_preview_exporter
            - name: DATA_SOURCE_PASS_FILE
              value: /var/run/secrets/postgres-exporter/POSTGRES_EXPORTER_PASSWORD
            # Prometheus scrape timeout(10s)보다 먼저 DB query를 중단한다.
            - name: PG_EXPORTER_COLLECTION_TIMEOUT
              value: 8s
          startupProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            # HTTP endpoint만 확인한다. DB 상태는 Prometheus가 pg_up=0으로 계속 수집해야 한다.
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 30
            timeoutSeconds: 9
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: credentials
              mountPath: /var/run/secrets/postgres-exporter
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: postgres-exporter
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
