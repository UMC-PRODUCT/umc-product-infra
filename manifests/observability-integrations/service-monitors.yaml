# App metrics는 OTLP push를 유지한다. kube-prometheus-stack이 소유하지 않는
# 플랫폼 Service만 선택하고 기존 dashboard/alert의 job label을 보존한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: monitoring
  labels:
    release: prometheus
spec:
  jobLabel: app.kubernetes.io/instance
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
    # headless Service는 같은 pod를 가리켜 중복 scrape하므로 제외한다.
    # memberlist Service에는 아래 named port가 없어 target을 만들지 않는다.
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values: ["false"]
  endpoints:
    - port: http-metrics
      interval: 30s
      scrapeTimeout: 10s
---
