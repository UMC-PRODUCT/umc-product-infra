---
# 제어 노드의 Git root manifest를 서버 상태와 비교한다. diff 0=동일, 1=차이만 정상으로 본다.
# 서버 측 필드 관리 충돌은 Git의 root manifest를 기준으로 수렴시킨다.
- name: Compare the root Application with Git
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - diff
      - --server-side=true
      - --force-conflicts
      - --field-manager=umc-ansible-root-app
      - -n
      - "{{ argocd_namespace }}"
      - -f
      - '-'
    stdin: "{{ lookup('ansible.builtin.file', argocd_root_app_manifest_path) }}"
  register: argocd_root_app_diff
  changed_when: false
  failed_when: argocd_root_app_diff.rc not in [0, 1]

# 차이가 있을 때만 root Application을 서버에 적용해 준비된 core·secret-zero 위에서 GitOps를 시작한다.
- name: Reconcile the root Application when it differs
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - apply
      - --server-side=true
      - --force-conflicts
      - --field-manager=umc-ansible-root-app
      - -n
      - "{{ argocd_namespace }}"
      - -f
      - '-'
    stdin: "{{ lookup('ansible.builtin.file', argocd_root_app_manifest_path) }}"
  when: argocd_root_app_diff.rc == 1
  changed_when: true

# hard refresh annotation은 Argo CD가 소비해 제거하는 일회성 신호다.
# 캐시를 갱신해 다시 비교하도록 요청하며, 이 요청 자체가 Synced·Healthy 완료를 뜻하지는 않는다.
- name: Request a hard refresh of the root Application
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - annotate
      - application/root
      - -n
      - "{{ argocd_namespace }}"
      - argocd.argoproj.io/refresh=hard
      - --overwrite
  changed_when: false

# refresh annotation이 사라질 때까지 기다려 요청이 처리되기 전의 상태를 성공으로 오인하지 않는다.
- name: Wait for Argo CD to consume the hard refresh
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - application/root
      - -n
      - "{{ argocd_namespace }}"
      - -o
      - json
  register: argocd_root_app_refresh_state
  changed_when: false
  until:
    - >-
      (argocd_root_app_refresh_state.stdout | from_json)
      .get('metadata', {}).get('annotations', {})
      .get('argocd.argoproj.io/refresh', '') == ''
  retries: "{{ argocd_root_app_refresh_retries }}"
  delay: "{{ argocd_root_app_refresh_delay }}"

# 먼저 root의 Synced를 기다려 Git 선언과 일치하는지 확인한다.
# 실행 중인 리소스의 준비 상태는 다음 Healthy 검사에서 별도로 확인한다.
- name: Wait for the root Application to finish syncing
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - application/root
      - -n
      - "{{ argocd_namespace }}"
      - "--for=jsonpath={.status.sync.status}=Synced"
      - "--timeout={{ argocd_root_app_ready_timeout }}"
  changed_when: false

# root의 Healthy를 기다려 custom health gate가 전달하는 하위 Application·리소스 준비 상태까지 확인한다.
- name: Wait for the root Application and all health-gated children
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - application/root
      - -n
      - "{{ argocd_namespace }}"
      - "--for=jsonpath={.status.health.status}=Healthy"
      - "--timeout={{ argocd_root_app_ready_timeout }}"
  changed_when: false
