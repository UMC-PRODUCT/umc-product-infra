---
# 단일 노드 bootstrap용 Argo CD core 값이다. 외부 앱과 platform controller는
# root Application 이후에도 계속 Argo CD가 관리한다.
global:
  domain: argo.university.neordinary.com
  networkPolicy:
    # chart의 server 기본 정책(ingress: [{}])과 합쳐지면 좁은 허용 정책이 무력화된다.
    # 다른 구성요소의 기존 정책은 아래에서 개별 유지한다.
    create: false
  image:
    tag: v3.5.0

# Helm release 삭제가 Application 등 custom resource 정의의 삭제로 이어지지 않게 보존한다.
crds:
  install: true
  keep: true

configs:
  cm:
    url: https://argo.university.neordinary.com
    # admin은 운영자 전용, 공유 계정은 로그인과 조회만 허용한다.
    # 비밀번호는 runtime Secret에서 별도 관리하며 values에 넣지 않는다.
    admin.enabled: true
    users.anonymous.enabled: false
    accounts.umc-viewer: login
    accounts.umc-viewer.enabled: true
    # root app의 sync wave가 자식 Application, ESO, cert-manager와 Alertmanager 준비 상태를 기다리게 한다.
    # Helm 설치가 root 생성보다 먼저 실행되므로 bootstrap 첫 sync부터 적용된다.

    # 자식 Application이 보고한 health를 부모로 전달한다. 아직 status가 없으면 Progressing을 유지한다.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for Application health status"

      if obj.status ~= nil and obj.status.health ~= nil and obj.status.health.status ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end

      return hs

    # Argo CD 3.5는 Prometheus health를 제공하지만 Alertmanager는 평가하지 않는다.
    resource.customizations.health.monitoring.coreos.com_Alertmanager: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for Alertmanager reconciliation"

      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end

      local conditions = {}
      for _, condition in ipairs(obj.status.conditions) do
        conditions[condition.type] = condition
      end

      for _, conditionType in ipairs({"Reconciled", "Available"}) do
        local condition = conditions[conditionType]
        if condition == nil or obj.metadata == nil or obj.metadata.generation == nil or condition.observedGeneration == nil or condition.observedGeneration ~= obj.metadata.generation then
          hs.message = "Waiting for Alertmanager " .. conditionType .. " status from the current generation"
          return hs
        end

        if condition.status ~= "True" then
          if conditionType == "Reconciled" and condition.status == "False" then
            hs.status = "Degraded"
          elseif conditionType == "Available" and (condition.status == "False" or condition.status == "Degraded") then
            if condition.reason ~= "StatefulSetNotFound" and condition.reason ~= "NoPodReady" and condition.reason ~= "SomePodsNotReady" then
              hs.status = "Degraded"
            end
          end

          hs.message = "Waiting for Alertmanager " .. conditionType
          if condition.message ~= nil and condition.message ~= "" then
            hs.message = condition.message
          elseif condition.reason ~= nil and condition.reason ~= "" then
            hs.message = condition.reason
          end
          return hs
        end
      end

      hs.status = "Healthy"
      hs.message = "Alertmanager is reconciled and available for the current generation"
      return hs

    # SecretStore의 공급자 연결 준비 상태를 Ready 조건으로 판단한다. 비밀값 자체는 읽지 않는다.
    resource.customizations.health.external-secrets.io_SecretStore: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for SecretStore Ready condition"

      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
            elseif condition.status == "False" then
              hs.status = "Degraded"
            else
              hs.status = "Progressing"
            end

            if condition.message ~= nil and condition.message ~= "" then
              hs.message = condition.message
            elseif condition.reason ~= nil and condition.reason ~= "" then
              hs.message = condition.reason
            end
            return hs
          end
        end
      end

      return hs

    # ESO의 동기화 Ready 조건을 전달해 Secret이 준비되지 않은 상태에서 후속 wave가 진행되지 않게 한다.
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for ExternalSecret Ready condition"

      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
            elseif condition.status == "False" then
              hs.status = "Degraded"
            else
              hs.status = "Progressing"
            end

            if condition.message ~= nil and condition.message ~= "" then
              hs.message = condition.message
            elseif condition.reason ~= nil and condition.reason ~= "" then
              hs.message = condition.reason
            end
            return hs
          end
        end
      end

      return hs

    # 이전 인증서 상태를 새 발급 성공으로 오인하지 않도록 observedGeneration까지 일치해야 Healthy다.
    resource.customizations.health.cert-manager.io_Certificate: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for Certificate Ready condition"

      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if obj.metadata == nil or obj.metadata.generation == nil or condition.observedGeneration == nil or condition.observedGeneration ~= obj.metadata.generation then
              hs.status = "Progressing"
              hs.message = "Waiting for Certificate status from the current generation"
              return hs
            end

            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "Certificate is Ready for the current generation"
            elseif condition.status == "False" then
              if condition.reason == "DoesNotExist" or condition.reason == "Pending" or condition.reason == "Issuing" then
                hs.status = "Progressing"
              else
                hs.status = "Degraded"
              end
            else
              hs.status = "Progressing"
            end

            if condition.message ~= nil and condition.message ~= "" then
              hs.message = condition.message
            elseif condition.reason ~= nil and condition.reason ~= "" then
              hs.message = condition.reason
            end
            return hs
          end
        end
      end

      return hs

    # ACME Issuer의 Ready를 전달한다. 개별 인증서 발급 완료는 위 Certificate 판정이 따로 확인한다.
    resource.customizations.health.cert-manager.io_ClusterIssuer: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for ClusterIssuer Ready condition"

      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
            elseif condition.status == "False" then
              hs.status = "Degraded"
            else
              hs.status = "Progressing"
            end

            if condition.message ~= nil and condition.message ~= "" then
              hs.message = condition.message
            elseif condition.reason ~= nil and condition.reason ~= "" then
              hs.message = condition.reason
            end
            return hs
          end
        end
      end

      return hs

  rbac:
    # 모든 로그인 사용자에게 기본 권한을 주지 않고 아래 명시된 역할만 연결한다.
    policy.default: ""
    policy.csv: |
      g, umc-viewer, role:readonly
  params:
    # 외부 TLS는 Traefik이 종료한다. 내부 HTTP는 argocd-access의 NetworkPolicy로 제한한다.
    server.insecure: true

# Git desired state와 클러스터를 비교·동기화하는 controller의 자원을 단일 노드에 맞춘다.
controller:
  networkPolicy:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# PR 등 generator 입력을 바탕으로 Application을 생성하는 별도 controller다.
applicationSet:
  networkPolicy:
    create: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# chart가 제공하는 인증 연동 구성요소의 자원 상한이다. 이 값만으로 외부 SSO가 구성되지는 않는다.
dex:
  networkPolicy:
    create: true
  initImage:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

notifications:
  # 현재 알림 구독이 없다. 기본 ClusterRole의 전 namespace Secret 조회도 막는다.
  enabled: false

redis:
  networkPolicy:
    create: true
  # 비밀번호 생성은 별도 hook Job이 하므로 Redis Pod는 Kubernetes API가 필요 없다.
  automountServiceAccountToken: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Redis 인증 Secret 생성 hook도 단일 노드의 작은 자원 예산 안에서 실행한다.
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# 저장소 checkout·manifest 렌더 담당이며 Pod에 Kubernetes API 토큰을 자동 주입하지 않는다.
repoServer:
  networkPolicy:
    create: true
  automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# UI/API는 ClusterIP로 제공하고 공개 HTTPS 경계는 별도 argocd-access Application이 관리한다.
server:
  service:
    type: ClusterIP
  ingress:
    # Certificate → Ingress 순서는 별도 argocd-access Application이 관리한다.
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
