---
# 서버 계정·설정을 바꾸기 전에 대상 공인 IP, 사용자 목록과 명시적인 적용 확인값을 검사한다.
- name: Validate the explicit SSH access inventory before mutation
  ansible.builtin.assert:
    that:
      - ssh_access_confirm | default(false) | bool
      - ssh_access_finalize is boolean
      - ssh_access_users is sequence and ssh_access_users is not string
      - ssh_access_users | length > 0
      - ssh_access_users | map(attribute='name') | unique | length == ssh_access_users | length
      - ssh_access_public_host is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
      - ansible_user is defined
    fail_msg: Supply reviewed personal accounts, public IPv4 and ssh_access_confirm=true.

# 사용자별 이름·역할·생성/삭제 상태를 검사하고, 현재 접속한 관리자를 삭제 대상으로 삼지 못하게 한다.
- name: Validate individual account names and explicit lifecycle
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_]{1,30}$')
      - item.name not in ['root', 'nobody', 'daemon', 'www_data']
      - item.state in ['present', 'absent']
      - item.role in ['admin', 'db_tunnel']
      - item.state != 'absent' or item.name != ansible_user
    fail_msg: Use a unique non-system username and explicit role/state; never remove the connected operator.
  loop: "{{ ssh_access_users }}"
  loop_control:
    label: "{{ item.name }}"

# 유지할 계정만 추려 이후 계정·키·SSH 정책에 사용하고, 이번 실행의 공인 접속 검증 상태를 초기화한다.
- name: Collect the declared active accounts
  ansible.builtin.set_fact:
    ssh_access_present: "{{ ssh_access_users | selectattr('state', 'equalto', 'present') | list }}"
    ssh_access_public_verified: false

# 적용 후 서버를 관리할 사람이 남도록 유지할 개인 관리자 계정을 최소 한 명 요구한다.
- name: Require at least one retained personal administrator
  ansible.builtin.assert:
    that:
      - ssh_access_present | selectattr('role', 'equalto', 'admin') | list | length > 0

# 공개키 형식을 검사하고, DB 터널 목적지를 명시한 10.43.x.x:5432로 한정해 과도한 접근을 막는다.
- name: Require public keys and narrowly scoped tunnel destinations
  ansible.builtin.assert:
    that:
      - item.public_keys is sequence and item.public_keys is not string
      - item.public_keys | length > 0
      - >-
        item.public_keys | select('match', '^(ssh-ed25519|sk-ssh-ed25519@openssh.com) [A-Za-z0-9+/]+={0,3}( [^\r\n]+)?$')
        | list | length == item.public_keys | length
      - "'CHANGE_ME' not in (item.public_keys | join(' '))"
      - item.role != 'db_tunnel' or (item.permit_open | default([]) | length > 0)
      - >-
        item.role != 'db_tunnel' or
        (item.permit_open | select('match', '^10\.43\.[0-9]{1,3}\.[0-9]{1,3}:5432$')
        | list | length == item.permit_open | length)
    fail_msg: Provide real Ed25519 public keys; DB accounts require exact 10.43.x.x:5432 destinations, never wildcards.
  loop: "{{ ssh_access_present }}"
  loop_control:
    label: "{{ item.name }}"

# sudo가 환경 변수를 바꿀 수 있으므로 권한을 올리지 않고 접속 사용자의 SSH_CONNECTION을 읽는다.
- name: Read the actual SSH connection without privilege escalation
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: ssh_access_connection
  changed_when: false
  check_mode: false

# root 로그인을 막기 전에 유지할 개인 관리자 계정으로 서버의 공인 IP:22에 접속했는지 확인한다.
- name: Require actual public-key administrator access before finalization
  ansible.builtin.assert:
    that:
      - ssh_access_connection.stdout.split() | length == 4
      - ssh_access_connection.stdout.split()[2] == ssh_access_public_host
      - ssh_access_connection.stdout.split()[3] == '22'
      - ansible_host == ssh_access_public_host
      - ansible_user != 'root'
      - ansible_user in (ssh_access_present | selectattr('role', 'equalto', 'admin') | map(attribute='name') | list)
    fail_msg: Finalize only through public IPv4 as a retained personal admin; keep the old connection until this succeeds.
  when: ssh_access_finalize

# 전환을 마무리할 관리자가 비밀번호 입력 없이 sudo를 사용할 수 있는지 변경 전에 확인한다.
- name: Verify noninteractive sudo for the current finalization operator
  ansible.builtin.command: sudo -n true
  become: false
  changed_when: false
  check_mode: false
  when: ssh_access_finalize

# 뒤의 방화벽 작업이 공인 관리자 접속 검증 완료 여부를 확인할 수 있도록 결과를 기록한다.
- name: Mark the public administrator path verified
  ansible.builtin.set_fact:
    ssh_access_public_verified: true
  when: ssh_access_finalize

# 같은 이름의 기존 계정이 시스템 계정인지 판단하기 위해 서버의 계정·UID 정보를 조회한다.
- name: Inspect existing account IDs before managing any account
  ansible.builtin.getent:
    database: passwd

# UID가 1000 미만인 기존 계정은 변경·삭제를 거부해 운영체제 계정을 보호한다.
- name: Refuse to adopt or delete system accounts
  ansible.builtin.assert:
    that:
      - item.name not in ansible_facts.getent_passwd or ansible_facts.getent_passwd[item.name][1] | int >= 1000
    fail_msg: SSH access management cannot mutate system accounts.
  loop: "{{ ssh_access_users }}"
  loop_control:
    label: "{{ item.name }}"

# 이후 SSH 설정, 관리자 권한과 방화벽 적용에 필요한 패키지가 설치되어 있도록 한다.
- name: Ensure SSH and sudo are installed
  ansible.builtin.apt:
    name: [openssh-server, sudo, ufw]
    state: present

# 관리자와 DB 터널 계정의 권한을 구분할 Linux 그룹을 준비한다.
- name: Create personal access groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: [umc-ssh-admins, umc-db-tunnel]

# 계정을 만들고 비밀번호를 잠그며, 보조 그룹을 지정 역할로 맞춰 기존 다른 보조 그룹에서 제외한다.
- name: Create personal accounts without password login
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    create_home: true
    shell: /bin/bash
    password_lock: true
    groups: "{{ 'umc-ssh-admins' if item.role == 'admin' else 'umc-db-tunnel' }}"
    append: false
  loop: "{{ ssh_access_present }}"
  loop_control:
    label: "{{ item.name }}"

# 일반 사용자가 승인 키를 직접 바꾸지 못하도록 홈 밖에 root 소유의 공개키 보관 디렉터리를 만든다.
- name: Keep authorized public keys outside user-writable homes
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys
    state: directory
    owner: root
    group: root
    mode: '0755'

# 계정별 키 파일 전체를 public_keys 목록으로 교체한다. 유지할 승인 키는 목록에 모두 남겨야 한다.
- name: Reconcile the entire declared public-key set for each account
  ansible.builtin.copy:
    content: "{{ item.public_keys | join('\n') }}\n"
    dest: "/etc/ssh/authorized_keys/{{ item.name }}"
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/ssh-keygen -l -f %s
  loop: "{{ ssh_access_present }}"
  loop_control:
    label: "{{ item.name }}"

# 승인된 인프라 관리자만 root 권한을 갖는다. DB 터널 그룹은 sudoers에 들어가지 않는다.
- name: Grant sudo only to the personal administrator group
  ansible.builtin.copy:
    content: "%umc-ssh-admins ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/umc-ssh-admins
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

# 관리할 SSH 정책 파일을 둘 설정 디렉터리를 준비한다.
- name: Ensure the SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# inventory로 SSH 정책을 생성한다. AllowUsers도 전체 목록으로 교체되어 빠진 계정의 새 접속이 막힌다.
# 기존 설정은 백업하지만 실패 시 자동 복구하지 않으며, 변경이 있으면 검증 뒤 reload하도록 예약한다.
- name: Install key-only authentication and per-user forwarding restrictions
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/00-umc-hardening.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  register: ssh_access_config
  notify: Reload personal SSH policy

# 다른 설정 파일까지 합친 SSH 문법을 검사해 잘못된 구성을 서비스가 다시 읽지 않도록 한다.
- name: Validate the complete SSH configuration including other drop-ins
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

# 사용자별로 실제 적용될 인증·터널 정책을 출력해 다른 설정과의 우선순위 충돌을 확인할 자료를 얻는다.
- name: Read effective authentication and per-user policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -C
      - "user={{ item.name }},host=client,addr={{ ssh_access_connection.stdout.split()[0] }}"
  loop: "{{ ssh_access_present }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_access_effective
  changed_when: false

# 유효 정책이 공개키 인증·전환 단계별 root 로그인 정책·DB 터널 제한을 충족하지 않으면 reload 전에 중단한다.
- name: Reject shadowed authentication or tunnel policy before reload
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in item.stdout_lines"
      - "'kbdinteractiveauthentication no' in item.stdout_lines"
      - "'authenticationmethods publickey' in item.stdout_lines"
      - "'authorizedkeysfile /etc/ssh/authorized_keys/%u' in item.stdout_lines"
      - "not ssh_access_finalize or 'permitrootlogin no' in item.stdout_lines"
      - "item.item.role != 'db_tunnel' or 'maxsessions 0' in item.stdout_lines"
      - "item.item.role != 'db_tunnel' or 'allowtcpforwarding local' in item.stdout_lines"
      - "item.item.role != 'db_tunnel' or ('permitopen ' ~ (item.item.permit_open | join(' '))) in item.stdout_lines"
    fail_msg: An existing SSH setting overrides the intended authentication or tunnel policy; do not finalize.
  loop: "{{ ssh_access_effective.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

# 예약된 SSH reload를 지금 실행해 퇴임 계정의 새 접속을 먼저 막은 뒤 계정 회수로 넘어간다.
- name: Apply the verified SSH policy before revoking old accounts
  ansible.builtin.meta: flush_handlers

# absent로 명시한 계정의 키·기존 세션·계정을 회수한다. 목록에서 항목만 빼면 이 절차는 실행되지 않는다.
- name: Revoke explicitly retired SSH accounts
  ansible.builtin.include_tasks: revoke.yml
  loop: "{{ ssh_access_users | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: ssh_access_retired
    label: "{{ ssh_access_retired.name }}"

# cloud-init 설정 디렉터리가 있을 때만 인증 설정을 추가하도록 디렉터리 존재 여부를 확인한다.
- name: Inspect the cloud-init configuration directory
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: ssh_access_cloud_config

# cloud-init이 이후 실행되어도 SSH 비밀번호 인증을 다시 켜지 않도록 설정한다.
- name: Prevent cloud-init from restoring password authentication
  ansible.builtin.copy:
    content: "ssh_pwauth: false\n"
    dest: /etc/cloud/cloud.cfg.d/99-disable-pwauth.cfg
    owner: root
    group: root
    mode: '0644'
  when: ssh_access_cloud_config.stat.isdir | default(false)
