---

# 커널 설정 파일이 변경되어 notify된 경우 저장된 sysctl 설정을 현재 커널에 반영한다.
# sysctl --system은 이 역할의 파일뿐 아니라 시스템의 다른 sysctl 설정 파일도 읽는다.
- name: Apply Kubernetes kernel parameters
  ansible.builtin.command: sysctl --system
  changed_when: true

# journald 크기 설정은 재시작해야 반영된다. 실행 중인 서비스의 stdout 연결은 journald가 보존한다.
- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
