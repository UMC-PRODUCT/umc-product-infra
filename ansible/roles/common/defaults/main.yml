---

# 호스트 로그 시각을 운영 기준인 한국 시간으로 맞춘다.
common_timezone: Asia/Seoul

# HTTPS 설치 파일 검증·전송과 호스트 방화벽에 필요한 최소 패키지다.
common_packages:
  - ca-certificates
  - curl
  # kubernetes.core.helm이 대상 서버에서 values를 처리할 때 사용한다.
  - python3-yaml
  - ufw

# 공인 SSH는 연결 빈도를 제한하고 HTTPS는 Traefik이 직접 수신한다.
common_public_tcp_ports:
  - 22
  - 443

# access-only playbook은 k3s role을 로드하지 않아 공유 network 기본값도 필요하다.
# 실제 inventory가 선언한 CIDR은 이 role default보다 우선한다.
k3s_cluster_cidr: 10.42.0.0/16  # noqa: var-naming[no-role-prefix]
k3s_service_cidr: 10.43.0.0/16  # noqa: var-naming[no-role-prefix]
