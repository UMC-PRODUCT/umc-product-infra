---

# 아래 패키지·커널 설정은 x86_64 Ubuntu 22/24를 전제로 하므로 다른 OS에서는 중단한다.
- name: Require the supported Ubuntu host family
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_major_version in ['22', '24']
      - ansible_facts.architecture in ['x86_64', 'amd64']
    fail_msg: This bootstrap supports only x86_64 Ubuntu 22.04 or 24.04 hosts.

# 패키지 설치 전에 needrestart와 자동 보안 업데이트 범위를 정한다.
- name: Configure security-only automatic updates
  ansible.builtin.import_tasks: automatic_updates.yml

# HTTPS 다운로드·Helm values 처리·방화벽 관리에 필요한 패키지를 서버에 설치한다.
# 자동 업데이트가 dpkg lock을 잡고 있으면 끝날 때까지 기다린다.
- name: Install host prerequisites
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

# 서버의 시간대 파일을 지정한 지역으로 연결해 운영 로그의 시간 해석을 일관되게 한다.
- name: Link the host timezone data
  ansible.builtin.file:
    path: /etc/localtime
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    state: link
    force: true
    owner: root
    group: root

# /etc/timezone에도 같은 시간대 이름을 저장해 이 파일을 읽는 도구와 설정을 맞춘다.
- name: Persist the host timezone name
  ansible.builtin.copy:
    content: "{{ common_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: '0644'

# journald drop-in 디렉터리를 준비한다. 기본 journald.conf는 수정하지 않는다.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# 호스트 journal 전체를 1G로 제한한다. 컨테이너 로그 회전은 K3s kubelet 설정이 따로 맡는다.
- name: Limit the persistent systemd journal size
  ansible.builtin.copy:
    src: journald-size.conf
    dest: /etc/systemd/journald.conf.d/50-umc-size.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart systemd-journald

# 현재 켜진 스왑을 조회한다. 이 구성은 스왑 없이 K3s를 운영하므로 켜져 있을 때만 해제한다.
- name: Inspect active swap devices
  ansible.builtin.command: swapon --show --noheadings
  register: common_active_swap
  changed_when: false

# 사용 중인 스왑을 즉시 끈다. 재부팅 후 다시 켜지지 않게 하는 작업은 다음 단계에서 수행한다.
- name: Disable active swap
  ansible.builtin.command: swapoff --all
  when: common_active_swap.stdout | trim | length > 0
  changed_when: true

# /etc/fstab의 스왑 항목을 주석 처리해 부팅 시 자동 활성화를 막는다.
# 스왑 파일·파티션 자체를 삭제하는 작업은 아니다.
- name: Disable swap entries at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n]+\s+[^#\n]+\s+swap\s+.*)$'
    replace: '# \1'

# 컨테이너 파일시스템·브리지 네트워크에 필요한 모듈 목록을 저장해 재부팅 후에도 불러오게 한다.
- name: Load Kubernetes kernel modules at boot
  ansible.builtin.template:
    src: k3s-modules.conf.j2
    dest: /etc/modules-load.d/k3s.conf
    owner: root
    group: root
    mode: '0644'

# 재부팅을 기다리지 않고 현재 커널에도 overlay·br_netfilter 모듈을 불러온다.
- name: Load Kubernetes kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

# Pod 통신에 필요한 IP 전달·브리지 필터 설정을 파일로 저장한다.
# 파일이 바뀌면 아래 handler를 예약하고, 다음 단계에서 실행해 현재 커널에도 반영한다.
- name: Configure Kubernetes kernel parameters
  ansible.builtin.template:
    src: k3s-sysctl.conf.j2
    dest: /etc/sysctl.d/90-k3s.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply Kubernetes kernel parameters

# 예약된 커널 설정 handler를 지금 실행해 K3s가 변경 전 네트워크 설정으로 시작하지 않게 한다.
- name: Apply host kernel parameters before K3s installation
  ansible.builtin.meta: flush_handlers

# SSH 계정·키 준비 뒤 방화벽 작업 목록을 불러온다. 구체적인 규칙 적용은 firewall.yml에 있다.
# ssh-access.yml에서도 같은 파일만 재사용해 OS 전체 설정 없이 방화벽을 맞춘다.
- name: Reconcile the declared host firewall
  ansible.builtin.import_tasks: firewall.yml
