---

- name: Require the supported Ubuntu host family
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_major_version in ['22', '24']
      - ansible_facts.architecture in ['x86_64', 'amd64']
    fail_msg: This bootstrap supports only x86_64 Ubuntu 22.04 or 24.04 hosts.

# DNS-01은 80/tcp가 필요하지 않다. 공인 SSH와 HTTPS만 인터넷에 연다.
- name: Require the public SSH and HTTPS contract before host mutation
  ansible.builtin.assert:
    that:
      - common_public_tcp_ports == [22, 443]
    fail_msg: >-
      Only key-authenticated SSH on 22/tcp and direct HTTPS on 443/tcp are
      allowed; 80, 5432, 6443, and every other public port must remain closed.
  delegate_to: localhost
  become: false
  tags:
    - preflight

- name: Install host prerequisites
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Link the host timezone data
  ansible.builtin.file:
    path: /etc/localtime
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    state: link
    force: true
    owner: root
    group: root

- name: Persist the host timezone name
  ansible.builtin.copy:
    content: "{{ common_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: '0644'

# 스왑은 현재 세션뿐 아니라 `/etc/fstab`에서도 영구 비활성화한다.
- name: Inspect active swap devices
  ansible.builtin.command: swapon --show --noheadings
  register: common_active_swap
  changed_when: false

- name: Disable active swap
  ansible.builtin.command: swapoff --all
  when: common_active_swap.stdout | trim | length > 0
  changed_when: true

- name: Disable swap entries at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n]+\s+[^#\n]+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load Kubernetes kernel modules at boot
  ansible.builtin.template:
    src: k3s-modules.conf.j2
    dest: /etc/modules-load.d/k3s.conf
    owner: root
    group: root
    mode: '0644'

- name: Load Kubernetes kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure Kubernetes kernel parameters
  ansible.builtin.template:
    src: k3s-sysctl.conf.j2
    dest: /etc/sysctl.d/90-k3s.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply Kubernetes kernel parameters

- name: Apply host kernel parameters before K3s installation
  ansible.builtin.meta: flush_handlers

# 계정과 sshd 보안 설정은 ssh_access 역할이 먼저 준비한다.
# access-only playbook에서도 동일한 방화벽 계약을 재사용한다.
- name: Reconcile the declared host firewall
  ansible.builtin.import_tasks: firewall.yml
