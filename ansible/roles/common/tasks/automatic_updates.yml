---

# needrestart가 설치된 서버에서만 설정 디렉터리를 찾는다. 없으면 자동 재시작 위험도 없다.
- name: Inspect the needrestart configuration directory
  ansible.builtin.stat:
    path: /etc/needrestart/conf.d
  register: common_needrestart_config

# 아래 패키지 설치와 이후 자동 업데이트가 서비스를 재시작하지 않고 목록만 남기게 한다.
# 패키지 설치보다 먼저 두어 이번 실행의 apt 작업에도 적용한다.
- name: Keep needrestart in list-only mode
  ansible.builtin.copy:
    src: needrestart-list-only.conf
    dest: /etc/needrestart/conf.d/99-umc-list-only.conf
    owner: root
    group: root
    mode: '0644'
  when: common_needrestart_config.stat.isdir | default(false)

# 보안 업데이트만 자동 설치한다. K3s·Helm은 apt가 아닌 고정 binary라 대상이 아니다.
- name: Allow only security origins for unattended upgrades
  ansible.builtin.copy:
    src: unattended-upgrades.conf
    dest: /etc/apt/apt.conf.d/52umc-unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/apt-config -c %s dump

# 패키지 목록 갱신과 자동 설치를 실행하는 apt timer를 켠다.
- name: Enable the apt update and upgrade timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# 다른 apt 설정 파일까지 합친 유효 설정을 읽는다.
- name: Read the effective unattended-upgrades configuration
  ansible.builtin.command: apt-config dump
  register: common_apt_config
  changed_when: false
  check_mode: false

# 다른 파일이 보안 외 origin·자동 재부팅·메일을 다시 켜면 중단한다.
- name: Require security-only unattended upgrades without reboot or mail
  ansible.builtin.assert:
    that:
      - "'APT::Periodic::Unattended-Upgrade \"1\";' in common_apt_config.stdout_lines"
      - "'Unattended-Upgrade::Automatic-Reboot \"false\";' in common_apt_config.stdout_lines"
      - "'Unattended-Upgrade::Mail \"\";' in common_apt_config.stdout_lines"
      - common_unattended_origins | length > 0
      - common_unattended_origins | reject('search', '-security";$') | list | length == 0
    fail_msg: Another apt configuration file widens unattended upgrades beyond security origins or enables reboot or mail.
  vars:
    common_unattended_origins: >-
      {{ common_apt_config.stdout_lines
         | select('match', '^Unattended-Upgrade::(Allowed-Origins|Origins-Pattern):: ')
         | list }}
  when: not ansible_check_mode
