---

# Tailscale 패키지와 저장소 서명 키를 함께 고정한다.
tailscale_version: '1.102.3'
tailscale_apt_key_url: >-
  https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg
tailscale_apt_key_checksum: >-
  sha256:3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
tailscale_apt_keyring_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_apt_source_path: /etc/apt/sources.list.d/tailscale.list
tailscale_apt_preferences_path: /etc/apt/preferences.d/tailscale

tailscale_hostname: "{{ inventory_hostname }}"
tailscale_required_tag: tag:umc-idc
tailscale_interface: tailscale0
tailscale_up_timeout_seconds: 120

# 최초 등록 playbook만 true로 덮어쓴다. 일반 bootstrap은 암묵적으로 재등록하지 않는다.
tailscale_enrollment_enabled: false
