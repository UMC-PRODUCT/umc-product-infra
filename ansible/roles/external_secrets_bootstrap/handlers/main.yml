---
# Secret 변경을 적용한 시점의 ESO 상태를 다시 확인해 동시 생성 race를 피한다.
# 최초 설치처럼 Deployment가 아직 없으면 새 Pod가 처음부터 Secret을 읽으므로 재시작하지 않는다.
# 같은 listen의 핸들러는 재시작 후 rollout 확인 순서로 실행된다.
- name: Check whether the External Secrets controller now exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
      - --ignore-not-found
      - -o
      - name
  register: external_secrets_bootstrap_controller
  changed_when: false
  listen: Restart External Secrets after AWS credential rotation

- name: Restart the External Secrets controller
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - rollout
      - restart
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
  when: external_secrets_bootstrap_controller.stdout | trim | length > 0
  changed_when: true
  listen: Restart External Secrets after AWS credential rotation

- name: Wait for the restarted External Secrets controller
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - rollout
      - status
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
      - --timeout=300s
  when: external_secrets_bootstrap_controller.stdout | trim | length > 0
  changed_when: false
  listen: Restart External Secrets after AWS credential rotation
