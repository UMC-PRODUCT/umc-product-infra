---
# Secret 변경 알림을 처리하는 시점에 ESO Deployment의 존재 여부를 다시 확인한다.
# 최초 설치로 아직 없으면 새 Pod가 처음부터 Secret을 읽으므로 재시작을 건너뛴다.
- name: Check whether the External Secrets controller now exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
      - --ignore-not-found
      - -o
      - name
  register: external_secrets_bootstrap_controller
  changed_when: false
  listen: Restart External Secrets after AWS credential rotation

# ESO가 이미 있으면 새 AWS 자격증명을 읽도록 controller Pod의 재시작을 요청한다.
# 같은 listen의 handler는 파일에 선언한 순서로 실행하므로 존재 확인 뒤에 수행된다.
- name: Restart the External Secrets controller
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - rollout
      - restart
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
  when: external_secrets_bootstrap_controller.stdout | trim | length > 0
  changed_when: true
  listen: Restart External Secrets after AWS credential rotation

# 재시작한 ESO의 rollout 완료를 기다린다. 이 검사만으로 AWS 인증이나 Secret 동기화 성공까지 보장하지 않는다.
- name: Wait for the restarted External Secrets controller
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - rollout
      - status
      - deployment/external-secrets
      - -n
      - "{{ external_secrets_bootstrap_namespace }}"
      - --timeout=300s
  when: external_secrets_bootstrap_controller.stdout | trim | length > 0
  changed_when: false
  listen: Restart External Secrets after AWS credential rotation
