[defaults]
# 운영 inventory는 예제에서 따로 작성하며 Git에 넣지 않는다.
inventory = inventories/idc-new/hosts.yml
roles_path = roles
# 첫 실행 전에 서버 키를 직접 확인해 known_hosts에 등록하며, 이후 키 변경도 실패로 처리한다.
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True

[ssh_connection]
# 모듈 전송에 필요한 SSH 왕복을 줄인다. 계정·sudo 권한 검증을 대신하지는 않는다.
pipelining = True
