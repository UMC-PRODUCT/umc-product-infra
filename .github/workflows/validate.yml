name: Validate infrastructure

on:
  pull_request: {}
  push:
    branches: [main]

# 검증만 수행하므로 저장소 읽기 권한만 부여한다.
permissions:
  contents: read

# 같은 PR·브랜치의 이전 검증은 취소하고 최신 커밋을 기준으로 결과를 낸다.
concurrency:
  group: infra-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 깨끗한 체크아웃을 사용해 로컬의 미추적 파일이 검증 누락을 가리지 않게 한다.
      # chart version guard가 origin/<base>와의 merge base를 계산하도록 전체 이력과 원격 branch를 받는다.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Python 버전과 의존성 파일을 기준으로 검증 환경·캐시를 맞춘다.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ansible/requirements.txt
            scripts/requirements-lint.txt

      # 차트를 렌더하는 Helm 버전을 로컬 검증 계약과 동일하게 고정한다.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # 외부 검증 도구는 고정 버전의 압축 파일과 checksum을 대조한 뒤 사용한다.
      - name: Install pinned native validators
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/umc-infra-tools"
          mkdir -p "$tools_dir"

          # 일반 release URL이 실패하면 같은 파일을 API 경로로 받고 아래 checksum 검증은 유지한다.
          download_release_asset() {
            local url="$1" api_url="$2" destination="$3"
            if ! curl -fsSL --retry 3 "$url" -o "$destination"; then
              echo "Release download failed; retrying via API: $api_url" >&2
              curl -fsSL --retry 3 -H 'Accept: application/octet-stream' \
                "$api_url" -o "$destination"
            fi
          }

          kubeconform_archive="$RUNNER_TEMP/kubeconform-v0.7.0.tar.gz"
          download_release_asset \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            https://api.github.com/repos/yannh/kubeconform/releases/assets/253886788 \
            "$kubeconform_archive"
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $kubeconform_archive" \
            | sha256sum -c -
          tar -xzf "$kubeconform_archive" -C "$tools_dir" kubeconform

          actionlint_archive="$RUNNER_TEMP/actionlint-v1.7.12.tar.gz"
          download_release_asset \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            https://api.github.com/repos/rhysd/actionlint/releases/assets/384924896 \
            "$actionlint_archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_archive" \
            | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$tools_dir" actionlint

          promtool_archive="$RUNNER_TEMP/prometheus-3.11.3.linux-amd64.tar.gz"
          download_release_asset \
            https://github.com/prometheus/prometheus/releases/download/v3.11.3/prometheus-3.11.3.linux-amd64.tar.gz \
            https://api.github.com/repos/prometheus/prometheus/releases/assets/406685857 \
            "$promtool_archive"
          echo "9479af67673316278958cda1f39b88a09f8921084e039c65acca060d0447bb38  $promtool_archive" \
            | sha256sum -c -
          tar -xzf "$promtool_archive" -C "$RUNNER_TEMP" \
            prometheus-3.11.3.linux-amd64/promtool
          cp "$RUNNER_TEMP/prometheus-3.11.3.linux-amd64/promtool" "$tools_dir/promtool"

          echo "$tools_dir" >>"$GITHUB_PATH"

      # Ansible·YAML 검사 의존성과 CloudFormation 검사기를 설치한다.
      - name: Install Python validators
        run: >-
          python -m pip install --disable-pip-version-check
          -r ansible/requirements.txt
          cfn-lint==1.55.1

      # scripts/ 정적 검사 도구는 전이 의존성까지 hash로 고정한 목록으로 설치한다.
      # Ansible·ansible-lint와 공유하는 의존성(mypy-extensions 등) 버전을 바꾸지 않도록 별도 가상환경에 둔다.
      - name: Install Python linters
        shell: bash
        run: |
          set -euo pipefail
          lint_venv="$RUNNER_TEMP/umc-infra-lint"
          python -m venv "$lint_venv"
          "$lint_venv/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary :all: \
            -r scripts/requirements-lint.txt
          echo "VALIDATE_LINT_PYTHON=$lint_venv/bin/python" >>"$GITHUB_ENV"

      # playbook이 사용하는 외부 모듈도 저장소의 고정 목록으로 준비한다.
      - name: Install pinned Ansible collections
        run: >-
          ansible-galaxy collection install
          -r ansible/collections/requirements.yml

      # 실제 서버 적용 없이 생성물·Helm 렌더·구성 간 계약과 테스트를 실행한다.
      # 위에서 모든 선택 도구(ubuntu runner 기본 docker 포함)를 준비했으므로 skip이 있으면 실패시킨다.
      - name: Validate repository contracts
        env:
          VALIDATION_OUTPUT_DIR: ${{ runner.temp }}/umc-infra-rendered
          VALIDATE_STRICT: "1"
          # main push는 merge base가 HEAD라 비교할 chart 변경이 없어 그대로 통과한다.
          VALIDATE_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: ./scripts/validate.sh

      # Ansible lint는 validate.sh에 포함되어 workflow 문법만 별도로 확인한다.
      - name: Lint workflow
        run: actionlint
